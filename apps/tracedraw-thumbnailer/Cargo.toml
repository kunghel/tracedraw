[package]
name = "tracedraw-thumbnailer"
description = "Windows Explorer thumbnails of .tdraw drawings: a thumbnail provider (shell extension) that draws the first page"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tracedraw-core = { path = "../../crates/core" }
tracedraw-render = { path = "../../crates/render" }
tracedraw-text = { path = "../../crates/text" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-core = "0.62"
