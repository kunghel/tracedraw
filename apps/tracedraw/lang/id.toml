welcome.news.more = "Ingin tahu lebih banyak?" # mt
welcome.news.v0_51_1_body = "Langkah yang lama, seperti menyimpan gambar besar, tidak lagi memunculkan pesan yang menawarkan laporan: pesan itu muncul setiap kali berkas besar disimpan dan terlihat seperti kerusakan. Laporan hanya ditawarkan ketika TraceDraw benar-benar tertutup karena galat, dan kini menyimpan penyebab galatnya. Di macOS, TraceDraw tidak lagi tertutup ketika sebuah peristiwa datang saat peristiwa lain masih ditangani." # mt
welcome.news.v0_51_1_title = "Tidak ada lagi pesan “berhenti merespons”" # mt
welcome.news.v0_51_0_body = "Gambar besar tetap cepat: zoom dengan roda, memilih objek berefek, menyeret warna, dan mengetik teks panjang butuh lebih sedikit kerja, dan gambar besar memakai lebih sedikit memori. Pisahkan dengan Lubang membagi kurva dengan setiap lubang tetap di bagiannya, Tukar Isian dan Garis dari Isian ada di menu panel warna, dan Ratakan dan Sebarkan menyebar objek dengan margin sama di halaman. Simbol disunting di lembar bersih, penggaris vertikal bisa menghitung dari atas, gambar yang dikirim sebagai .zip terbuka saat dijatuhkan ke jendela, dan sel tabel rata dari atas ke bawah. Versi ini juga memperbaiki banyak bug yang Anda laporkan." # mt
welcome.news.v0_51_0_title = "Gambar besar lebih cepat, Pisahkan dengan Lubang dan gambar zip" # mt
welcome.news.v0_50_3_body = "Saat TraceDraw tidak merespons lebih dari 10 detik, atau tertutup karena galat, kini ia memberi tahu dan menawarkan pengiriman laporan tentang apa yang sedang dikerjakannya, tanpa nama atau isi gambar: Kirim Laporan membuka issue GitHub yang sudah terisi untuk Anda periksa dan kirim. Dengan halaman berhadapan, objek yang dilepas di halaman lain pada tampilan multihalaman kembali menjadi milik halaman itu, yang sempat rusak di 0.50.1." # mt
welcome.news.v0_50_3_title = "Laporan saat TraceDraw berhenti merespons, objek antarhalaman berhadapan" # mt
welcome.news.v0_50_2_body = "Versi ini memperbaiki dua laporan tentang 0.50.1. Berkas PDF/X dibuat untuk profil CMYK gambar itu sendiri, misalnya U.S. Web Coated (SWOP) v2, yang sebelumnya selalu tertulis FOGRA39. Blend di dalam bingkai klip mempertahankan langkah-langkahnya saat hanya seleksi yang diekspor sebagai gambar, yang sebelumnya keluar seperti anak tangga." # mt
welcome.news.v0_50_2_title = "Perbaikan: kondisi keluaran PDF/X dan blend dalam gambar ekspor" # mt
welcome.news.v0_50_1_body = "Versi ini memperbaiki yang kalian laporkan di 0.50.0. Di Windows, Bantuan > Pembaruan menyelesaikan pemasangan meski Explorer sedang menampilkan gambar .cdr, dan memberi tahu bila pembaruan tidak selesai. Dengan halaman berhadapan, objek dari kedua halaman yang dipilih bersama tetap di halamannya. Memisahkan grup mempertahankan bayangan grup, File > Kembalikan berfungsi untuk gambar yang dibuka dari .cdr, SVG, atau PDF, dan Simpan Sebagai kembali menampilkan jenis dan versi di Mac. File .cdr versi 15 terbuka dengan bayangan dan transparansinya, dan Bantuan menunjukkan langkah demi langkah cara memakai Pembuat Bentuk dan alat baru 0.50." # mt
welcome.news.v0_50_1_title = "Perbaikan: pembaruan di Windows, halaman berhadapan, pisahkan grup, Kembalikan, dan Simpan Sebagai" # mt
welcome.news.v0_50_0_body = "Amplop kini punya jaring yang membengkokkan bentuk dan gambar, dan Objek > Gabung Bentuk memecah, menyatukan, dan memotong objek yang bertumpuk dalam satu langkah. Pena Kelengkungan menggambar kurva halus melalui titik yang diklik, teks melengkung menjadi lingkaran, lengkungan, dan gelombang dari bilah teks, dan objek yang dipasang pada jalur mengikutinya secara langsung. Efek lapisan menambah tepi kasar, isian sketsa, tanda potong, dan tepi lembut, gradien bisa diberi dither dan mencampur titik warna bebas, dan isian bisa holografik. Putar 3D, Kilau Cahaya, Ubah Masing-masing, dan Ratakan Transparansi adalah baru, dan antarmuka tersedia dalam bahasa Vietnam. Versi ini juga memperbaiki banyak bug yang Anda laporkan, dari pencetakan dan impor PDF hingga penyimpanan .cdr dan penjiplakan." # mt
welcome.news.v0_50_0_title = "Amplop jaring, Gabung Bentuk, Pena Kelengkungan dan efek langsung" # mt
welcome.news.v0_49_0_body = "Versi ini berisi perbaikan. Penyimpanan yang gagal di tengah jalan tidak lagi menghilangkan file yang digantikannya, dan cadangan otomatis dari dua TraceDraw, atau dari dua gambar bernama sama, tidak lagi saling menimpa. Gambar besar tetap cepat: Group, Combine, Ungroup, dan Undo pada puluhan ribu objek hanya butuh sepersekian detik, dan gambar yang bersarang dalam terbuka lagi. Disimpan sebagai .cdr, gambar mempertahankan lapisan tersembunyi, isian pola dan mesh, emoji, pemisah baris, dan gradasi warna spot. File PDF, SVG, EPS, dan EMF masuk dan keluar lebih dekat dengan yang ditampilkannya: teks bergaris tepi, gradasi, transparansi bertahap, gambar yang diputar, Ibrani, dan Arab. Convert to Curves mempertahankan warna setiap kata, garis bantu dapat diambil di atas objek apa pun, dan Combine memilih hasilnya. Di Windows, TraceDraw tidak lagi memperlambat seluruh komputer dengan menjalankan proses setiap beberapa detik, dan di tablet Shift, Ctrl, dan Alt terkunci dengan dua ketukan." # mt
welcome.news.v0_49_0_title = "Penyimpanan lebih aman, impor lebih setia, dan gambar besar lebih cepat" # mt
welcome.news.v0_48_0_body = "Versi ini berisi perbaikan. Di teks, Shift+Enter memutus baris, butir bernomor kembali terbaca, huruf kapital awal mengikuti jumlah barisnya, dan Ubah ke Kurva mempertahankan huruf yang bertumpuk. Penjiplakan berjalan di jendela dengan kemajuan dan tombol Batal, sehingga program tidak lagi tampak membeku. Gambar yang diekspor mempertahankan semua tepi halaman tanpa garis terang di tepinya, dan menyimpan sebagai .cdr tidak lagi menghilangkan garis tanpa panjang. Gambar yang diimpor mempertahankan mode warnanya, klon di file .cdr tetap terhubung ke aslinya, dan transparansi pola serta font kanan-ke-kiri dari .cdr terbuka. Di layar sentuh, Pena melanjutkan dari simpul terakhir, garis 2 titik mengikuti jari, dan baris panel Objek dapat diseret. Garis panduan punya menu di panel Objek, kisi dimulai dari atas halaman, dan file DXF dengan blok bersarang dalam tidak lagi menghabiskan memori. File .ai klasik dari program penjiplakan terbuka berwarna dan terkelompok, dan Enter di kotak Kontur menerapkan kontur." # mt
welcome.news.v0_48_0_title = "Perbaikan teks, penjiplakan, ekspor, dan layar sentuh" # mt
welcome.news.v0_47_0_body = "Alat Pembangun Bentuk menggabungkan atau membuang bagian objek yang bertumpuk dengan satu seretan, dan alat Sambung menyambung ujung-ujung kurva dengan satu goresan. Lembar kerja (.xlsx, CSV, TSV) terbuka sebagai tabel yang dapat diedit, rumus dimasukkan lewat Objek > Sisipkan > Rumus, dan teks dapat berjalan dari kanan ke kiri, dengan butir bernomor dan kolom yang lebarnya berbeda. Cetak membagi poster ke beberapa lembar kertas, menaruh setiap pelat di berkasnya sendiri dengan raster halftone-nya, dan mencetak bolak-balik secara manual. Efek Lapisan menumpuk cahaya, bevel, dan bayangan secara langsung pada objek. Bantuan > Benchmark memberi nilai komputer, dan Zoom ringan membantu komputer yang lambat. Berkas .cdr mempertahankan kurva B-spline, perspektif, dan transparansi radialnya. Perbaikan dari video Anda: bayangan tetap pada objeknya dan dapat dipisahkan, kotak zoom menunjukkan zoom yang sebenarnya, setiap palet bergulir sendiri, Pilih Semua melewati objek yang terkunci, dan tab panel mempertahankan namanya. File .tdraw jauh lebih kecil: setiap gambar disimpan sekali saja, terkompresi, dan JPEG yang diimpor tetap seperti aslinya, dengan bilah pemuatan untuk file besar. File lama tetap terbuka, tetapi file yang disimpan dengan 0.47 atau lebih baru hanya terbuka di 0.47 atau lebih baru." # mt
welcome.news.v0_47_0_title = "Pembangun Bentuk, lembar kerja, rumus, dan cetak poster" # mt
welcome.news.v0_46_0_body = "Perspektif berfungsi pada gambar, dan klik pada langkah-langkah blend memilih seluruh blend. Ubah Garis Tepi ke Objek, Las, Pangkas, dan Gabungkan berfungsi di dalam grup, Ratakan Efek melepaskan bayangan, dan objek yang diseret ke panel Gaya Warna menjadi gaya warna. Warna palet mengisi sel tabel yang dipilih dengan alat Pilih atau Bentuk, dan kolom skala menunjukkan seberapa besar objek diskalakan. Pratinjau Cetak memutar satu halaman sendiri dan mempertahankan objek yang melintasi punggung halaman berhadapan, PDF dapat dibuka sebagai gambar, dan ekspor PDF mempertahankan transparansi gradien dan bayangan. File DXF terbuka di AutoCAD, teks artistik dari .cdr berada di tempat file meletakkannya, dan file yang dijatuhkan ke jendela di Windows tidak lagi hilang." # mt
welcome.news.v0_46_0_title = "Perspektif pada gambar, sel tabel, dan perbaikan Pratinjau Cetak" # mt
