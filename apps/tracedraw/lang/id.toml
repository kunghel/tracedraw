web.notice_title = "TraceDraw di peramban Anda"
web.notice_text = "**Peramban lebih lambat:** gambar besar, efek berat, dan berkas besar butuh waktu lebih lama, fon yang terpasang di komputer Anda tidak tersedia (fon gratis diambil dari katalog halaman saat gambar membutuhkannya, dan fon yang Anda tambahkan di Pengelola Fon disimpan), dan berkas dibuka dengan diunggah serta disimpan sebagai unduhan.\n\nIni program Rust yang sama dengan aplikasi desktop, dikompilasi ke WebAssembly agar bisa dicoba tanpa memasang apa pun.\n\nUntuk pekerjaan sungguhan dan berkas besar, gunakan aplikasi untuk Windows, macOS, atau Linux: berjalan secara native, dengan kecepatan penuh." # mt
