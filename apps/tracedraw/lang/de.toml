welcome.learn_2_body = "Klicken zum Auswählen, erneut klicken für Dreh- und Neigungsgriffe, Ecken ziehen zum Skalieren. Pfeiltasten verschieben schrittweise; Umschalt+Pfeiltasten um das Zehnfache."
welcome.learn_2_title = "Auswählen und transformieren"
welcome.learn_3_body = "Linksklick auf eine Palettenfarbe für die Füllung, Rechtsklick für den Umriss. Der Bereich Eigenschaften bearbeitet Verläufe, Muster, Texturen und Gitter."
welcome.learn_3_title = "Füllungen und Umrisse"
welcome.learn_4_body = "Das Hilfsmittel Form (F10) bearbeitet Knoten: Doppelklick auf ein Segment fügt einen Knoten hinzu, Doppelklick auf einen Knoten löscht ihn; die Eigenschaftsleiste bietet spitz, glatt und symmetrisch."
welcome.learn_4_title = "Knoten"
welcome.learn_5_body = "Effekte bleiben bearbeitbar: Den Bereich des Effekts im Menü Effekte öffnen, Werte ändern, und das Objekt wird aktualisiert. Effekte reduzieren macht sie dauerhaft."
welcome.learn_5_title = "Effekte"
welcome.my_templates = "Meine Vorlagen"
welcome.new_document = "Neues Dokument"
welcome.new_from_template = "Neu aus Vorlage"
welcome.news.more = "Mehr erfahren?" # mt
welcome.news.v0_53_0_body = "Objekt > Einfügen > Diagramm aus Daten zeichnet eine Tabelle als Säulen, Balken, Linien oder Kreis. Formen verschmelzen folgt einem gezogenen Objekt flüssig, nimmt Kopien und weitere Objekte auf, und In Kurven umwandeln behält die Farbe. Live kombinieren funktioniert in jedem Modus, Ecken abrunden und Zerteilen kommen zu den Ebeneneffekten, und das Bedienfeld Symbolstreuung erhält einen Pinsel. Ebenen können auf einem gewählten Seitenbereich erscheinen, Broschüren fassen 16 Seiten pro Seite mit Verdrängung, der PDF-Export kann Bilder auf eine Ziel-Dateigröße komprimieren, und Kontextmenüs lassen sich anpassen. Zeichnungen mit Tausenden von Texten öffnen und scrollen viel schneller. Diese Version behebt außerdem viele gemeldete Fehler." # mt
welcome.news.v0_53_0_title = "Diagramme aus Daten, flüssigeres Formen verschmelzen und Ebenen auf Seitenbereichen" # mt
welcome.news.v0_52_0_body = "Ein Doppelklick auf ein Bild öffnet einen vollständigen Bildbearbeitungsmodus mit eigener Werkzeugleiste, einer Taste für jedes Werkzeug, neuen Masken und Pinseln sowie den Menüs Bild und Anpassen. Standardformen bleiben nach dem Zeichnen anpassbar, mit rautenförmigen Griffen für eine Pfeilspitze, eine abgerundete Ecke oder den Zeiger einer Sprechblase. Speichern und Exportieren einer großen Zeichnung laufen im Hintergrund mit Fortschrittsanzeige, PostScript-Drucker unter Windows behalten die CMYK-Werte, und im Objekte-Andockfenster lassen sich mehrere Ebenen auf einmal wählen. Diese Version behebt außerdem viele gemeldete Fehler." # mt
welcome.news.v0_52_0_title = "Ein vollständiger Bildbearbeitungsmodus, anpassbare Standardformen und Speichern im Hintergrund" # mt
welcome.news.v0_51_1_body = "Ein Schritt, der lange dauert, etwa das Speichern einer großen Zeichnung, bringt keine Meldung mehr, die einen Bericht anbietet: Sie kam bei jedem Speichern einer großen Datei und wirkte wie ein Absturz. Ein Bericht wird nur angeboten, wenn TraceDraw wirklich wegen eines Fehlers beendet wurde, und er behält jetzt die Ursache des Fehlers. Unter macOS wird TraceDraw nicht mehr beendet, wenn ein Ereignis eintrifft, während ein anderes noch verarbeitet wird." # mt
welcome.news.v0_51_1_title = "Keine Meldungen „reagiert nicht mehr“ mehr" # mt
welcome.news.v0_51_0_body = "Große Zeichnungen bleiben schnell: Zoomen mit dem Mausrad, Auswählen von Objekten mit Effekten, Ziehen von Farben und Tippen in langen Texten kosten weniger Arbeit, und große Bilder brauchen weniger Speicher. Trennen mit Löchern teilt eine Kurve und lässt jedes Loch in seinem Teil, Füllungen tauschen und Umriss aus Füllung stehen im Menü des Farbfelds, und Ausrichten und Verteilen verteilt Objekte mit gleichen Rändern auf der Seite. Symbole werden auf einem leeren Blatt bearbeitet, das senkrechte Lineal kann von oben zählen, eine als .zip gesendete Zeichnung öffnet sich beim Ablegen im Fenster, und Tabellenzellen richten sich von oben nach unten aus. Diese Version behebt außerdem viele gemeldete Fehler." # mt
welcome.news.v0_51_0_title = "Schnellere große Zeichnungen, Trennen mit Löchern und gezippte Zeichnungen" # mt
welcome.news.v0_50_3_body = "Wenn TraceDraw länger als 10 Sekunden nicht reagiert oder wegen eines Fehlers beendet wird, sagt es das jetzt und bietet an, einen Bericht darüber zu senden, was es tat, ohne Namen oder Inhalt der Zeichnung: Bericht senden öffnet ein ausgefülltes GitHub-Issue zum Prüfen und Senden. Bei gegenüberliegenden Seiten gehört ein Objekt, das in der Mehrseitenansicht auf einer anderen Seite losgelassen wird, wieder zu dieser Seite, was 0.50.1 kaputt gemacht hatte." # mt
welcome.news.v0_50_3_title = "Berichte, wenn TraceDraw nicht mehr reagiert, Objekte über gegenüberliegende Seiten" # mt
welcome.news.v0_50_2_body = "Diese Version behebt zwei Meldungen zur 0.50.1. Eine PDF/X-Datei wird für das CMYK-Profil der Zeichnung selbst erstellt, zum Beispiel U.S. Web Coated (SWOP) v2, wo sie immer FOGRA39 angab. Eine Überblendung in einem Beschnittrahmen behält ihre Schritte, wenn nur die Auswahl als Bild exportiert wird, wo sie als Treppe herauskamen." # mt
welcome.news.v0_50_2_title = "Korrekturen: PDF/X-Ausgabebedingung und Überblendungen in exportierten Bildern" # mt
welcome.news.v0_50_1_body = "Diese Version behebt, was ihr zur 0.50.0 gemeldet habt. Unter Windows schließt Hilfe > Updates die Installation ab, auch wenn der Explorer .cdr-Bilder anzeigt, und meldet, wenn ein Update nicht fertig wurde. Bei gegenüberliegenden Seiten bleiben gemeinsam ausgewählte Objekte beider Seiten auf ihrer Seite. Gruppierung aufheben behält den Schatten der Gruppe, Datei > Zurücksetzen funktioniert für aus .cdr, SVG oder PDF geöffnete Zeichnungen, und Speichern unter zeigt auf dem Mac wieder Typ und Version. .cdr-Dateien der Version 15 öffnen sich mit Schatten und Transparenzen, und die Hilfe zeigt Schritt für Schritt, wie man den Formgenerator und die neuen Werkzeuge der 0.50 benutzt." # mt
welcome.news.v0_50_1_title = "Korrekturen: Updates unter Windows, gegenüberliegende Seiten, Gruppierung aufheben, Zurücksetzen und Speichern unter" # mt
welcome.news.v0_50_0_body = "Hüllen bekommen ein Gitter, das Formen und Bilder biegt, und Objekt > Formen kombinieren zerlegt, vereint und schneidet überlappende Objekte in einem Schritt. Der Kurvenstift zeichnet glatte Kurven durch die geklickten Punkte, Text biegt sich über die Textleiste zu Kreis, Bogen und Welle, und an einen Pfad angepasste Objekte folgen ihm live. Ebeneneffekte bringen raue Kanten, Skizzenfüllungen, Schnittmarken und weiche Kanten, Verläufe können gerastert werden und freie Farbpunkte mischen, und Füllungen können holografisch sein. 3D-Rotation, Lichtreflex, Einzeln transformieren und Transparenz reduzieren sind neu, und die Oberfläche gibt es auf Vietnamesisch. Diese Version behebt außerdem viele gemeldete Fehler, vom Drucken und PDF-Import bis zum Speichern als .cdr und zum Nachzeichnen." # mt
welcome.news.v0_50_0_title = "Gitterhüllen, Formen kombinieren, Kurvenstift und Live-Effekte" # mt
welcome.news.v0_49_0_body = "Diese Version bringt Korrekturen. Ein Speichern, das mittendrin scheitert, verliert nicht mehr die Datei, die es ersetzen sollte, und die automatischen Sicherungen zweier TraceDraws oder zweier gleichnamiger Zeichnungen überschreiben sich nicht mehr. Große Zeichnungen bleiben schnell: Gruppieren, Kombinieren, Gruppierung aufheben und Rückgängig mit Zehntausenden Objekten dauern einen Bruchteil einer Sekunde, und tief verschachtelte Zeichnungen öffnen sich wieder. Als .cdr gespeichert behält eine Zeichnung ihre ausgeblendeten Ebenen, Muster- und Gitterfüllungen, Emojis, Zeilenumbrüche und Verläufe aus Volltonfarben. PDF-, SVG-, EPS- und EMF-Dateien kommen näher an dem herein und hinaus, was sie zeigen: Text mit Kontur, Verläufe, verlaufende Transparenzen, gedrehte Bilder, Hebräisch und Arabisch. In Kurven umwandeln behält die Farbe jedes Wortes, eine Hilfslinie lässt sich über jedem Objekt greifen, und Kombinieren wählt das Ergebnis aus. Unter Windows bremst TraceDraw nicht mehr den ganzen Computer, indem es alle paar Sekunden einen Prozess startet, und auf Tablets rasten Umschalt, Strg und Alt mit zwei Tipps ein." # mt
welcome.news.v0_49_0_title = "Sichereres Speichern, treuere Importe und schnellere große Zeichnungen" # mt
welcome.news.v0_48_0_body = "Diese Version bringt Korrekturen. Im Text bricht Umschalt+Eingabe die Zeile um, nummerierte Aufzählungen sind wieder lesbar, Initialen halten ihre Zeilenzahl ein, und In Kurven umwandeln behält überlappende Buchstaben. Das Vektorisieren läuft in einem Fenster mit Fortschritt und Abbrechen, sodass das Programm nicht mehr eingefroren wirkt. Exportierte Bilder behalten alle Seitenränder ohne hellen Strich am Rand, und das Speichern als .cdr lässt Linien der Länge null nicht mehr weg. Importierte Bilder behalten ihren Farbmodus, Klone in .cdr-Dateien bleiben mit ihrem Original verbunden, und Muster-Transparenzen sowie Rechts-nach-links-Schriften aus .cdr öffnen. Auf Touchscreens setzt der Stift am letzten Knoten fort, die 2-Punkt-Linie folgt dem Finger, und Zeilen im Andockfenster Objekte lassen sich ziehen. Hilfslinien haben ein Menü im Andockfenster Objekte, das Raster beginnt oben an der Seite, und eine DXF-Datei mit tief verschachtelten Blöcken bringt den Speicher nicht mehr an seine Grenze. Klassische .ai-Dateien aus Vektorisierungsprogrammen öffnen farbig und gruppiert, und Eingabe in den Feldern von Kontur wendet die Kontur an." # mt
welcome.news.v0_48_0_title = "Korrekturen bei Text, Vektorisieren, Export und Touchscreens" # mt
