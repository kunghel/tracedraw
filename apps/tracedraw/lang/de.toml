web.notice_title = "TraceDraw im Browser"
web.notice_text = "**Ein Browser ist langsamer:** große Zeichnungen, aufwendige Effekte und große Dateien brauchen länger, die auf Ihrem Computer installierten Schriften stehen nicht bereit (freie Schriften kommen aus dem Katalog der Seite, wenn eine Zeichnung sie braucht, und im Schriftenmanager hinzugefügte Schriften bleiben erhalten), und Dateien werden hochgeladen und als Downloads gespeichert.\n\nDas ist dasselbe Rust-Programm wie die Desktop-App, nach WebAssembly kompiliert, damit Sie es ohne Installation ausprobieren können.\n\nFür echte Arbeit und große Dateien nehmen Sie die Desktop-App für Windows, macOS oder Linux: Sie läuft nativ, mit voller Geschwindigkeit." # mt
