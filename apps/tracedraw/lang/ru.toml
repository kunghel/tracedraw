hintstep.pick.5 = "Shift+щелчок добавляет объект в выделение или убирает его; Ctrl+щелчок выделяет объект внутри группы; Alt+щелчок выделяет объект под ним." # mt
hintstep.freehand_pick.1 = "Обведите петлёй нужные объекты. Когда вы отпустите кнопку, будут выделены все объекты, целиком попавшие внутрь петли." # mt
hintstep.freehand_pick.2 = "Удерживайте Alt при отпускании, чтобы выделить все объекты, которых касается петля." # mt
