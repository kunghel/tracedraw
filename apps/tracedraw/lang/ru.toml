hintstep.free_transform.3 = "Свободное масштабирование меняет размер объекта от точки нажатия, а Свободный наклон наклоняет его." # mt
hintstep.free_transform.4 = "На время одного перетаскивания удерживайте Alt для масштабирования, Ctrl для наклона или Shift для отражения. Если включено Применить к копии, перетаскивание преобразует копию." # mt
