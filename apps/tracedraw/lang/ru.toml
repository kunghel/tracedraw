# Hints panel: the steps of each tool's page (ui/hint_pics.rs)
hintstep.pick.1 = "Щёлкните объект, чтобы выделить его. Вокруг появятся восемь маркеров." # mt
hintstep.pick.2 = "Перетащите объект, чтобы переместить его. Перетащите угловой маркер, чтобы пропорционально изменить размер, или боковой, чтобы растянуть объект." # mt
hintstep.pick.3 = "Щёлкните выделенный объект ещё раз, чтобы показать маркеры поворота: перетащите угловую стрелку для поворота, боковую для наклона." # mt
