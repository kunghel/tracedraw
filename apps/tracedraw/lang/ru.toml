welcome.news.more = "Хотите узнать больше?" # mt
welcome.news.v0_41_body = "На сенсорных экранах кнопки Shift, Ctrl и Alt позволяют пальцу делать то же, что удерживаемые клавиши, а сочетания с Alt открывают любое меню, даже в узком окне. На Android интерфейс не заходит под вырез камеры и скруглённые углы, а Слияние данных может брать изображения из папки; в браузере Apple Pencil работает в Safari на iPad, а WebP можно сохранять со сжатием с потерями для меньших файлов. Файлы .cdr сохраняют правило заливки перекрывающихся кривых, поэтому трассированные надписи больше не показывают белых промежутков, и открываются со своими позициями табуляции, текстом в несколько колонок, направляющими, общими для всех страниц, и объектами главной страницы. Импортированные файлы размещаются курсором, Повторить повторяет целую группу действий, а точки B-сплайна могут быть закреплёнными или плавающими. Можно обрезать пиксели изображения, печатать в оттенках серого или в обратном порядке в пределах реальных полей принтера, а изображения CMYK сохраняют прозрачность. Полосы прокрутки можно скрыть, палитра может взять цвета из изображения, а в Windows заголовок окна следует тёмной теме." # mt
welcome.news.v0_41_title = "Сенсорные клавиши, лучшие файлы .cdr и обрезка изображений" # mt
welcome.news.v0_42_1_body = "32-битный установщик Windows теперь устанавливается и на 64-битную Windows, предварительно рекомендуя 64-битный установщик, который там подходит лучше. В списке загрузок каждой версии каждый файл указан по системе, первым идёт 64-битный установщик для Windows." # mt
welcome.news.v0_42_1_title = "Установщик для любой Windows" # mt
welcome.news.v0_42_body = "Страницы можно показывать рядом разворотами с помощью функции «Развороты», а при импорте многостраничного PDF программа спрашивает, какие страницы и куда поместить. Тексты можно связать, чтобы набранное в одном появлялось в остальных. «Повтор копий» может заполнить копиями всю страницу, а макеты печати можно сохранять как наборы настроек и нумеровать по столбцам для билетов и карточек. На сенсорных экранах длинные панели инструментов, набор инструментов и палитра прокручиваются пальцем. Ctrl+Tab переключает открытые рисунки, направляющие из файлов .cdr можно выделять и перемещать, новые символы сохраняют маркеры, тень изображения повторяет его форму, Ctrl рисует правильные многоугольники, а Навигатор показывает весь рисунок." # mt
welcome.news.v0_42_title = "Развороты, выбор страниц PDF и связанный текст" # mt
welcome.news.v0_43_body = "TraceCut превращает фигуры в G-код для фрезерного станка с ЧПУ, расставляет люверсы и рисует плоские детали коробки на шипах или гнутой кассеты, готовые к резке. Экспорт сначала спрашивает файл, а затем показывает параметры формата, а установка обновления показывает ход работы в отдельном окне. На панели Текст есть кнопка для каждой функции OpenType и новые стили символов, например двойное подчёркивание и все прописные; у заливок появились процедурные узоры и размещение узора, а наконечники стрелок можно масштабировать, сдвигать и отражать. Интерфейс доступен на лаосском языке, а имена файлов на иврите и в других письменностях сохраняют свои буквы. Слияние данных умеет печатать для резки стопкой и создавать случайные номера для билетов. На сенсорных экранах касание двумя пальцами отменяет действие, а тремя повторяет его. Выделить похожие выбирает объекты, похожие на выделенные, Мои фигуры хранят ваши собственные фигуры среди основных фигур, а у контура есть маркеры, которые можно перетаскивать на рисунке." # mt
welcome.news.v0_43_title = "Траектории ЧПУ, коробки и новые заливки" # mt
welcome.news.v0_45_2_body = "Инструменты «Указатель» и «Фигура» выбирают ячейки таблицы, а Ctrl+Shift+> и Ctrl+Shift+< раздвигают или сближают буквы текста. Книги, свёрстанные разворотами в файлах .cdr, открываются разворотами. При изменении размера страницы рисунок остаётся по центру, пустая рамка абзацного текста показывает подсказку, а на панели инструмента «Фигура» есть поля шрифта и размера для текста. Контекстное меню панели «Объекты» группирует, скрывает, блокирует и задаёт наложение, пипетки могут возвращаться к взятию образца после каждого применения, в заголовке окна показан полный путь к файлу, а указатель Пера повёрнут правильно." # mt
welcome.news.v0_45_2_title = "Ячейки таблиц, клавиши межбуквенного интервала и развороты из .cdr" # mt
welcome.news.v0_45_1_body = "TraceDraw 0.45.0 не запускался на некоторых старых видеокартах, в основном в Linux: программа закрывалась до появления окна. Эта версия снова запускается на них, а тени размываются так же, как до версии 0.45.0." # mt
welcome.news.v0_45_1_title = "Снова запускается на старых видеокартах" # mt
welcome.news.v0_45_0_body = "Инструменты > Перекрасить меняет сразу все цвета выделения, сохраняя света и тени, а Правка > Повторить для похожих повторяет последнее действие для всех похожих объектов. Преобразовать в кривые, Объединить, Обрезать и Пересечение работают с группой. Экспорт DXF открывается в AutoCAD, Предварительный просмотр печати показывает каждую форму цветоделения, таблицы меняют размер ячеек, палитра документа собирает все использованные цвета, символы из .cdr открываются как символы, а окно Объекты выделяет диапазоны с Shift. Большие тени можно размывать на видеокарте, а увеличение больших рисунков стало намного быстрее." # mt
welcome.news.v0_45_0_title = "Перекраска, Повтор для похожих и группы, которые можно формовать" # mt
welcome.news.v0_44_2_body = "Файлы .tdraw записываются компактно и становятся в несколько раз меньше. Группы, таблицы и рамки выбираются только там, где у них есть объекты, а в многостраничном режиме объект, перенесённый на другую страницу, относится к этой странице. Преобразование в растр сохраняет толстые контуры и краски CMYK, а режим оттенков серого преобразует изображение. Файлы .cdr сохраняют заблокированные объекты заблокированными, а палитры Pantone из CorelDRAW открываются с именами и плашечными цветами. Фестончатые и скошенные углы остаются редактируемыми, копирование оболочки вписывает в неё объект, кривая B-сплайна больше не прыгает при рисовании, каллиграфическая кисть рисует гладкие штрихи, радиальная прозрачность совпадает с CorelDRAW, а экспорт выделения сохраняет весь контур. Трассировка сохраняет рисунок, уходящий за прозрачный край, вытягивание сохраняет сетчатую заливку при перемещении, а направляющие вращаются вокруг перемещённого центра." # mt
welcome.news.v0_44_2_title = "Файлы .tdraw меньше, точнее выбор и радиальная прозрачность" # mt
welcome.news.v0_44_1_body = "Перетекание между двумя текстами оставляет шаги за передним текстом после того, как оба сгруппированы или перекрашены. Файлы .cdr открывают скруглённые прямоугольники с их собственными углами, а фигурный текст — с оболочкой, которая всё ещё изгибает его. В Linux объекты, скопированные в TraceDraw, вставляются в другие программы как изображение, а опубликованные макросы раскладки доходят до конца. Двойные щелчки инструментом «Свободная форма» рисуют линию из углов, размер шрифта, введённый для ячейки таблицы, меняет размер её текста, а удержание Delete на выбранных узлах удаляет только эти узлы. Пока импортированное изображение ждёт своего места, подсказка у указателя говорит, что делать, вкладки страниц сохраняют имена по порядку, а «Повторить» вращает копии вокруг перемещённого центра вращения." # mt
welcome.news.v0_44_1_title = "Сгруппированные перетекания, углы и оболочки .cdr, копирование в другие программы" # mt
welcome.news.v0_44_body = "Эта версия исправляет проблемы, выявленные видеообзором версии 0.43: Вытягивание удерживает повёрнутое в пространстве тело на месте, а его грани в правильном порядке, и скос на тексте больше не заворачивается сам на себя. Тени сохраняют отверстие кольца, вытянутый объект отбрасывает тень вместе со своим телом, группа отбрасывает одну блочную тень, а оболочка на вытянутом объекте изгибает всё тело. Скругление углов работает на кривых сторонах, Сглаживание скругляет обе стороны там, где замыкается преобразованный прямоугольник или звезда, клавиши C, S и Y делают узлы острыми, гладкими или симметричными, Выделить похожие заглядывает внутрь групп, сокращение узлов сохраняет кривые кривыми, Преобразовать в растровое изображение оставляет картинку на месте объектов в порядке наложения, а Размытие плавно вытягивает контур. Предварительный просмотр печати может показать одну краску в её собственном цвете, вся страница остаётся видна при масштабировании и прокрутке, панель Свойства одним щелчком показывает один раздел, а новые клавиши инвертируют выделение, показывают направляющие и сетку и распределяют объекты. Файлы .cdr открываются с таблицами и буквами с диакритикой из старых версий, пустые объекты больше не считаются нечитаемыми, а TraceCut раскладывает объект с оболочкой по той форме, которую он показывает. В Windows указатели инструментов следуют за мышью без задержки, а файл открытого рисунка нельзя удалить или переместить; тайские имена файлов показывают свои буквы, поля экрана в Android получили разумные пределы, а текст на хинди из PDF приходит таким, каким его набрали." # mt
welcome.news.v0_44_title = "Исправления вытягивания, теней и правки" # mt
