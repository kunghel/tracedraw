web.notice_title = "TraceDraw в браузере"
web.notice_text = "**В браузере всё медленнее:** большие рисунки, тяжёлые эффекты и большие файлы обрабатываются дольше, шрифты, установленные на компьютере, недоступны (свободные шрифты загружаются из каталога страницы, когда они нужны рисунку, а шрифты, добавленные в Диспетчере шрифтов, сохраняются), файлы открываются загрузкой и сохраняются как скачивания.\n\nЭто та же программа на Rust, что и настольное приложение, скомпилированная в WebAssembly, чтобы попробовать её без установки.\n\nДля настоящей работы и больших файлов используйте приложение для Windows, macOS или Linux: оно работает нативно, на полной скорости." # mt
web.notice_download = "Скачать настольное приложение"
web.notice_store = "Получить в Microsoft Store"
web.notice_store_note = "В Windows TraceDraw также есть в Microsoft Store: он подписан и обновляется самой Windows. Каждая версия сначала проходит сертификацию магазина, поэтому версия из Microsoft Store может отставать от последней загрузки на один или несколько выпусков."
