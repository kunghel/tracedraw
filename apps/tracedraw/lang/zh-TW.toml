welcome.news.more = "想了解更多？" # mt
welcome.news.v0_53_0_body = "物件 > 插入 > 由資料產生圖表可將表格繪製為直條、橫條、折線或圓形圖。合併形狀會流暢地跟隨拖曳的物件，可加入副本與更多物件，轉換為曲線時保留其填色。即時組合適用於所有模式，圓角與切片加入了圖層效果，符號散佈面板新增筆刷。圖層可以只在選定的頁面範圍顯示，小冊子支援每面16頁並帶爬移，PDF 匯出可將圖片壓縮到目標檔案大小，右鍵選單可以自訂。包含數千段文字的繪圖開啟與平移都快得多。此版本也修正了大家回報的許多錯誤。" # mt
welcome.news.v0_53_0_title = "由資料產生圖表、更流暢的合併形狀、圖層依頁面範圍顯示" # mt
welcome.news.v0_52_0_body = "雙擊圖片會開啟完整的影像編輯模式，擁有自己的工具箱、每個工具的快速鍵、新的遮罩與筆刷，以及「影像」和「調整」選單。基本形狀在繪製後仍可調整，菱形控點可改變箭頭的頭部、圓角或標註的尾巴。儲存與匯出大型繪圖在背景進行並顯示進度，Windows 上的 PostScript 印表機保留 CMYK 值，並且可以在「物件」面板中一次選取多個圖層。此版本也修正了你們回報的許多錯誤。" # mt
welcome.news.v0_52_0_title = "完整的影像編輯模式、可調整的基本形狀與背景儲存" # mt
welcome.news.v0_51_1_body = "耗時較長的步驟（例如儲存大型繪圖）不再跳出建議傳送報告的訊息：以前每次儲存大檔案都會出現，看起來像是當機。只有 TraceDraw 確實因錯誤而關閉時才會提供報告，而且報告現在會保留錯誤的原因。在 macOS 上，當一個事件仍在處理時又收到另一個事件，TraceDraw 不再關閉。" # mt
welcome.news.v0_51_1_title = "不再顯示「停止回應」訊息" # mt
welcome.news.v0_51_0_body = "大型圖稿保持流暢：滾輪縮放、選取帶效果的物件、拖曳顏色與在長文字中輸入都更省力，大圖片佔用的記憶體更少。保留孔洞拆分會拆開曲線並把每個孔留在所屬部分，交換填色與以填色設外框位於顏色面板選單中，對齊與分佈可在頁面上以相等邊距排列物件。符號在乾淨的畫布上編輯，垂直尺規可由上往下計數，以 .zip 傳送的圖稿拖到視窗即可開啟，表格儲存格可上下對齊。此版本也修正了大量你們回報的問題。" # mt
welcome.news.v0_51_0_title = "大型圖稿更快、保留孔洞拆分與 zip 圖稿" # mt
welcome.news.v0_50_3_body = "當 TraceDraw 超過 10 秒沒有回應，或因錯誤關閉時，現在會告訴你，並提議傳送一份當時在做什麼的報告，不含繪圖的名稱或內容：「傳送報告」會開啟一個已填好的 GitHub 問題，供你檢查後傳送。使用對頁時，在多頁檢視中放到另一頁的物件重新屬於該頁，這在 0.50.1 中曾經壞掉。" # mt
welcome.news.v0_50_3_title = "TraceDraw 停止回應時的報告、對頁之間的物件" # mt
welcome.news.v0_50_2_body = "此版本修正了關於 0.50.1 的兩個回報。PDF/X 檔案依繪圖本身的 CMYK 描述檔製作，例如 U.S. Web Coated (SWOP) v2，以前一律標為 FOGRA39。裁切框內的漸變在只將選取範圍匯出為圖片時會保留其步驟，以前會變成階梯狀。" # mt
welcome.news.v0_50_2_title = "修正：PDF/X 輸出條件與匯出圖片中的漸變" # mt
welcome.news.v0_50_1_body = "此版本修正了大家在 0.50.0 回報的問題。在 Windows 上，即使檔案總管正在顯示 .cdr 圖片，說明 > 更新 也能完成安裝，更新未完成時會提示。使用對頁時，兩頁上一起選取的物件會留在各自的頁面。取消群組會保留群組的陰影，檔案 > 還原 適用於從 .cdr、SVG 或 PDF 開啟的繪圖，Mac 上的 另存新檔 重新顯示類型和版本。版本 15 的 .cdr 檔案開啟時帶有陰影和透明度，說明中逐步介紹如何使用形狀產生器和 0.50 的新工具。" # mt
welcome.news.v0_50_1_title = "修正：Windows 更新、對頁、取消群組、還原和另存新檔" # mt
welcome.news.v0_50_0_body = "封套新增可彎曲形狀與圖片的網格，物件 > 組合形狀可一步拆分、合併與裁切重疊物件。曲率鋼筆透過點擊的點繪製平滑曲線，文字可從文字列彎成圓形、拱形與波浪，貼合路徑的物件會即時跟隨路徑。圖層效果新增粗糙邊緣、素描填色、裁切標記與柔化邊緣，漸層可加抖動並混合自由色點，填色可以是全像效果。3D 旋轉、光暈、逐一變形與平面化透明度是新功能，介面新增越南文。此版本也修正了大量你們回報的問題，從列印與 PDF 匯入到 .cdr 儲存與描圖。" # mt
welcome.news.v0_50_0_title = "網格封套、組合形狀、曲率鋼筆與即時效果" # mt
welcome.news.v0_49_0_body = "本版本以修正為主。中途失敗的儲存不再遺失它要取代的檔案，兩個 TraceDraw 或兩個同名繪圖的自動備份也不再互相覆寫。大型繪圖保持流暢：對數萬個物件執行群組、合併、取消群組和復原只需不到一秒，深層巢狀的繪圖也能再次開啟。儲存為 .cdr 時，繪圖會保留隱藏圖層、圖樣與網狀填色、表情符號、換行以及特別色漸層。PDF、SVG、EPS 和 EMF 檔案的匯入匯出更接近其顯示效果：有外框的文字、漸層、漸變透明度、旋轉的圖片、希伯來文和阿拉伯文。轉換為曲線會保留每個字的顏色，參考線可以在任何物件上方拖曳，合併會選取其結果。在 Windows 上，TraceDraw 不再每隔幾秒啟動一個程序而拖慢整台電腦；在平板上，Shift、Ctrl 和 Alt 輕點兩下即可鎖定。" # mt
welcome.news.v0_49_0_title = "更安全的儲存、更準確的匯入、更快的大型繪圖" # mt
welcome.news.v0_48_0_body = "此版本以修正為主。在文字中，Shift+Enter 可以換行，編號項目符號重新可讀，首字放大維持設定的行數，「轉換為曲線」保留重疊的字母。描圖在一個顯示進度並有「取消」按鈕的視窗中進行，程式不再看起來像當掉。匯出的圖片保留頁面的所有邊緣，邊上不再有淺色線條，另存為 .cdr 也不再漏掉長度為零的線條。匯入的圖片保留其色彩模式，.cdr 檔案中的仿製物件仍與原物件連結，.cdr 的圖樣透明與由右至左書寫的字型正確開啟。在觸控螢幕上，鋼筆從最後一個節點繼續，兩點線跟隨手指，「物件」泊塢視窗的列可以拖曳。輔助線在「物件」泊塢視窗中有選單，格線從頁面頂端開始，巢狀很深的區塊組成的 DXF 檔案不再耗盡記憶體。 描圖軟體產生的傳統 .ai 檔案以彩色並保持群組開啟，在「輪廓圖」方塊中按 Enter 即可套用輪廓圖。" # mt
welcome.news.v0_48_0_title = "文字、描圖、匯出與觸控螢幕的修正" # mt
