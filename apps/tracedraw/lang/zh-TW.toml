# Hints panel: the steps of each tool's page (ui/hint_pics.rs)
hintstep.pick.1 = "按一下物件即可選取。物件周圍會出現八個控點。" # mt
hintstep.pick.2 = "拖曳物件即可移動。拖曳角落控點可等比例調整大小，拖曳側邊控點可拉伸物件。" # mt
hintstep.pick.3 = "再按一下選取的物件可顯示旋轉控點：拖曳角落箭頭可旋轉物件，拖曳側邊箭頭可傾斜物件。" # mt
hintstep.pick.4 = "從空白處開始，在物件周圍拖曳出框，可選取完全位於框內的所有物件。" # mt
hintstep.pick.5 = "Shift+按一下可將物件加入選取或移出選取；Ctrl+按一下可選取群組內的物件；Alt+按一下可選取下層的物件。" # mt
hintstep.freehand_pick.1 = "在要選取的物件周圍拖曳出一個圈。放開時，完全位於圈內的所有物件都會被選取。" # mt
hintstep.freehand_pick.2 = "放開時按住 Alt 鍵，可選取圈碰到的所有物件。" # mt
hintstep.freehand_pick.3 = "按住 Shift 鍵可加入選取，按住 Ctrl 鍵可拖曳出矩形而不是圈。選取的物件可像用選取工具一樣移動和調整大小。" # mt
hintstep.free_transform.1 = "選取物件，在屬性列上選擇自由旋轉並拖曳：物件會繞著按下的點旋轉。" # mt
hintstep.free_transform.2 = "自由角度反射會沿著從按下點到指標的直線鏡射物件。" # mt
hintstep.free_transform.3 = "自由縮放從按下點調整物件大小，自由傾斜則讓物件傾斜。" # mt
hintstep.free_transform.4 = "在一次拖曳中，按住 Alt 鍵縮放，按住 Ctrl 鍵傾斜，按住 Shift 鍵反射。開啟套用至複本時，拖曳會變形一個複本。" # mt
hintstep.shape.1 = "按一下曲線顯示其節點，然後拖曳節點即可移動。" # mt
hintstep.shape.2 = "按一下節點顯示其控制點，拖曳控制點可改變曲線的彎曲程度。" # mt
hintstep.shape.3 = "拖曳線段可使其彎曲。直線段會變成曲線段。" # mt
hintstep.shape.4 = "按兩下線段可在該處新增節點；按兩下節點可將其刪除。" # mt
hintstep.shape.5 = "在矩形上，拖曳角落節點可讓轉角變圓。在橢圓形上，向內拖曳節點得到圓餅形，向外拖曳得到弧形。" # mt
hintstep.smooth.1 = "選取曲線並沿著外框拖曳：筆刷經過之處，抖動和多餘的節點會被平滑掉。" # mt
hintstep.smooth.2 = "筆尖大小設定筆刷的半徑，比率設定平滑的強度。筆尖中心的效果最強。" # mt
hintstep.smear.1 = "選取物件，從外框內部向外拖曳，可拉出一個突起。" # mt
hintstep.smear.2 = "從外框外部向內拖曳，可壓出一個凹陷。" # mt
hintstep.smear.3 = "屬性列上的壓力設定外框移動的距離，筆尖大小設定筆刷的半徑。" # mt
hintstep.twirl.1 = "選取物件，將筆尖放在邊緣並按住滑鼠按鈕：外框會變成漩渦，按住越久漩渦越大。" # mt
hintstep.twirl.2 = "在屬性列上選擇順時針或逆時針，或按住 Alt 鍵反向旋轉。速度設定旋轉的快慢。" # mt
hintstep.attract_repel.1 = "選取物件，將筆尖放在外框上並按住滑鼠按鈕：吸引會把節點拉向指標。" # mt
hintstep.attract_repel.2 = "選擇排斥或按住 Alt 鍵，可把節點推離指標。" # mt
hintstep.attract_repel.3 = "筆尖大小設定變化的範圍，速度設定變化的快慢。指標保持不動時效果會持續。" # mt
hintstep.smudge.1 = "選取物件並橫跨外框拖曳：外框會隨著拖曳平順地被拉動。" # mt
hintstep.smudge.2 = "壓力設定外框被拉動的距離，筆尖大小設定筆刷的半徑。" # mt
hintstep.roughen.1 = "選取物件並沿著外框拖曳：拖過的地方會出現鋸齒狀尖峰。" # mt
hintstep.roughen.2 = "頻率設定尖峰的數量，尖峰大小設定尖峰的高度。" # mt
hintstep.variable_outline.1 = "選取有外框的物件並橫跨外框拖曳：會新增一個寬度節點，外框兩側都會加寬到指標處。" # mt
hintstep.variable_outline.2 = "用同樣的方式新增更多寬度節點。寬度會從一個節點平順過渡到下一個節點。" # mt
hintstep.variable_outline.3 = "開始拖曳時按住 Shift 鍵或 Alt 鍵，只改變指標所在的一側。" # mt
hintstep.variable_outline.4 = "按一下節點可在屬性列上輸入其左右寬度；按 Delete 鍵可刪除節點。" # mt
hintstep.crop.1 = "在要保留的部分上拖曳出矩形。矩形外的繪圖會變暗。" # mt
hintstep.crop.2 = "在區域內拖曳可移動它，拖曳它的控點可調整大小。" # mt
hintstep.crop.3 = "在區域內按兩下或按 Enter 鍵進行裁切。按 Esc 鍵放棄。" # mt
hintstep.knife.1 = "在屬性列上選擇兩點直線或手繪，然後橫跨物件拖曳將其切開。" # mt
hintstep.knife.2 = "切開的部分會成為獨立的物件，可用選取工具將它們分開。" # mt
hintstep.knife.3 = "分割會在各部分之間留下一條細線；間隙會移除一條設定寬度的帶狀區域。" # mt
hintstep.segment_delete.1 = "按一下外框上兩個交叉點之間的部分即可刪除。" # mt
hintstep.segment_delete.2 = "橫跨外框拖曳出矩形，可刪除它碰到的每一部分。" # mt
hintstep.join.1 = "在開放曲線的端點節點上劃一筆：它們依筆畫經過的順序兩兩連接。相近的端點合併為一個節點；相距較遠的以直線段連接。" # mt
hintstep.join.2 = "按一下一個端點節點，再按另一個，即可連接這兩個。同一曲線的兩端會閉合該曲線。" # mt
hintstep.join.3 = "兩條曲線的端點連接後成為一條曲線，保留第一條的填色和外框。一筆中的所有連接為一個復原步驟。" # mt
