welcome.news.more = "هل تريد معرفة المزيد؟" # mt
welcome.news.v0_53_0_body = "يرسم كائن > إدراج > مخطط من البيانات جدولاً على شكل أعمدة أو أشرطة أو خطوط أو دائرة. يتبع دمج الأشكال الكائن المسحوب بسلاسة، ويقبل النسخ والمزيد من الكائنات، ويحافظ التحويل إلى منحنيات على طلائه. يعمل الدمج الحي في كل الأوضاع، وتنضم تدوير الزوايا والتقطيع إلى تأثيرات الطبقة، وتحصل لوحة نثر الرموز على فرشاة. يمكن أن تظهر الطبقات على نطاق مختار من الصفحات، وتتسع الكتيبات لـ16 صفحة في كل وجه مع الإزاحة، ويمكن لتصدير PDF ضغط الصور إلى حجم ملف مستهدف، ويمكن تخصيص قوائم النقر بزر الفأرة الأيمن. تفتح الرسومات التي تضم آلاف النصوص وتتحرك أسرع بكثير. يصلح هذا الإصدار أيضاً أخطاء كثيرة أبلغتم عنها." # mt
welcome.news.v0_53_0_title = "مخططات من البيانات، ودمج أشكال أكثر سلاسة، وطبقات على نطاقات صفحات" # mt
welcome.news.v0_52_0_body = "النقر المزدوج على صورة يفتح وضعًا كاملًا لتحرير الصور، بصندوق أدوات خاص به، ومفتاح لكل أداة، وأقنعة وفرش جديدة، وقائمتي الصورة والضبط. تبقى الأشكال الشائعة قابلة للضبط بعد رسمها، بمقابض على شكل معيّن لرأس السهم أو الزاوية المستديرة أو ذيل فقاعة الكلام. يجري حفظ الرسم الكبير وتصديره في الخلفية مع عرض التقدم، وتحافظ طابعات PostScript على Windows على قيم CMYK، ويمكن اختيار عدة طبقات معًا في لوحة الكائنات. يصلح هذا الإصدار أيضًا كثيرًا من الأخطاء التي أبلغتم عنها." # mt
welcome.news.v0_52_0_title = "وضع كامل لتحرير الصور، وأشكال شائعة قابلة للضبط، وحفظ في الخلفية" # mt
welcome.news.v0_51_1_body = "الخطوة التي تستغرق وقتًا طويلًا، مثل حفظ رسم كبير، لم تعد تُظهر رسالة تعرض إرسال تقرير: كانت تظهر عند كل حفظ لملف كبير وتبدو كأنها عطل. يُعرض التقرير فقط عندما يُغلق TraceDraw فعلًا بسبب خطأ، وأصبح يحتفظ بسبب الخطأ. في macOS لم يعد TraceDraw يُغلق عند وصول حدث أثناء معالجة حدث آخر." # mt
welcome.news.v0_51_1_title = "لا مزيد من رسائل «توقف عن الاستجابة»" # mt
welcome.news.v0_51_0_body = "تبقى الرسوم الكبيرة سريعة: التكبير بالعجلة واختيار الكائنات ذات التأثيرات وسحب الألوان والكتابة في النصوص الطويلة صارت تتطلب عملًا أقل، والصور الكبيرة تشغل ذاكرة أقل. يقسم الفصل مع إبقاء الثقوب المنحنى ويبقي كل ثقب في جزئه، وصار تبديل التعبئة والخط من التعبئة في قائمة لوحة الألوان، ويوزع المحاذاة والتوزيع الكائنات بهوامش متساوية على الصفحة. تُحرَّر الرموز على ورقة نظيفة، ويمكن للمسطرة العمودية أن تعد من الأعلى، ويُفتح الرسم المرسل بصيغة ‎.zip‎ عند إفلاته على النافذة، وتُحاذى خلايا الجداول من الأعلى إلى الأسفل. يصلح هذا الإصدار أيضًا أخطاء كثيرة أبلغتم عنها." # mt
welcome.news.v0_51_0_title = "رسوم كبيرة أسرع، والفصل مع إبقاء الثقوب، والرسوم المضغوطة" # mt
welcome.news.v0_50_3_body = "عندما يتوقف TraceDraw عن الاستجابة لأكثر من 10 ثوانٍ، أو يُغلق بسبب خطأ، صار يُعلمك بذلك ويعرض إرسال تقرير عما كان يفعله، دون اسم الرسم أو محتواه: يفتح «إرسال التقرير» بلاغًا على GitHub مُعبأً لتراجعه وترسله. مع الصفحات المتقابلة، يعود الكائن الذي يُفلت على صفحة أخرى في عرض الصفحات المتعددة تابعًا لتلك الصفحة، وهو ما أفسده الإصدار 0.50.1." # mt
welcome.news.v0_50_3_title = "تقارير عندما يتوقف TraceDraw عن الاستجابة، وكائنات بين الصفحات المتقابلة" # mt
welcome.news.v0_50_2_body = "يصلح هذا الإصدار بلاغين عن 0.50.1. يُنشأ ملف PDF/X لملف CMYK الخاص بالرسم نفسه، مثل U.S. Web Coated (SWOP) v2، بعد أن كان يذكر FOGRA39 دائمًا. يحتفظ المزج داخل إطار القص بخطواته عند تصدير التحديد وحده كصورة، بعد أن كانت تخرج على شكل درج." # mt
welcome.news.v0_50_2_title = "إصلاحات: شرط إخراج PDF/X والمزج في الصور المصدّرة" # mt
welcome.news.v0_50_1_body = "يصلح هذا الإصدار ما أبلغتم عنه في 0.50.0. على Windows، يُكمل التعليمات > التحديثات التثبيت حتى أثناء عرض المستكشف لصور .cdr، ويُعلمك إذا لم يكتمل التحديث. مع الصفحات المتقابلة، تبقى كائنات الصفحتين المحددة معًا في صفحتها. يحتفظ فك التجميع بظل المجموعة، ويعمل ملف > استرجاع مع الرسومات المفتوحة من .cdr أو SVG أو PDF، ويعرض الحفظ باسم النوع والإصدار مجددًا على Mac. تُفتح ملفات .cdr من الإصدار 15 بظلالها وشفافيتها، وتشرح التعليمات خطوة بخطوة كيفية استخدام مولّد الأشكال وأدوات 0.50 الجديدة." # mt
welcome.news.v0_50_1_title = "إصلاحات: التحديثات على Windows، والصفحات المتقابلة، وفك التجميع، والاسترجاع، والحفظ باسم" # mt
welcome.news.v0_50_0_body = "صارت للأغلفة شبكة تثني الأشكال والصور، ويقسم كائن > دمج الأشكال الكائنات المتداخلة ويدمجها ويقصها في خطوة واحدة. يرسم قلم الانحناء منحنيات ناعمة عبر النقاط التي تنقرها، وينحني النص إلى دائرة وقوس وموجة من شريط النص، وتتبع الكائنات الملائمة لمسار ذلك المسار مباشرة. تضيف تأثيرات الطبقات حوافًا خشنة وتعبئة رسم تخطيطي وعلامات قص وحوافًا ناعمة، ويمكن للتدرجات أن تُنقّط وتمزج نقاط ألوان حرة، ويمكن للتعبئة أن تكون هولوغرافية. الدوران ثلاثي الأبعاد ووهج الضوء وتحويل كل كائن وتسطيح الشفافية جديدة، والواجهة متاحة بالفيتنامية. يصلح هذا الإصدار أيضًا أخطاء كثيرة أبلغتم عنها، من الطباعة واستيراد PDF إلى الحفظ بصيغة ‎.cdr‎ والتتبع." # mt
welcome.news.v0_50_0_title = "أغلفة شبكية ودمج الأشكال وقلم الانحناء وتأثيرات حية" # mt
welcome.news.v0_49_0_body = "يركز هذا الإصدار على الإصلاحات. لم يعد الحفظ الذي يفشل في منتصفه يُضيّع الملف الذي كان سيحل محله، ولم تعد النسخ الاحتياطية التلقائية لنسختين من TraceDraw، أو لرسمين بالاسم نفسه، تكتب إحداها فوق الأخرى. تبقى الرسومات الكبيرة سريعة: التجميع والدمج وفك التجميع والتراجع لعشرات الآلاف من الكائنات تستغرق جزءًا من الثانية، والرسومات المتداخلة بعمق تُفتح من جديد. الرسم المحفوظ بصيغة .cdr يحتفظ بطبقاته المخفية وتعبئات النقش والشبكة والرموز التعبيرية وفواصل الأسطر وتدرجات الألوان الخاصة. تُفتح ملفات PDF وSVG وEPS وEMF وتُحفظ أقرب إلى ما تعرضه: النص المحدد، والتدرجات، والشفافية المتدرجة، والصور المدوّرة، والعبرية والعربية. التحويل إلى منحنيات يحتفظ بلون كل كلمة، ويمكن الإمساك بخط الدليل فوق أي كائن، ويحدد الدمج نتيجته. على Windows لم يعد TraceDraw يُبطئ الحاسوب كله بتشغيل عملية كل بضع ثوانٍ، وعلى الأجهزة اللوحية تُقفل مفاتيح Shift وCtrl وAlt بنقرتين." # mt
welcome.news.v0_49_0_title = "حفظ أكثر أمانًا واستيراد أدق ورسومات كبيرة أسرع" # mt
welcome.news.v0_48_0_body = "يركّز هذا الإصدار على الإصلاحات. في النص، يكسر Shift+Enter السطر، ويعود التعداد الرقمي مقروءًا، وتلتزم الحروف الاستهلالية بعدد أسطرها، ويحافظ «تحويل إلى منحنيات» على الحروف المتداخلة. يجري التتبع في نافذة تعرض التقدّم وزر «إلغاء»، فلا يبدو البرنامج متجمّدًا بعد الآن. تحتفظ الصور المصدَّرة بكل حواف الصفحة بلا خط فاتح على الحافة، ولم يعد الحفظ بصيغة .cdr يُسقط الخطوط ذات الطول الصفري. تحتفظ الصور المستوردة بنمط ألوانها، وتبقى النسخ المرتبطة في ملفات .cdr مرتبطة بأصلها، وتُفتح شفافية النقوش والخطوط المكتوبة من اليمين إلى اليسار في .cdr. على الشاشات اللمسية يتابع القلم من العقدة الأخيرة، ويتبع خط النقطتين الإصبع، ويمكن سحب صفوف لوحة «الكائنات». للأدلة قائمة في لوحة «الكائنات»، وتبدأ الشبكة من أعلى الصفحة، ولم يعد ملف DXF ذو الكتل المتداخلة بعمق يستنفد الذاكرة. تُفتح ملفات .ai الكلاسيكية من برامج التتبع بالألوان ومجمّعة، ويطبّق Enter في خانات «الحدّ المحيطي» الحدّ المحيطي." # mt
welcome.news.v0_48_0_title = "إصلاحات في النص والتتبع والتصدير والشاشات اللمسية" # mt
