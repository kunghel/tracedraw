web.notice_text = "**المتصفح أبطأ:** الرسومات الكبيرة والتأثيرات الثقيلة والملفات الكبيرة تستغرق وقتًا أطول، ولا تتوفر الخطوط المثبتة على حاسوبك (تأتي الخطوط المجانية من كتالوج الصفحة عندما يحتاجها الرسم، وتُحفظ الخطوط التي تضيفها في مدير الخطوط)، وتُفتح الملفات بالرفع وتُحفظ كتنزيلات.\n\nهذا هو برنامج Rust نفسه الذي يعمل كتطبيق سطح المكتب، مُجمَّعًا إلى WebAssembly لتجربته دون تثبيت أي شيء.\n\nللعمل الفعلي والملفات الكبيرة استخدم تطبيق Windows أو macOS أو Linux: يعمل أصليًا وبكامل سرعته." # mt
