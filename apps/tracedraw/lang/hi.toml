updates.policy_question = "क्या TraceDraw अपडेट जाँचे? दिन में एक बार, शुरू होते समय यह GitHub (api.github.com) से पूछता है कि कोई नया संस्करण आया है या नहीं। आपके या आपकी ड्रॉइंग के बारे में कुछ नहीं भेजा जाता। आप इसे बाद में विकल्प में बदल सकते हैं।"
