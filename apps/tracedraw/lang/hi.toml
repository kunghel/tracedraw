welcome.learn = "सीखें"
welcome.learn_1_body = "टूलबॉक्स से कोई टूल चुनें (फ़्लाईआउट के लिए बटन दबाए रखें) और पृष्ठ पर खींचें। सीमित करने के लिए Ctrl, केंद्र से बनाने के लिए Shift दबाए रखें।"
welcome.learn_1_title = "चित्र बनाना"
welcome.learn_2_body = "चुनने के लिए क्लिक करें, घुमाने और तिरछा करने के हैंडल के लिए फिर क्लिक करें, आकार बदलने के लिए कोने खींचें। तीर कुंजियाँ नज करती हैं; Shift+तीर दस गुना अधिक।"
welcome.learn_2_title = "चयन और रूपांतरण"
welcome.learn_3_body = "भरण के लिए पैलेट रंग पर बायाँ क्लिक करें, आउटलाइन के लिए दायाँ क्लिक। प्रॉपर्टीज़ पैनल ग्रेडिएंट, पैटर्न, टेक्सचर और मेश भरण संपादित करता है।"
welcome.learn_3_title = "भराव और आउटलाइन"
welcome.learn_4_body = "शेप टूल (F10) नोड संपादित करता है: नोड जोड़ने के लिए खंड पर डबल-क्लिक करें, नोड हटाने के लिए उस पर डबल-क्लिक करें, कस्प, स्मूद और सममित के लिए प्रॉपर्टी बार का उपयोग करें।"
welcome.learn_4_title = "नोड"
welcome.learn_5_body = "प्रभाव संपादन योग्य रहते हैं: प्रभाव मेनू से प्रभाव का पैनल खोलें, मान बदलें और ऑब्जेक्ट अपडेट हो जाता है। प्रभाव समतल करें उन्हें स्थायी बनाता है।"
welcome.learn_5_title = "प्रभाव"
welcome.my_templates = "मेरे टेम्पलेट"
welcome.new_document = "नया दस्तावेज़"
welcome.new_from_template = "टेम्पलेट से नया"
welcome.news.more = "और जानना चाहते हैं?" # mt
welcome.news.v0_53_0_body = "ऑब्जेक्ट > डालें > डेटा से चार्ट किसी तालिका को कॉलम, बार, रेखाओं या पाई के रूप में बनाता है। आकार मिलाएँ खींची जा रही वस्तु के साथ सहजता से चलता है, प्रतियाँ और नई वस्तुएँ जोड़ता है, और वक्रों में बदलें उसका रंग बनाए रखता है। लाइव संयोजन हर मोड में काम करता है, कोने गोल करें और टुकड़े करें परत प्रभावों में जुड़ते हैं, और प्रतीक बिखेरें पैनल को एक ब्रश मिलता है। परतें चुनी गई पेज श्रेणी पर दिख सकती हैं, पुस्तिकाएँ खिसकाव के साथ प्रति ओर 16 पेज लेती हैं, PDF निर्यात चित्रों को लक्षित फ़ाइल आकार तक संपीड़ित कर सकता है, और राइट-क्लिक मेनू अनुकूलित किए जा सकते हैं। हज़ारों पाठ वाले चित्र बहुत तेज़ी से खुलते और खिसकते हैं। यह संस्करण आपके बताए कई बग भी ठीक करता है।" # mt
welcome.news.v0_53_0_title = "डेटा से चार्ट, अधिक सहज आकार मिलाएँ और पेज श्रेणियों पर परतें" # mt
welcome.news.v0_52_0_body = "किसी चित्र पर डबल क्लिक करने से चित्र संपादन का पूरा मोड खुलता है, जिसमें अपना टूलबॉक्स, हर टूल के लिए एक कुंजी, नए मास्क और ब्रश, और चित्र तथा समायोजन मेनू हैं। सामान्य आकृतियाँ बनाने के बाद भी समायोज्य रहती हैं: हीरे जैसे हैंडल तीर की नोक, गोल कोना या संवाद-बुलबुले की पूँछ बदलते हैं। बड़ी ड्रॉइंग को सहेजना और निर्यात करना प्रगति दिखाते हुए पृष्ठभूमि में होता है, Windows पर PostScript प्रिंटर CMYK मान बनाए रखते हैं, और ऑब्जेक्ट पैनल में एक साथ कई परतें चुनी जा सकती हैं। यह संस्करण आपके बताए कई बग भी ठीक करता है।" # mt
welcome.news.v0_52_0_title = "चित्र संपादन का पूरा मोड, समायोज्य सामान्य आकृतियाँ और पृष्ठभूमि में सहेजना" # mt
welcome.news.v0_51_1_body = "लंबा चलने वाला चरण, जैसे बड़ी ड्रॉइंग सहेजना, अब रिपोर्ट भेजने का संदेश नहीं दिखाता: यह बड़ी फ़ाइल के हर सहेजने पर आता था और क्रैश जैसा लगता था। रिपोर्ट तभी दी जाती है जब TraceDraw सचमुच किसी त्रुटि के कारण बंद हुआ हो, और अब उसमें त्रुटि का कारण बना रहता है। macOS पर, जब एक घटना के संभाले जाने के दौरान दूसरी घटना आती है, तब TraceDraw अब बंद नहीं होता।" # mt
welcome.news.v0_51_1_title = "“प्रतिक्रिया देना बंद” वाले संदेश अब नहीं" # mt
welcome.news.v0_51_0_body = "बड़े चित्र तेज़ बने रहते हैं: व्हील से ज़ूम, प्रभाव वाले ऑब्जेक्ट चुनना, रंग खींचना और लंबे टेक्स्ट में टाइप करना कम काम लेते हैं, और बड़े चित्र कम मेमोरी लेते हैं। छेद रखते हुए अलग करें एक वक्र को बाँटता है और हर छेद उसके हिस्से में रहता है, भराई बदलें और भराई से आउटलाइन रंग पैनल के मेनू में हैं, और संरेखित व वितरित करें पेज पर बराबर हाशियों के साथ ऑब्जेक्ट फैलाता है। प्रतीक साफ़ शीट पर संपादित होते हैं, खड़ा रूलर ऊपर से गिन सकता है, .zip में भेजा चित्र विंडो पर छोड़ते ही खुलता है, और तालिका के खाने ऊपर से नीचे संरेखित होते हैं। यह संस्करण आपकी बताई कई गड़बड़ियाँ भी ठीक करता है।" # mt
welcome.news.v0_51_0_title = "बड़े चित्र तेज़, छेद रखते हुए अलग करें और ज़िप चित्र" # mt
welcome.news.v0_50_3_body = "जब TraceDraw 10 सेकंड से ज़्यादा जवाब नहीं देता, या किसी त्रुटि से बंद हो जाता है, तो अब वह यह बताता है और जो कर रहा था उसकी रिपोर्ट भेजने का सुझाव देता है, चित्र के नाम या सामग्री के बिना: रिपोर्ट भेजें भरा हुआ GitHub इश्यू खोलता है जिसे आप जाँचकर भेज सकते हैं। आमने-सामने पृष्ठों में, बहु-पृष्ठ दृश्य में दूसरे पृष्ठ पर छोड़ा गया ऑब्जेक्ट फिर से उसी पृष्ठ का हो जाता है, जो 0.50.1 में टूट गया था।" # mt
welcome.news.v0_50_3_title = "TraceDraw के जवाब न देने पर रिपोर्ट, आमने-सामने पृष्ठों के बीच ऑब्जेक्ट" # mt
welcome.news.v0_50_2_body = "यह संस्करण 0.50.1 की दो रिपोर्ट ठीक करता है। PDF/X फ़ाइल चित्र की अपनी CMYK प्रोफ़ाइल के लिए बनती है, जैसे U.S. Web Coated (SWOP) v2, जहाँ पहले हमेशा FOGRA39 लिखा होता था। क्लिप फ़्रेम के अंदर का ब्लेंड केवल चयन को चित्र के रूप में निर्यात करने पर अपने चरण बनाए रखता है, जहाँ पहले वे सीढ़ी जैसे निकलते थे।" # mt
welcome.news.v0_50_2_title = "सुधार: PDF/X आउटपुट शर्त और निर्यात चित्रों में ब्लेंड" # mt
welcome.news.v0_50_1_body = "यह संस्करण 0.50.0 में आपकी बताई समस्याएँ ठीक करता है। Windows पर, एक्सप्लोरर में .cdr चित्र दिखते समय भी सहायता > अपडेट इंस्टॉल पूरा करता है, और अपडेट पूरा न हो तो बताता है। आमने-सामने पृष्ठों में दोनों पृष्ठों के साथ चुने गए ऑब्जेक्ट अपने पृष्ठ पर ही रहते हैं। समूह हटाने पर समूह की छाया बनी रहती है, फ़ाइल > पूर्ववत करें .cdr, SVG या PDF से खोले गए चित्रों में काम करता है, और Mac पर इस रूप में सहेजें फिर से प्रकार और संस्करण दिखाता है। संस्करण 15 की .cdr फ़ाइलें छाया और पारदर्शिता के साथ खुलती हैं, और सहायता में आकार जनरेटर और 0.50 के नए टूल का उपयोग चरण दर चरण बताया गया है।" # mt
welcome.news.v0_50_1_title = "सुधार: Windows पर अपडेट, आमने-सामने पृष्ठ, समूह हटाना, पूर्ववत करें और इस रूप में सहेजें" # mt
welcome.news.v0_50_0_body = "लिफ़ाफ़ों में अब एक मेश है जो आकारों और चित्रों को मोड़ता है, और ऑब्जेक्ट > आकार मिलाएँ एक ही चरण में ओवरलैप होते ऑब्जेक्ट को तोड़ता, जोड़ता और काटता है। वक्रता पेन क्लिक किए बिंदुओं से चिकने वक्र बनाता है, टेक्स्ट बार से टेक्स्ट वृत्त, मेहराब और लहर में मुड़ता है, और पथ पर बैठाए ऑब्जेक्ट उसका लाइव पीछा करते हैं। लेयर प्रभाव खुरदुरे किनारे, स्केच भराई, ट्रिम चिह्न और मुलायम किनारे जोड़ते हैं, ग्रेडिएंट डिथर कर सकते हैं और मुक्त रंग बिंदु मिला सकते हैं, और भराई होलोग्राफ़िक हो सकती है। 3D घुमाव, प्रकाश चमक, हर एक को बदलें और पारदर्शिता समतल करें नए हैं, और इंटरफ़ेस वियतनामी में भी है। यह संस्करण छपाई और PDF आयात से लेकर .cdr सहेजने और ट्रेसिंग तक आपकी बताई कई गड़बड़ियाँ भी ठीक करता है।" # mt
welcome.news.v0_50_0_title = "मेश लिफ़ाफ़े, आकार मिलाएँ, वक्रता पेन और लाइव प्रभाव" # mt
welcome.news.v0_49_0_body = "यह संस्करण सुधारों पर केंद्रित है। बीच में विफल होने वाला सहेजना अब उस फ़ाइल को नहीं खोता जिसे वह बदल रहा था, और दो TraceDraw या एक ही नाम के दो चित्रों के स्वचालित बैकअप अब एक-दूसरे को नहीं मिटाते। बड़े चित्र तेज़ रहते हैं: दसियों हज़ार ऑब्जेक्ट पर Group, Combine, Ungroup और Undo एक सेकंड के अंश में होते हैं, और गहराई से नेस्टेड चित्र फिर से खुलते हैं। .cdr के रूप में सहेजा गया चित्र अपनी छिपी परतें, पैटर्न और मेश भराव, इमोजी, पंक्ति विराम और स्पॉट रंग ग्रेडिएंट बनाए रखता है। PDF, SVG, EPS और EMF फ़ाइलें वैसे ही खुलती और सहेजी जाती हैं जैसी वे दिखती हैं: आउटलाइन वाला टेक्स्ट, ग्रेडिएंट, धीरे-धीरे बदलती पारदर्शिता, घुमाए गए चित्र, हिब्रू और अरबी। Convert to Curves हर शब्द का रंग बनाए रखता है, गाइडलाइन को किसी भी ऑब्जेक्ट के ऊपर पकड़ा जा सकता है, और Combine अपना परिणाम चुनता है। Windows पर TraceDraw अब हर कुछ सेकंड में एक प्रक्रिया शुरू करके पूरे कंप्यूटर को धीमा नहीं करता, और टैबलेट पर Shift, Ctrl और Alt दो टैप से लॉक होते हैं।" # mt
welcome.news.v0_49_0_title = "सुरक्षित सहेजना, सटीक आयात और तेज़ बड़े चित्र" # mt
welcome.news.v0_48_0_body = "यह संस्करण सुधारों के लिए है। टेक्स्ट में Shift+Enter पंक्ति तोड़ता है, क्रमांकित बुलेट फिर से पढ़े जा सकते हैं, ड्रॉप कैप अपनी तय पंक्तियों में रहते हैं, और कर्व में बदलें एक-दूसरे पर चढ़े अक्षरों को बनाए रखता है। ट्रेसिंग एक विंडो में होती है जिसमें प्रगति और रद्द करें बटन है, इसलिए प्रोग्राम अब अटका हुआ नहीं लगता। एक्सपोर्ट की गई तस्वीरें पेज के सभी किनारे रखती हैं, किनारे पर कोई हल्की रेखा नहीं, और .cdr में सहेजने पर शून्य लंबाई वाली रेखाएँ अब नहीं छूटतीं। इम्पोर्ट की गई तस्वीरें अपना रंग मोड रखती हैं, .cdr फ़ाइलों के क्लोन अपने मूल से जुड़े रहते हैं, और .cdr के पैटर्न पारदर्शिता तथा दाएँ से बाएँ लिखे फ़ॉन्ट खुलते हैं। टच स्क्रीन पर पेन आख़िरी नोड से आगे बढ़ता है, 2-बिंदु रेखा उंगली के साथ चलती है, और ऑब्जेक्ट्स पैनल की पंक्तियाँ खींची जा सकती हैं। गाइडलाइनों का ऑब्जेक्ट्स पैनल में मेनू है, ग्रिड पेज के ऊपर से शुरू होता है, और बहुत गहराई तक नेस्टेड ब्लॉक वाली DXF फ़ाइल अब मेमोरी ख़त्म नहीं करती। ट्रेसिंग प्रोग्रामों की पुरानी .ai फ़ाइलें रंगों के साथ और समूहों में खुलती हैं, और कंटूर के बॉक्स में Enter कंटूर लागू करता है।" # mt
