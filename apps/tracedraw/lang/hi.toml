hintstep.text.1 = "जहाँ टेक्स्ट शुरू होता है वहाँ क्लिक करें और टाइप करें: आर्टिस्टिक टेक्स्ट। Enter नई पंक्ति शुरू करता है।" # mt
hintstep.text.2 = "एक फ़्रेम खींचें, फिर टाइप करें: पैराग्राफ़ टेक्स्ट फ़्रेम के किनारों पर अगली पंक्ति में चला जाता है।" # mt
hintstep.text.3 = "खत्म करने के लिए Esc दबाएँ। टेक्स्ट संपादित करने के लिए इस टूल से उस पर क्लिक करें, और प्रॉपर्टी बार पर फ़ॉन्ट, आकार और शैली चुनें।" # mt
hintstep.table.1 = "प्रॉपर्टी बार पर पंक्तियों और स्तंभों की संख्या सेट करें और एक आयत खींचें।" # mt
hintstep.table.2 = "किसी सेल पर क्लिक करें और टाइप करें। Tab अगले सेल पर जाता है।" # mt
hintstep.table.3 = "तालिका मेनू पंक्तियाँ और स्तंभ डालता, हटाता, मिलाता और विभाजित करता है।" # mt
hintstep.parallel_dimension.1 = "पहले बिंदु से दूसरे तक खींचें, या दोनों पर क्लिक करें।" # mt
hintstep.parallel_dimension.2 = "पॉइंटर हिलाएँ और जहाँ आयाम रेखा जानी है वहाँ क्लिक करें।" # mt
hintstep.parallel_dimension.3 = "सटीक माप के लिए नोड पर स्नैप करें। प्रॉपर्टी बार पर सटीकता और इकाइयाँ सेट करें।" # mt
hintstep.hv_dimension.1 = "पहले बिंदु से दूसरे तक खींचें, या दोनों पर क्लिक करें।" # mt
hintstep.hv_dimension.2 = "पॉइंटर हिलाएँ और जहाँ रेखा जानी है वहाँ क्लिक करें। यह केवल क्षैतिज या ऊर्ध्वाधर दूरी मापता है।" # mt
hintstep.angular_dimension.1 = "कोण के शीर्ष पर क्लिक करें।" # mt
hintstep.angular_dimension.2 = "पहली भुजा पर एक बिंदु पर क्लिक करें, फिर दूसरी भुजा पर एक बिंदु पर।" # mt
hintstep.angular_dimension.3 = "जहाँ चाप और लेबल जाने हैं वहाँ क्लिक करें।" # mt
hintstep.segment_dimension.1 = "किसी ऑब्जेक्ट के खंड के दोनों सिरे लेने के लिए उस खंड पर क्लिक करें।" # mt
hintstep.segment_dimension.2 = "जहाँ आयाम रेखा जानी है वहाँ क्लिक करें।" # mt
hintstep.callout.1 = "नोक से, यानी जिस बिंदु की ओर कॉलआउट इशारा करता है, मोड़ तक खींचें।" # mt
hintstep.callout.2 = "जहाँ टेक्स्ट जाना है वहाँ क्लिक करें, फिर टेक्स्ट टाइप करें।" # mt
hintstep.callout.3 = "प्रॉपर्टी बार पर नोक का सिरा और टेक्स्ट के चारों ओर की आकृति चुनें।" # mt
hintstep.connector.1 = "एक ऑब्जेक्ट से दूसरे तक खींचें: रेखा उनके एंकर के बीच चलती है।" # mt
hintstep.connector.2 = "किसी भी ऑब्जेक्ट को हिलाएँ या उसका आकार बदलें: कनेक्टर जुड़ा रहता है।" # mt
hintstep.right_angle_connector.1 = "एक ऑब्जेक्ट से दूसरे तक खींचें: कनेक्टर क्षैतिज और ऊर्ध्वाधर खंडों में चलता है।" # mt
hintstep.right_angle_connector.2 = "किसी भी ऑब्जेक्ट को हिलाएँ: कनेक्टर जुड़ा रहता है और नया रास्ता ढूँढ लेता है।" # mt
hintstep.rounded_connector.1 = "एक ऑब्जेक्ट से दूसरे तक खींचें: कनेक्टर गोल कोनों वाले क्षैतिज और ऊर्ध्वाधर खंडों में चलता है।" # mt
hintstep.rounded_connector.2 = "प्रॉपर्टी बार पर कोने की त्रिज्या सेट करें। किसी भी ऑब्जेक्ट को हिलाएँ और कनेक्टर साथ चलता है।" # mt
hintstep.anchor_editing.1 = "किसी ऑब्जेक्ट के एंकर हीरे के रूप में दिखाने के लिए उस पर क्लिक करें।" # mt
hintstep.anchor_editing.2 = "एंकर जोड़ने के लिए ऑब्जेक्ट के अंदर क्लिक करें, और जोड़े गए एंकर को हिलाने के लिए उसे खींचें।" # mt
hintstep.anchor_editing.3 = "किसी एंकर को हटाने के लिए उसे चुनकर Delete दबाएँ, या उस पर डबल-क्लिक करें। भुजाओं के बीच के चार एंकर हमेशा रहते हैं।" # mt
hintstep.drop_shadow.1 = "किसी ऑब्जेक्ट के बीच से वहाँ तक खींचें जहाँ छाया पड़नी चाहिए।" # mt
hintstep.drop_shadow.2 = "उस किनारे पर खड़ी परिप्रेक्ष्य छाया के लिए ऑब्जेक्ट के किसी किनारे से खींचें।" # mt
hintstep.drop_shadow.3 = "हैंडल के बीच की रेखा के पास के दो स्लाइडर खींचें: एक ओर वाला अपारदर्शिता बदलता है, दूसरी ओर वाला फ़ेदरिंग। छाया हिलाने के लिए अंतिम हैंडल खींचें।" # mt
hintstep.drop_shadow.4 = "प्रॉपर्टी बार पर फ़ेदरिंग और रंग सेट करें।" # mt
hintstep.contour.1 = "बाहरी कंटूर के लिए किसी ऑब्जेक्ट से बाहर की ओर खींचें।" # mt
hintstep.contour.2 = "भीतरी कंटूर के लिए उसके बीच की ओर खींचें।" # mt
hintstep.contour.3 = "प्रॉपर्टी बार पर चरण, ऑफ़सेट और अंतिम चरण के रंग सेट करें।" # mt
hintstep.blend.1 = "एक ऑब्जेक्ट से दूसरे तक खींचें: उनके बीच मध्यवर्ती चरण दिखाई देते हैं।" # mt
hintstep.blend.2 = "प्रॉपर्टी बार पर चरणों की संख्या सेट करें। किसी भी ऑब्जेक्ट को हिलाएँ, उसका आकार या रंग बदलें और चरण साथ चलते हैं।" # mt
hintstep.distort.1 = "पुश और पुल: नुकीले सिरों के लिए ऑब्जेक्ट पर दाईं ओर खींचें, या गोल पंखुड़ियों के लिए बाईं ओर।" # mt
hintstep.distort.2 = "ज़िपर: ज़िगज़ैग दाँतों के लिए शुरुआत से दूर खींचें। जितना दूर खींचेंगे, वे उतने ऊँचे होंगे।" # mt
hintstep.distort.3 = "ट्विस्टर: ऑब्जेक्ट को घुमावदार बनाने के लिए शुरुआती बिंदु के चारों ओर खींचें।" # mt
hintstep.distort.4 = "विरूपण का केंद्र हिलाने के लिए हीरा खींचें। फिर से खींचने पर विरूपण बदल जाता है।" # mt
hintstep.envelope.1 = "किसी ऑब्जेक्ट पर क्लिक करें: उसके चारों ओर आठ नोड वाला एक फ़्रेम दिखाई देता है।" # mt
hintstep.envelope.2 = "फ़्रेम का आकार बदलने के लिए नोड खींचें। ऑब्जेक्ट उसे भरने के लिए मुड़ जाता है।" # mt
hintstep.envelope.3 = "भुजाएँ कैसे मुड़ें यह तय करने के लिए प्रॉपर्टी बार पर सीधी रेखा, एकल चाप, दोहरा चाप या अप्रतिबंधित चुनें।" # mt
hintstep.extrude.1 = "किसी ऑब्जेक्ट से खींचें: भुजाएँ उसकी आउटलाइन से खींचने के अंत, यानी लुप्त बिंदु, की ओर जाती हैं।" # mt
hintstep.extrude.2 = "लुप्त बिंदु हिलाने के लिए क्रॉस वाला हैंडल खींचें।" # mt
hintstep.extrude.3 = "प्रॉपर्टी बार पर गहराई, प्रकाश और रंग सेट करें।" # mt
hintstep.block_shadow.1 = "किसी ऑब्जेक्ट से उस दिशा में खींचें जिधर छाया जानी चाहिए।" # mt
hintstep.block_shadow.2 = "प्रॉपर्टी बार पर गहराई, दिशा, रंग और अंतराल सेट करें।" # mt
hintstep.transparency.1 = "हर जगह एक जैसी पारदर्शिता के लिए किसी ऑब्जेक्ट पर क्लिक करें और प्रॉपर्टी बार पर एकसमान चुनें।" # mt
hintstep.transparency.2 = "ग्रेडिएंट पारदर्शिता के लिए किसी ऑब्जेक्ट के आर-पार खींचें: जहाँ दबाते हैं वहाँ अपारदर्शी, जहाँ छोड़ते हैं वहाँ पारदर्शी।" # mt
hintstep.transparency.3 = "मिश्रण का आधा बिंदु हिलाने के लिए स्लाइडर खींचें, और उसकी लंबाई और कोण बदलने के लिए नोड।" # mt
hintstep.color_eyedropper.1 = "किसी ऑब्जेक्ट का रंग लेने के लिए उस पर क्लिक करें।" # mt
hintstep.color_eyedropper.2 = "दूसरे ऑब्जेक्ट को उस रंग से भरने के लिए उन पर क्लिक करें; Shift+क्लिक उनकी आउटलाइन को रंगता है।" # mt
hintstep.color_eyedropper.3 = "फिर से रंग लेने के लिए प्रॉपर्टी बार पर चुनें बटन पर क्लिक करें। Esc पिक टूल पर वापस ले जाता है। Ctrl+क्लिक से भी फिर से रंग लिया जाता है।" # mt
hintstep.attributes_eyedropper.1 = "जिस ऑब्जेक्ट से कॉपी करना है उस पर क्लिक करें।" # mt
hintstep.attributes_eyedropper.2 = "जिन ऑब्जेक्ट पर कॉपी करना है उनमें से हर एक पर क्लिक करें।" # mt
hintstep.attributes_eyedropper.3 = "प्रॉपर्टी बार पर चुनें कि क्या कॉपी करना है: गुण, रूपांतरण या प्रभाव। Shift+क्लिक किसी दूसरे ऑब्जेक्ट से नमूना लेता है।" # mt
hintstep.interactive_fill.1 = "किसी ऑब्जेक्ट के आर-पार खींचें: ग्रेडिएंट भराव वहाँ से जहाँ आप दबाते हैं वहाँ तक जाता है जहाँ आप छोड़ते हैं।" # mt
hintstep.interactive_fill.2 = "उस बिंदु को हिलाने के लिए जहाँ रंग आधे रास्ते में मिलते हैं, नोड के बीच का स्लाइडर खींचें।" # mt
hintstep.interactive_fill.3 = "ग्रेडिएंट की लंबाई और कोण बदलने के लिए अंतिम नोड खींचें।" # mt
hintstep.interactive_fill.4 = "रंग नोड जोड़ने के लिए रेखा पर डबल-क्लिक करें, और किसी नोड का रंग बदलने के लिए पैलेट से रंग उस पर खींचें।" # mt
hintstep.area_fill.1 = "किसी भी बंद क्षेत्र के अंदर क्लिक करें, भले ही वह कई एक-दूसरे पर चढ़े ऑब्जेक्ट से बना हो।" # mt
hintstep.area_fill.2 = "वह क्षेत्र एक नया भरा हुआ ऑब्जेक्ट बन जाता है; उसके आसपास के ऑब्जेक्ट जैसे हैं वैसे ही रहते हैं।" # mt
hintstep.area_fill.3 = "प्रॉपर्टी बार पर नए ऑब्जेक्ट का भराव और आउटलाइन चुनें।" # mt
hintstep.mesh_fill.1 = "प्रॉपर्टी बार पर पंक्तियाँ और स्तंभ सेट करें और मेश जोड़ने के लिए किसी ऑब्जेक्ट पर क्लिक करें।" # mt
hintstep.mesh_fill.2 = "किसी नोड पर क्लिक करें, फिर उसे रंगने के लिए पैलेट के किसी रंग पर क्लिक करें।" # mt
