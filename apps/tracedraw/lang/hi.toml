web.notice_title = "आपके ब्राउज़र में TraceDraw"
web.notice_text = "**ब्राउज़र धीमा होता है:** बड़े ड्रॉइंग, भारी इफ़ेक्ट और बड़ी फ़ाइलें ज़्यादा समय लेती हैं, आपके कंप्यूटर पर इंस्टॉल फ़ॉन्ट उपलब्ध नहीं हैं (ड्रॉइंग को ज़रूरत होने पर मुफ़्त फ़ॉन्ट पेज के कैटलॉग से आते हैं, और फ़ॉन्ट मैनेजर में जोड़े गए फ़ॉन्ट रखे जाते हैं), और फ़ाइलें अपलोड से खुलती हैं और डाउनलोड के रूप में सहेजी जाती हैं।\n\nयह डेस्कटॉप ऐप वाला ही Rust प्रोग्राम है, WebAssembly में कंपाइल किया हुआ ताकि आप बिना कुछ इंस्टॉल किए इसे आज़मा सकें।\n\nअसली काम और बड़ी फ़ाइलों के लिए Windows, macOS या Linux का ऐप इस्तेमाल करें: यह नेटिव रूप से, पूरी गति से चलता है।" # mt
web.notice_download = "डेस्कटॉप ऐप डाउनलोड करें"
web.notice_store = "Microsoft Store से प्राप्त करें"
web.notice_store_note = "Windows पर TraceDraw Microsoft Store में भी है, हस्ताक्षरित और Windows द्वारा अपडेट किया जाता है। हर संस्करण को पहले स्टोर का प्रमाणन पास करना होता है, इसलिए स्टोर का संस्करण नवीनतम डाउनलोड से एक या अधिक रिलीज़ पीछे हो सकता है।"
