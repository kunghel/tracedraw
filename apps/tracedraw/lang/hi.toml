# Hints panel: the steps of each tool's page (ui/hint_pics.rs)
hintstep.pick.1 = "किसी ऑब्जेक्ट को चुनने के लिए उस पर क्लिक करें। उसके चारों ओर आठ हैंडल दिखाई देते हैं।" # mt
hintstep.pick.2 = "ऑब्जेक्ट को हिलाने के लिए उसे खींचें। अनुपात में आकार बदलने के लिए कोने का हैंडल खींचें, या फैलाने के लिए किनारे का हैंडल।" # mt
hintstep.pick.3 = "घुमाव हैंडल दिखाने के लिए चुने गए ऑब्जेक्ट पर फिर से क्लिक करें: घुमाने के लिए कोने का तीर खींचें, तिरछा करने के लिए किनारे का तीर।" # mt
hintstep.pick.4 = "किसी खाली जगह से शुरू करके ऑब्जेक्ट के चारों ओर एक फ़्रेम खींचें, ताकि पूरी तरह उसके अंदर का हर ऑब्जेक्ट चुना जाए।" # mt
hintstep.pick.5 = "Shift+क्लिक किसी ऑब्जेक्ट को चयन में जोड़ता या उससे हटाता है; Ctrl+क्लिक समूह के अंदर का ऑब्जेक्ट चुनता है; Alt+क्लिक नीचे वाला ऑब्जेक्ट चुनता है।" # mt
hintstep.freehand_pick.1 = "जिन ऑब्जेक्ट को चाहते हैं उनके चारों ओर एक घेरा खींचें। छोड़ने पर पूरी तरह घेरे के अंदर का हर ऑब्जेक्ट चुना जाता है।" # mt
hintstep.freehand_pick.2 = "घेरा जिस-जिस ऑब्जेक्ट को छूता है, उन सबको चुनने के लिए छोड़ते समय Alt दबाए रखें।" # mt
hintstep.freehand_pick.3 = "चयन में जोड़ने के लिए Shift दबाए रखें, या घेरे के बजाय आयत खींचने के लिए Ctrl। चुने गए ऑब्जेक्ट पिक टूल की तरह ही हिलते और आकार बदलते हैं।" # mt
hintstep.free_transform.1 = "कोई ऑब्जेक्ट चुनें, प्रॉपर्टी बार पर मुक्त घुमाव चुनें और खींचें: ऑब्जेक्ट उस बिंदु के चारों ओर घूमता है जहाँ आप दबाते हैं।" # mt
hintstep.free_transform.2 = "मुक्त कोण परावर्तन ऑब्जेक्ट को दबाने के बिंदु से पॉइंटर तक की रेखा के आर-पार दर्पण की तरह पलटता है।" # mt
hintstep.free_transform.3 = "मुक्त स्केल दबाने के बिंदु से ऑब्जेक्ट का आकार बदलता है, और मुक्त तिरछापन उसे तिरछा करता है।" # mt
hintstep.free_transform.4 = "एक बार खींचने के लिए स्केल करने हेतु Alt, तिरछा करने हेतु Ctrl या परावर्तन हेतु Shift दबाए रखें। प्रतिलिपि पर लागू करें चालू होने पर खींचना एक प्रतिलिपि को बदलता है।" # mt
hintstep.shape.1 = "किसी कर्व के नोड दिखाने के लिए उस पर क्लिक करें, फिर किसी नोड को हिलाने के लिए उसे खींचें।" # mt
hintstep.shape.2 = "किसी नोड के नियंत्रण हैंडल दिखाने के लिए उस पर क्लिक करें, और कर्व का मोड़ बदलने के लिए हैंडल खींचें।" # mt
hintstep.shape.3 = "किसी खंड को मोड़ने के लिए उसे खींचें। सीधा खंड घुमावदार बन जाता है।" # mt
hintstep.shape.4 = "वहाँ नोड जोड़ने के लिए किसी खंड पर डबल-क्लिक करें; किसी नोड को हटाने के लिए उस पर डबल-क्लिक करें।" # mt
hintstep.shape.5 = "आयत पर, कोनों को गोल करने के लिए कोने का नोड खींचें। दीर्घवृत्त पर, पाई के लिए नोड को अंदर या चाप के लिए बाहर खींचें।" # mt
hintstep.smooth.1 = "कोई कर्व चुनें और उसकी आउटलाइन के साथ खींचें: जहाँ से ब्रश गुज़रता है, वहाँ लहरें और अतिरिक्त नोड चिकने हो जाते हैं।" # mt
hintstep.smooth.2 = "निब का आकार ब्रश की त्रिज्या तय करता है और दर यह कि कितना चिकना करे। प्रभाव निब के केंद्र में सबसे तेज़ होता है।" # mt
hintstep.smear.1 = "कोई ऑब्जेक्ट चुनें और एक उभार बाहर खींचने के लिए उसकी आउटलाइन के अंदर से बाहर की ओर खींचें।" # mt
hintstep.smear.2 = "एक गड्ढा अंदर धकेलने के लिए आउटलाइन के बाहर से अंदर की ओर खींचें।" # mt
hintstep.smear.3 = "प्रॉपर्टी बार पर दबाव तय करता है कि आउटलाइन कितनी दूर खिसकती है, और निब का आकार ब्रश की त्रिज्या।" # mt
hintstep.twirl.1 = "कोई ऑब्जेक्ट चुनें, निब को उसके किनारे पर रखें और माउस बटन दबाए रखें: आउटलाइन एक भँवर बन जाती है जो दबाए रखने तक बढ़ती है।" # mt
hintstep.twirl.2 = "प्रॉपर्टी बार पर दक्षिणावर्त या वामावर्त चुनें, या उल्टी दिशा में घुमाने के लिए Alt दबाए रखें। गति तय करती है कि यह कितनी तेज़ी से घूमता है।" # mt
hintstep.attract_repel.1 = "कोई ऑब्जेक्ट चुनें और निब को उसकी आउटलाइन पर रखकर माउस बटन दबाए रखें: आकर्षित नोड को पॉइंटर की ओर खींचता है।" # mt
hintstep.attract_repel.2 = "नोड को पॉइंटर से दूर धकेलने के लिए प्रतिकर्षित चुनें, या Alt दबाए रखें।" # mt
hintstep.attract_repel.3 = "निब का आकार बदलने वाला क्षेत्र तय करता है और गति यह कि वह कितनी तेज़ी से बदलता है। पॉइंटर को स्थिर रखने पर प्रभाव जारी रहता है।" # mt
hintstep.smudge.1 = "कोई ऑब्जेक्ट चुनें और उसकी आउटलाइन के आर-पार खींचें: आउटलाइन खींचने के साथ आसानी से खिंचती है।" # mt
hintstep.smudge.2 = "दबाव तय करता है कि आउटलाइन कितनी दूर खिंचती है, और निब का आकार ब्रश की त्रिज्या।" # mt
hintstep.roughen.1 = "कोई ऑब्जेक्ट चुनें और उसकी आउटलाइन के साथ खींचें: जहाँ आप खींचते हैं, वहाँ दाँतेदार नुकीले सिरे बन जाते हैं।" # mt
hintstep.roughen.2 = "आवृत्ति तय करती है कि कितने नुकीले सिरे हों, और नुकीले सिरे का आकार यह कि वे कितने ऊँचे हों।" # mt
hintstep.variable_outline.1 = "आउटलाइन वाला कोई ऑब्जेक्ट चुनें और आउटलाइन के आर-पार खींचें: एक चौड़ाई नोड जुड़ता है और आउटलाइन दोनों ओर पॉइंटर तक चौड़ी हो जाती है।" # mt
hintstep.variable_outline.2 = "इसी तरह और चौड़ाई नोड जोड़ें। चौड़ाई एक नोड से अगले नोड तक धीरे-धीरे बदलती है।" # mt
hintstep.variable_outline.3 = "केवल उस ओर को बदलने के लिए जहाँ पॉइंटर है, खींचना शुरू करते समय Shift या Alt दबाए रखें।" # mt
hintstep.variable_outline.4 = "प्रॉपर्टी बार पर बाईं और दाईं चौड़ाई टाइप करने के लिए किसी नोड पर क्लिक करें; Delete उसे हटाता है।" # mt
hintstep.crop.1 = "जिस भाग को रखना चाहते हैं उस पर एक आयत खींचें। उसके बाहर का चित्र धुंधला हो जाता है।" # mt
hintstep.crop.2 = "क्षेत्र को हिलाने के लिए उसके अंदर खींचें, या आकार बदलने के लिए उसका कोई हैंडल खींचें।" # mt
hintstep.crop.3 = "क्रॉप करने के लिए क्षेत्र के अंदर डबल-क्लिक करें या Enter दबाएँ। Esc रद्द करता है।" # mt
hintstep.knife.1 = "प्रॉपर्टी बार पर दो-बिंदु रेखा या फ्रीहैंड चुनें, फिर किसी ऑब्जेक्ट को काटने के लिए उसके आर-पार खींचें।" # mt
hintstep.knife.2 = "टुकड़े अलग-अलग ऑब्जेक्ट बन जाते हैं जिन्हें आप पिक टूल से अलग कर सकते हैं।" # mt
hintstep.knife.3 = "विभाजित करें टुकड़ों के बीच एक बारीक रेखा छोड़ता है; अंतराल आपकी तय की गई चौड़ाई की एक पट्टी हटाता है।" # mt
hintstep.segment_delete.1 = "किसी आउटलाइन के दो कटान बिंदुओं के बीच के भाग को हटाने के लिए उस पर क्लिक करें।" # mt
hintstep.segment_delete.2 = "आउटलाइनों के आर-पार एक आयत खींचें ताकि वह जिस भी भाग को छुए वह हट जाए।" # mt
hintstep.join.1 = "खुली कर्व के सिरे के नोड पर एक स्ट्रोक खींचें: वे जोड़ों में उसी क्रम में जुड़ते हैं जिसमें स्ट्रोक उन तक पहुँचता है। पास के सिरे एक नोड बनते हैं; दूर के सिरों के बीच सीधा खंड बनता है।" # mt
hintstep.join.2 = "एक सिरे के नोड पर, फिर दूसरे पर क्लिक करें ताकि वे दोनों जुड़ें। एक ही कर्व के सिरे उसे बंद करते हैं।" # mt
hintstep.join.3 = "दो कर्व के सिरे पहली कर्व के फ़िल और आउटलाइन के साथ एक कर्व बनते हैं। एक स्ट्रोक के सभी जोड़ एक अनडू चरण हैं।" # mt
hintstep.eraser.1 = "किसी ऑब्जेक्ट पर खींचें ताकि जिन भागों से आप गुज़रें वे मिट जाएँ। एक क्लिक एक बिंदु मिटाता है।" # mt
hintstep.eraser.2 = "प्रॉपर्टी बार पर मोटाई और गोल या चौकोर निब सेट करें।" # mt
hintstep.eraser.3 = "किसी ऑब्जेक्ट को पूरा हटाने के लिए इस टूल से उस पर डबल-क्लिक करें।" # mt
hintstep.shape_builder.1 = "Select the overlapping objects, then drag across the parts you want as one object: each part lights up as you cross it."
hintstep.shape_builder.2 = "The parts become one new object in the colours of the front object, cut out of the objects they came from."
hintstep.shape_builder.3 = "Hold Alt while you drag to take the parts away; click a part to make it an object of its own."
hintstep.zoom.1 = "उस बिंदु पर ज़ूम इन करने के लिए क्लिक करें।" # mt
hintstep.zoom.2 = "एक आयत खींचें ताकि ज़ूम होकर वह विंडो भर दे।" # mt
hintstep.zoom.3 = "ज़ूम आउट करने के लिए राइट-क्लिक या Shift+क्लिक करें। हर ऑब्जेक्ट देखने के लिए टूल के बटन पर डबल-क्लिक करें।" # mt
hintstep.pan.1 = "दृश्य को किसी भी दिशा में हिलाने के लिए खींचें। चित्र नहीं बदलता।" # mt
hintstep.pan.2 = "किसी भी टूल के साथ, पैन करने के लिए माउस के बीच वाले बटन से खींचें।" # mt
hintstep.freehand.1 = "पॉइंटर जहाँ जाए वहाँ रेखा बनाने के लिए पेज पर खींचें, और खत्म करने के लिए छोड़ें।" # mt
hintstep.freehand.2 = "जहाँ सीधी रेखा शुरू होती है वहाँ क्लिक करें और जहाँ खत्म होती है वहाँ फिर से क्लिक करें। 15 डिग्री के चरणों के लिए Ctrl दबाए रखें।" # mt
hintstep.freehand.3 = "किसी चुने गए कर्व को आगे बढ़ाने के लिए उसके अंतिम नोड से शुरू करें; उसे बंद करने के लिए उसके दूसरे सिरे पर खत्म करें।" # mt
hintstep.freehand.4 = "प्रॉपर्टी बार पर चिकनाई तय करती है कि छोड़ने पर रेखा कितनी चिकनी हो।" # mt
hintstep.two_point_line.1 = "जहाँ रेखा शुरू होती है वहाँ दबाएँ और जहाँ खत्म होती है वहाँ छोड़ें।" # mt
hintstep.two_point_line.2 = "रेखा को 15 डिग्री के चरणों में रखने के लिए Ctrl दबाए रखें।" # mt
hintstep.bezier.1 = "कोने का नोड रखने के लिए क्लिक करें, और उस तक सीधा खंड बनाने के लिए फिर से क्लिक करें।" # mt
hintstep.bezier.2 = "चिकना नोड रखने और उसके हैंडल बाहर खींचने के लिए खींचें, जो कर्व की दिशा और मोड़ तय करते हैं।" # mt
hintstep.bezier.3 = "कर्व बंद करने के लिए पहले नोड पर क्लिक करें, या खत्म करने के लिए डबल-क्लिक करें या Enter दबाएँ। Esc कर्व को हटा देता है।" # mt
hintstep.pen.1 = "सीधे खंडों से जुड़े कोने के नोड जोड़ने के लिए क्लिक करें।" # mt
hintstep.pen.2 = "चिकना नोड जोड़ने के लिए खींचें: खींचते समय कर्व आकार लेता है, और अगला खंड पॉइंटर के पीछे चलता है।" # mt
hintstep.pen.3 = "कर्व बंद करने के लिए पहले नोड पर क्लिक करें, या खत्म करने के लिए डबल-क्लिक करें या Enter दबाएँ।" # mt
hintstep.bspline.1 = "नियंत्रण बिंदु रखने के लिए क्लिक करें। कर्व उनके पीछे आसानी से चलता है और हमेशा उनके अंदर रहता है।" # mt
hintstep.bspline.2 = "खत्म करने के लिए डबल-क्लिक करें या Enter दबाएँ, या कर्व को लूप में बंद करने के लिए पहले बिंदु पर क्लिक करें।" # mt
hintstep.curvature_pen.1 = "Click to place points. The curve runs through every one of them and bends smoothly by itself; there are no handles to pull."
hintstep.curvature_pen.2 = "Hold Alt (or C or V) as you click to make that point a corner."
hintstep.curvature_pen.3 = "Double-click or press Enter to finish, or click the first point to close the curve. The curve made has its points as nodes, for the Shape tool."
hintstep.polyline.1 = "हर कोना जोड़ने के लिए क्लिक करें: सीधे खंड एक के बाद एक आते हैं।" # mt
hintstep.polyline.2 = "खत्म करने के लिए डबल-क्लिक करें या Enter दबाएँ, या आकृति बंद करने के लिए पहले नोड पर क्लिक करें। Ctrl हर खंड को 15 डिग्री के चरणों में रखता है।" # mt
hintstep.three_point_curve.1 = "जहाँ कर्व शुरू होता है वहाँ से जहाँ खत्म होता है वहाँ तक खींचें।" # mt
hintstep.three_point_curve.2 = "कर्व को मोड़ने के लिए पॉइंटर हिलाएँ और उस बिंदु पर क्लिक करें जिससे वह गुज़रता है।" # mt
hintstep.brush_strokes.1 = "प्रॉपर्टी बार पर एक मोड और चौड़ाई चुनें: प्रीसेट, ब्रश, स्प्रेयर, कैलिग्राफ़िक या एक्सप्रेशन।" # mt
hintstep.brush_strokes.2 = "पेज पर खींचें: रेखा एक भरा हुआ स्ट्रोक बन जाती है जिसकी चौड़ाई उसके साथ बदलती है।" # mt
hintstep.brush_strokes.3 = "मौजूदा कर्व को स्ट्रोक में बदलने के लिए उन्हें चुनें और ब्रश स्ट्रोक पैनल में कर्व पर लागू करें पर क्लिक करें।" # mt
hintstep.painterly_brush.1 = "प्रॉपर्टी बार पर एक ब्रश, आकार और पारदर्शिता चुनें, फिर पेज पर खींचें।" # mt
hintstep.painterly_brush.2 = "किसी मौजूदा ऑब्जेक्ट की आउटलाइन रंगने के लिए उस पर क्लिक करें और एक ब्रश चुनें।" # mt
hintstep.painterly_brush.3 = "Clear Brushstroke चुने गए ऑब्जेक्ट को उनकी सादी आउटलाइन वापस देता है।" # mt
hintstep.shape_recognition.1 = "एक ही स्ट्रोक में मोटा-मोटा आयत, दीर्घवृत्त या त्रिभुज बनाएँ: वह एक साफ़ आकृति बन जाता है।" # mt
hintstep.shape_recognition.2 = "लगभग सीधा स्ट्रोक सीधी रेखा बन जाता है; बाकी स्ट्रोक चिकने कर्व बन जाते हैं।" # mt
hintstep.shape_recognition.3 = "प्रॉपर्टी बार पर आकृति पहचान और चिकनाई तय करते हैं कि स्ट्रोक कितनी आसानी से आकृति बनें और कितने चिकने हों।" # mt
hintstep.sketch.1 = "एक स्ट्रोक बनाएँ: वह चिकना होकर चुना जाता है।" # mt
hintstep.sketch.2 = "अगला स्ट्रोक पिछले वाले के अंत के पास शुरू करें। जोड़ें चालू होने पर वह उसी कर्व में जुड़ जाता है।" # mt
hintstep.rectangle.1 = "एक कोने से सामने वाले कोने तक तिरछा खींचें।" # mt
hintstep.rectangle.2 = "वर्ग बनाने के लिए Ctrl दबाए रखें, या केंद्र से बाहर की ओर बनाने के लिए Shift।" # mt
hintstep.rectangle.3 = "प्रॉपर्टी बार पर गोल, स्कैलप या चैम्फ़र कोने सेट करें, या शेप टूल से कोने का नोड खींचें।" # mt
hintstep.rectangle.4 = "पेज के आकार का आयत बनाने के लिए टूल के बटन पर डबल-क्लिक करें।" # mt
hintstep.three_point_rectangle.1 = "किसी भी कोण पर आधार रेखा बनाने के लिए खींचें।" # mt
hintstep.three_point_rectangle.2 = "ऊँचाई सेट करने के लिए पॉइंटर हिलाएँ और क्लिक करें।" # mt
hintstep.ellipse.1 = "दीर्घवृत्त बनाने के लिए तिरछा खींचें।" # mt
hintstep.ellipse.2 = "वृत्त बनाने के लिए Ctrl दबाए रखें, या केंद्र से बाहर की ओर बनाने के लिए Shift।" # mt
hintstep.ellipse.3 = "प्रॉपर्टी बार पर पाई या चाप चुनें, या शेप टूल से दीर्घवृत्त का नोड खींचें।" # mt
hintstep.three_point_ellipse.1 = "किसी भी कोण पर दीर्घवृत्त की केंद्र रेखा बनाने के लिए खींचें।" # mt
hintstep.three_point_ellipse.2 = "ऊँचाई सेट करने के लिए पॉइंटर हिलाएँ और क्लिक करें।" # mt
hintstep.polygon.1 = "प्रॉपर्टी बार पर बिंदुओं की संख्या सेट करें और तिरछा खींचें।" # mt
hintstep.polygon.2 = "सममित बहुभुज के लिए Ctrl दबाए रखें, या केंद्र से बाहर की ओर बनाने के लिए Shift।" # mt
hintstep.polygon.3 = "शेप टूल से कोई नोड खींचें: हर भुजा के मेल खाते नोड साथ चलते हैं, इसलिए बहुभुज सममित रहता है।" # mt
hintstep.star.1 = "प्रॉपर्टी बार पर बिंदुओं की संख्या और तीक्ष्णता सेट करें और खींचें।" # mt
hintstep.star.2 = "ऐसे तारे के लिए जिसकी भुजाएँ एक-दूसरे को काटें, जटिल तारा चुनें।" # mt
hintstep.star.3 = "सममित तारे के लिए Ctrl दबाए रखें, या केंद्र से बाहर की ओर बनाने के लिए Shift।" # mt
hintstep.spiral.1 = "प्रॉपर्टी बार पर परिक्रमणों की संख्या सेट करें और खींचें।" # mt
hintstep.spiral.2 = "बराबर दूरी वाले चक्करों के लिए सममित चुनें, या लगातार दूर होते चक्करों के लिए लघुगणकीय।" # mt
hintstep.spiral.3 = "गोल सर्पिल के लिए Ctrl दबाए रखें, या केंद्र से बाहर की ओर बनाने के लिए Shift।" # mt
hintstep.common_shapes.1 = "प्रॉपर्टी बार पर आकृति बटन पर क्लिक करें और एक आकृति चुनें: मूल आकृतियाँ, तीर, फ़्लोचार्ट चिह्न, बैनर या कॉलआउट।" # mt
hintstep.common_shapes.2 = "आकृति बनाने के लिए खींचें। अनुपात बनाए रखने के लिए Ctrl दबाए रखें, या केंद्र से बाहर की ओर बनाने के लिए Shift।" # mt
hintstep.action_lines.1 = "प्रॉपर्टी बार पर समानांतर या रेडियल और रेखाओं की संख्या चुनें।" # mt
hintstep.action_lines.2 = "एक बॉक्स खींचें: गति रेखाएँ उसे भर देती हैं।" # mt
hintstep.graph_paper.1 = "प्रॉपर्टी बार पर पंक्तियों और स्तंभों की संख्या सेट करें।" # mt
hintstep.graph_paper.2 = "ग्रिड बनाने के लिए खींचें। चौकोर सेल के लिए Ctrl दबाए रखें।" # mt
hintstep.graph_paper.3 = "ग्रिड आयतों का एक समूह है: अलग-अलग सेल को रंगने या हिलाने के लिए उसे असमूहित करें।" # mt
