hintstep.transparency.1 = "Fai clic su un oggetto e scegli Uniforme sulla barra delle proprietà per la stessa trasparenza ovunque." # mt
hintstep.transparency.2 = "Trascina attraverso un oggetto per una trasparenza sfumata: opaca dove premi, trasparente dove rilasci." # mt
