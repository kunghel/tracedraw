# Hints panel: the steps of each tool's page (ui/hint_pics.rs)
hintstep.pick.1 = "Fai clic su un oggetto per selezionarlo. Intorno compaiono otto maniglie." # mt
hintstep.pick.2 = "Trascina l'oggetto per spostarlo. Trascina una maniglia d'angolo per ridimensionarlo in proporzione, o una maniglia laterale per allungarlo." # mt
hintstep.pick.3 = "Fai di nuovo clic sull'oggetto selezionato per mostrare le maniglie di rotazione: trascina una freccia d'angolo per ruotarlo, una freccia laterale per inclinarlo." # mt
hintstep.pick.4 = "Trascina una cornice intorno agli oggetti, partendo da un punto vuoto, per selezionare ogni oggetto interamente al suo interno." # mt
hintstep.pick.5 = "Maiusc+clic aggiunge un oggetto alla selezione o lo toglie; Ctrl+clic seleziona un oggetto dentro un gruppo; Alt+clic seleziona l'oggetto sottostante." # mt
hintstep.freehand_pick.1 = "Trascina un anello intorno agli oggetti che vuoi. Al rilascio, ogni oggetto interamente dentro l'anello viene selezionato." # mt
hintstep.freehand_pick.2 = "Tieni premuto Alt al rilascio per selezionare ogni oggetto toccato dall'anello." # mt
hintstep.freehand_pick.3 = "Tieni premuto Maiusc per aggiungere alla selezione, o Ctrl per trascinare un rettangolo invece di un anello. Gli oggetti selezionati si spostano e si ridimensionano come con lo strumento Selezione." # mt
hintstep.free_transform.1 = "Seleziona un oggetto, scegli Rotazione libera sulla barra delle proprietà e trascina: l'oggetto ruota intorno al punto in cui premi." # mt
hintstep.free_transform.2 = "Riflessione con angolo libero rispecchia l'oggetto rispetto alla linea che va dal punto premuto al puntatore." # mt
hintstep.free_transform.3 = "Scala libera ridimensiona l'oggetto dal punto premuto, e Inclinazione libera lo inclina." # mt
hintstep.free_transform.4 = "Tieni premuto Alt per scalare, Ctrl per inclinare o Maiusc per riflettere durante un trascinamento. Con Applica al duplicato attivo, il trascinamento trasforma una copia." # mt
hintstep.shape.1 = "Fai clic su una curva per mostrarne i nodi, poi trascina un nodo per spostarlo." # mt
hintstep.shape.2 = "Fai clic su un nodo per mostrarne le maniglie di controllo, e trascina una maniglia per cambiare la curvatura." # mt
hintstep.shape.3 = "Trascina un segmento per curvarlo. Un segmento dritto diventa curvo." # mt
hintstep.shape.4 = "Doppio clic su un segmento aggiunge lì un nodo; doppio clic su un nodo lo elimina." # mt
hintstep.shape.5 = "Su un rettangolo, trascina un nodo d'angolo per arrotondare gli angoli. Su un'ellisse, trascina il nodo verso l'interno per una torta o verso l'esterno per un arco." # mt
hintstep.smooth.1 = "Seleziona una curva e trascina lungo il contorno: ondulazioni e nodi in più vengono levigati dove passa il pennello." # mt
hintstep.smooth.2 = "Dimensione del pennino imposta il raggio del pennello e Velocità quanto leviga. L'effetto è più forte al centro del pennino." # mt
hintstep.smear.1 = "Seleziona un oggetto e trascina dall'interno del contorno verso l'esterno per tirare fuori un'estensione." # mt
hintstep.smear.2 = "Trascina dall'esterno del contorno verso l'interno per spingere dentro un incavo." # mt
hintstep.smear.3 = "Pressione sulla barra delle proprietà imposta quanto si sposta il contorno, e Dimensione del pennino il raggio del pennello." # mt
hintstep.twirl.1 = "Seleziona un oggetto, metti il pennino sul suo bordo e tieni premuto il pulsante del mouse: il contorno diventa un vortice che cresce finché tieni premuto." # mt
hintstep.twirl.2 = "Scegli senso orario o antiorario sulla barra delle proprietà, o tieni premuto Alt per girare nell'altro senso. Velocità imposta quanto gira in fretta." # mt
hintstep.attract_repel.1 = "Seleziona un oggetto e tieni premuto il pulsante del mouse con il pennino sul contorno: Attrai tira i nodi verso il puntatore." # mt
hintstep.attract_repel.2 = "Scegli Respingi, o tieni premuto Alt, per spingere i nodi lontano dal puntatore." # mt
hintstep.attract_repel.3 = "Dimensione del pennino imposta l'area che cambia e Velocità quanto in fretta cambia. Tenendo fermo il puntatore l'effetto continua." # mt
hintstep.smudge.1 = "Seleziona un oggetto e trascina attraverso il contorno: il contorno viene tirato dolcemente insieme al trascinamento." # mt
hintstep.smudge.2 = "Pressione imposta quanto viene tirato il contorno, e Dimensione del pennino il raggio del pennello." # mt
hintstep.roughen.1 = "Seleziona un oggetto e trascina lungo il contorno: compaiono punte frastagliate dove trascini." # mt
hintstep.roughen.2 = "Frequenza imposta quante punte ci sono, e Dimensione delle punte quanto sono alte." # mt
hintstep.variable_outline.1 = "Seleziona un oggetto con un contorno e trascina attraverso il contorno: viene aggiunto un nodo di spessore e il contorno si allarga fino al puntatore su entrambi i lati." # mt
hintstep.variable_outline.2 = "Aggiungi altri nodi di spessore allo stesso modo. Lo spessore cambia dolcemente da un nodo al successivo." # mt
hintstep.variable_outline.3 = "Tieni premuto Maiusc o Alt quando inizi a trascinare per cambiare solo il lato in cui si trova il puntatore." # mt
hintstep.variable_outline.4 = "Fai clic su un nodo per digitarne lo spessore sinistro e destro sulla barra delle proprietà; Canc lo rimuove." # mt
hintstep.crop.1 = "Trascina un rettangolo sulla parte che vuoi tenere. Il disegno all'esterno viene oscurato." # mt
hintstep.crop.2 = "Trascina dentro l'area per spostarla, o trascina una delle sue maniglie per ridimensionarla." # mt
hintstep.crop.3 = "Doppio clic dentro l'area o premi Invio per ritagliare. Esc annulla." # mt
hintstep.knife.1 = "Scegli Linea a due punti o A mano libera sulla barra delle proprietà, poi trascina attraverso un oggetto per tagliarlo." # mt
hintstep.knife.2 = "I pezzi diventano oggetti separati che puoi allontanare con lo strumento Selezione." # mt
hintstep.knife.3 = "Dividi lascia una linea sottilissima tra i pezzi; Distanza rimuove una fascia della larghezza che imposti." # mt
hintstep.segment_delete.1 = "Fai clic su una parte di contorno tra due incroci per eliminarla." # mt
hintstep.segment_delete.2 = "Trascina un rettangolo attraverso i contorni per eliminare ogni parte che tocca." # mt
hintstep.join.1 = "Disegna un tratto sopra i nodi finali delle curve aperte: vengono uniti a coppie, nell'ordine in cui il tratto li raggiunge. Le estremità vicine diventano un solo nodo; quelle più lontane ricevono un segmento dritto." # mt
hintstep.join.2 = "Fai clic su un nodo finale e poi su un altro per unire quei due. Le estremità di una stessa curva la chiudono." # mt
hintstep.join.3 = "Le estremità di due curve formano una sola curva, con il riempimento e il contorno della prima. Tutte le unioni di un tratto sono un solo passo di annullamento." # mt
hintstep.eraser.1 = "Trascina su un oggetto per cancellare le parti che attraversi. Un clic cancella un punto." # mt
hintstep.eraser.2 = "Imposta lo spessore e un pennino tondo o quadrato sulla barra delle proprietà." # mt
hintstep.eraser.3 = "Doppio clic su un oggetto con lo strumento per eliminarlo intero." # mt
hintstep.shape_builder.1 = "Seleziona gli oggetti sovrapposti e trascina sulle parti da riunire: ogni parte si illumina quando la attraversi."
hintstep.shape_builder.2 = "Le parti diventano un nuovo oggetto con i colori dell'oggetto davanti, ritagliato dagli oggetti d'origine."
hintstep.shape_builder.3 = "Tieni premuto Alt mentre trascini per togliere le parti; fai clic su una parte per farne un oggetto a sé."
hintstep.zoom.1 = "Fai clic per ingrandire in quel punto." # mt
hintstep.zoom.2 = "Trascina un rettangolo per ingrandire finché riempie la finestra." # mt
hintstep.zoom.3 = "Clic destro o Maiusc+clic per ridurre. Doppio clic sul pulsante dello strumento per vedere ogni oggetto." # mt
hintstep.pan.1 = "Trascina per spostare la vista in qualsiasi direzione. Il disegno non cambia." # mt
hintstep.pan.2 = "Con qualsiasi strumento, trascina con il pulsante centrale del mouse per spostare la vista." # mt
hintstep.freehand.1 = "Trascina sulla pagina per disegnare una linea dove va il puntatore, e rilascia per finire." # mt
hintstep.freehand.2 = "Fai clic dove inizia una linea retta e fai di nuovo clic dove finisce. Tieni premuto Ctrl per passi di 15 gradi." # mt
hintstep.freehand.3 = "Inizia su un nodo finale di una curva selezionata per continuarla; finisci sull'altra estremità per chiuderla." # mt
hintstep.freehand.4 = "Smussatura sulla barra delle proprietà imposta quanto viene smussata la linea al rilascio." # mt
hintstep.two_point_line.1 = "Premi dove inizia la linea e rilascia dove finisce." # mt
hintstep.two_point_line.2 = "Tieni premuto Ctrl per mantenere la linea a passi di 15 gradi." # mt
hintstep.bezier.1 = "Fai clic per posizionare un nodo d'angolo, e fai di nuovo clic per tracciare un segmento dritto fino a esso." # mt
hintstep.bezier.2 = "Trascina per posizionare un nodo uniforme ed estrarne le maniglie, che impostano la direzione e la curvatura." # mt
hintstep.bezier.3 = "Fai clic sul primo nodo per chiudere la curva, o fai doppio clic o premi Invio per finire. Esc scarta la curva." # mt
hintstep.pen.1 = "Fai clic per aggiungere nodi d'angolo uniti da segmenti dritti." # mt
hintstep.pen.2 = "Trascina per aggiungere un nodo uniforme: la curva prende forma mentre trascini, e il segmento successivo segue il puntatore." # mt
hintstep.pen.3 = "Fai clic sul primo nodo per chiudere la curva, o fai doppio clic o premi Invio per finire." # mt
hintstep.bspline.1 = "Fai clic per posizionare i punti di controllo. La curva li segue dolcemente e resta sempre al loro interno." # mt
hintstep.bspline.2 = "Fai doppio clic o premi Invio per finire, o fai clic sul primo punto per chiudere la curva ad anello." # mt
hintstep.curvature_pen.1 = "Click to place points. The curve runs through every one of them and bends smoothly by itself; there are no handles to pull."
hintstep.curvature_pen.2 = "Hold Alt (or C or V) as you click to make that point a corner."
hintstep.curvature_pen.3 = "Double-click or press Enter to finish, or click the first point to close the curve. The curve made has its points as nodes, for the Shape tool."
hintstep.polyline.1 = "Fai clic per aggiungere ogni angolo: i segmenti dritti si susseguono uno dopo l'altro." # mt
hintstep.polyline.2 = "Fai doppio clic o premi Invio per finire, o fai clic sul primo nodo per chiudere la forma. Ctrl mantiene ogni segmento a passi di 15 gradi." # mt
hintstep.three_point_curve.1 = "Trascina da dove inizia la curva a dove finisce." # mt
hintstep.three_point_curve.2 = "Muovi il puntatore per curvare la linea e fai clic sul punto da cui passa." # mt
hintstep.brush_strokes.1 = "Scegli una modalità e una larghezza sulla barra delle proprietà: Predefinito, Pennello, Spruzzatore, Calligrafico o Espressione." # mt
hintstep.brush_strokes.2 = "Trascina sulla pagina: la linea diventa un tratto pieno la cui larghezza cambia lungo il percorso." # mt
hintstep.brush_strokes.3 = "Per trasformare curve esistenti in tratti, selezionale e fai clic su Applica alla curva nel pannello Pennellate." # mt
hintstep.painterly_brush.1 = "Scegli un pennello, una dimensione e una trasparenza sulla barra delle proprietà, poi trascina sulla pagina." # mt
hintstep.painterly_brush.2 = "Per dipingere il contorno di un oggetto esistente, fai clic su di esso e scegli un pennello." # mt
hintstep.painterly_brush.3 = "Clear Brushstroke restituisce agli oggetti selezionati il loro contorno semplice." # mt
hintstep.shape_recognition.1 = "Disegna un rettangolo, un'ellisse o un triangolo approssimativo in un solo tratto: diventa una forma pulita." # mt
hintstep.shape_recognition.2 = "Un tratto quasi dritto diventa una linea retta; gli altri tratti diventano curve morbide." # mt
hintstep.shape_recognition.3 = "Riconoscimento delle forme e Smussatura sulla barra delle proprietà impostano con quanta facilità i tratti diventano forme e quanto vengono smussati." # mt
hintstep.sketch.1 = "Disegna un tratto: viene smussato e selezionato." # mt
hintstep.sketch.2 = "Inizia il tratto successivo vicino alla fine dell'ultimo. Con Unisci attivo, viene aggiunto alla stessa curva." # mt
hintstep.rectangle.1 = "Trascina in diagonale da un angolo a quello opposto." # mt
