welcome.choose_workspace = "Scegli un'area di lavoro"
welcome.get_started = "Inizia"
welcome.learn = "Impara"
welcome.learn_1_body = "Scegli uno strumento dalla casella degli strumenti (tieni premuto un pulsante per il suo menu a comparsa) e trascina sulla pagina. Tieni premuto Ctrl per vincolare, Maiusc per disegnare dal centro."
welcome.learn_1_title = "Disegnare"
welcome.learn_2_body = "Fai clic per selezionare, fai di nuovo clic per le maniglie di rotazione e inclinazione, trascina gli angoli per ridimensionare. I tasti freccia spostano di poco; Maiusc+frecce spostano dieci volte di più."
welcome.learn_2_title = "Selezionare e trasformare"
welcome.learn_3_body = "Fai clic con il pulsante sinistro su un colore della tavolozza per il riempimento, con il destro per il contorno. Il pannello Proprietà modifica i riempimenti sfumati, a motivo, a texture e a maglia."
welcome.learn_3_title = "Riempimenti e contorni"
welcome.learn_4_body = "Lo strumento Forma (F10) modifica i nodi: fai doppio clic su un segmento per aggiungere un nodo, doppio clic su un nodo per eliminarlo, usa la barra delle proprietà per cuspide, smussato e simmetrico."
welcome.learn_4_title = "Nodi"
welcome.learn_5_body = "Gli effetti restano modificabili: apri il pannello dell'effetto dal menu Effetti, cambia i valori e l'oggetto si aggiorna. Appiattisci effetti li rende definitivi."
welcome.learn_5_title = "Effetti"
welcome.my_templates = "I miei modelli"
welcome.new_document = "Nuovo documento"
welcome.new_from_template = "Nuovo da modello"
welcome.news.more = "Vuoi saperne di più?" # mt
welcome.news.v0_53_0_body = "Oggetto > Inserisci > Grafico dai dati disegna una tabella come colonne, barre, linee o torta. Unisci forme segue con fluidità l'oggetto trascinato, accoglie copie e altri oggetti, e Converti in curve ne mantiene il colore. Combina dal vivo funziona in ogni modalità, Arrotonda angoli e Affetta si aggiungono agli effetti di livello, e il pannello Dispersione simboli ottiene un pennello. I livelli possono comparire su un intervallo di pagine scelto, gli opuscoli accettano 16 pagine per lato con scorrimento, l'esportazione PDF può comprimere le immagini fino a una dimensione di file desiderata, e i menu contestuali si possono personalizzare. I disegni con migliaia di testi si aprono e scorrono molto più velocemente. Questa versione corregge anche molti errori segnalati." # mt
welcome.news.v0_53_0_title = "Grafici dai dati, Unisci forme più fluido e livelli su intervalli di pagine" # mt
welcome.news.v0_52_0_body = "Un doppio clic su un'immagine apre una modalità completa di modifica delle immagini, con la sua casella degli strumenti, un tasto per ogni strumento, nuove maschere e pennelli e i menu Immagine e Regola. Le Forme comuni restano regolabili dopo essere state disegnate, con maniglie a rombo per la punta di una freccia, un angolo arrotondato o la coda di un fumetto. Salvare ed esportare un disegno grande avvengono in background mostrando l'avanzamento, le stampanti PostScript su Windows mantengono i valori CMYK e nel pannello Oggetti si possono scegliere più livelli insieme. Questa versione corregge anche molti bug che avete segnalato." # mt
welcome.news.v0_52_0_title = "Una modalità completa di modifica delle immagini, Forme comuni regolabili e salvataggio in background" # mt
welcome.news.v0_51_1_body = "Un passaggio lungo, come il salvataggio di un disegno grande, non mostra più un messaggio che offre un rapporto: compariva a ogni salvataggio di un file grande e sembrava un blocco. Il rapporto viene offerto solo quando TraceDraw si è davvero chiuso per un errore, e ora conserva la causa dell'errore. Su macOS, TraceDraw non si chiude più quando arriva un evento mentre un altro è ancora in elaborazione." # mt
welcome.news.v0_51_1_title = "Niente più messaggi “non risponde”" # mt
welcome.news.v0_51_0_body = "I disegni grandi restano rapidi: lo zoom con la rotellina, la selezione di oggetti con effetti, il trascinamento dei colori e la scrittura di testi lunghi richiedono meno lavoro, e le immagini grandi occupano meno memoria. Separa mantenendo i fori divide una curva lasciando ogni foro nella sua parte, Scambia riempimenti e Contorno dal riempimento sono nel menu del pannello colore, e Allinea e distribuisci spazia gli oggetti con margini uguali sulla pagina. I simboli si modificano su un foglio pulito, il righello verticale può contare dall'alto, un disegno inviato come .zip si apre trascinandolo sulla finestra, e le celle delle tabelle si allineano dall'alto in basso. Questa versione corregge anche molti bug segnalati." # mt
welcome.news.v0_51_0_title = "Disegni grandi più rapidi, Separa mantenendo i fori e disegni zippati" # mt
welcome.news.v0_50_3_body = "Quando TraceDraw non risponde per più di 10 secondi, o si chiude per un errore, ora lo dice e propone di inviare un rapporto di ciò che stava facendo, senza il nome né il contenuto del disegno: Invia rapporto apre una segnalazione GitHub compilata da controllare e inviare. Con le pagine affiancate, un oggetto rilasciato su un'altra pagina nella vista a più pagine torna a essere di quella pagina, cosa che la 0.50.1 aveva rotto." # mt
welcome.news.v0_50_3_title = "Rapporti quando TraceDraw smette di rispondere, oggetti tra pagine affiancate" # mt
welcome.news.v0_50_2_body = "Questa versione corregge due segnalazioni sulla 0.50.1. Un file PDF/X viene creato per il profilo CMYK del disegno stesso, ad esempio U.S. Web Coated (SWOP) v2, dove indicava sempre FOGRA39. Una fusione dentro una cornice di ritaglio mantiene i suoi passaggi quando solo la selezione viene esportata come immagine, dove uscivano a scala." # mt
welcome.news.v0_50_2_title = "Correzioni: condizione di output PDF/X e fusioni nelle immagini esportate" # mt
welcome.news.v0_50_1_body = "Questa versione corregge quanto segnalato sulla 0.50.0. Su Windows, Aiuto > Aggiornamenti completa l'installazione anche mentre Esplora file mostra immagini .cdr, e avvisa se un aggiornamento non è terminato. Con le pagine affiancate, gli oggetti delle due pagine selezionati insieme restano sulla loro pagina. Separa mantiene l'ombra del gruppo, File > Ripristina funziona per i disegni aperti da .cdr, SVG o PDF, e Salva con nome mostra di nuovo il tipo e la versione su Mac. I file .cdr della versione 15 si aprono con ombre e trasparenze, e la Guida mostra passo passo come usare il Generatore di forme e i nuovi strumenti della 0.50." # mt
welcome.news.v0_50_1_title = "Correzioni: aggiornamenti su Windows, pagine affiancate, separa, Ripristina e Salva con nome" # mt
welcome.news.v0_50_0_body = "Gli involucri hanno una maglia che piega forme e immagini, e Oggetto > Combina forme spezza, unisce e taglia oggetti sovrapposti in un solo passo. La Penna curvatura disegna curve morbide per i punti cliccati, il testo si curva a cerchio, arco e onda dalla barra del testo, e gli oggetti adattati a un tracciato lo seguono dal vivo. Gli effetti di livello aggiungono bordi ruvidi, riempimenti a schizzo, segni di taglio e bordi sfumati, i gradienti possono avere retinatura e punti di colore liberi, e i riempimenti possono essere olografici. Rivoluzione 3D, Riflesso di luce, Trasforma ciascuno e Appiattisci trasparenza sono nuovi, e l'interfaccia è in vietnamita. Questa versione corregge anche molti bug segnalati, dalla stampa e importazione PDF al salvataggio .cdr e alla vettorializzazione." # mt
welcome.news.v0_50_0_title = "Involucri a maglia, Combina forme, Penna curvatura ed effetti dal vivo" # mt
welcome.news.v0_49_0_body = "Questa versione porta correzioni. Un salvataggio che fallisce a metà non perde più il file che sostituiva, e i backup automatici di due TraceDraw, o di due disegni con lo stesso nome, non si sovrascrivono più. I disegni grandi restano veloci: Raggruppa, Combina, Separa e Annulla su decine di migliaia di oggetti richiedono una frazione di secondo, e i disegni molto annidati si riaprono. Salvato come .cdr, un disegno conserva i livelli nascosti, i riempimenti a motivo e a maglia, le emoji, gli a capo e le sfumature di colori spot. I file PDF, SVG, EPS ed EMF entrano ed escono più vicini a ciò che mostrano: testo con contorno, sfumature, trasparenze graduali, immagini ruotate, ebraico e arabo. Converti in curve mantiene il colore di ogni parola, una guida si può prendere sopra qualsiasi oggetto e Combina seleziona il risultato. Su Windows, TraceDraw non rallenta più l'intero computer avviando un processo ogni pochi secondi, e sui tablet Maiusc, Ctrl e Alt si bloccano con due tocchi." # mt
welcome.news.v0_49_0_title = "Salvataggio più sicuro, importazioni più fedeli e disegni grandi più veloci" # mt
welcome.news.v0_48_0_body = "Questa versione porta correzioni. Nel testo, Maiusc+Invio va a capo, gli elenchi numerati tornano leggibili, i capilettera rispettano il numero di righe e Converti in curve mantiene le lettere sovrapposte. La vettorizzazione avviene in una finestra con l'avanzamento e Annulla, così il programma non sembra più bloccato. Le immagini esportate mantengono tutti i bordi della pagina, senza una linea chiara sul bordo, e il salvataggio in .cdr non tralascia più le linee di lunghezza zero. Le immagini importate mantengono la loro modalità di colore, i cloni nei file .cdr restano collegati all'originale e le trasparenze a motivo e i font da destra a sinistra dei .cdr si aprono. Sugli schermi touch la Penna continua dall'ultimo nodo, la linea a 2 punti segue il dito e le righe del pannello Oggetti si possono trascinare. Le linee guida hanno un menu nel pannello Oggetti, la griglia parte dall'alto della pagina e un file DXF con blocchi molto annidati non esaurisce più la memoria. I file .ai classici dei programmi di vettorizzazione si aprono a colori e raggruppati, e Invio nelle caselle di Contorno applica il contorno." # mt
welcome.news.v0_48_0_title = "Correzioni a testo, vettorizzazione, esportazione e schermi touch" # mt
