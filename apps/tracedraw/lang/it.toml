hintstep.rectangle.3 = "Imposta angoli arrotondati, smerlati o smussati sulla barra delle proprietà, o trascina un nodo d'angolo con lo strumento Forma." # mt
hintstep.rectangle.4 = "Doppio clic sul pulsante dello strumento per disegnare un rettangolo grande quanto la pagina." # mt
hintstep.three_point_rectangle.1 = "Trascina per tracciare la linea di base, con qualsiasi angolo." # mt
hintstep.three_point_rectangle.2 = "Muovi il puntatore per impostare l'altezza e fai clic." # mt
hintstep.ellipse.1 = "Trascina in diagonale per disegnare un'ellisse." # mt
hintstep.ellipse.2 = "Tieni premuto Ctrl per disegnare un cerchio, o Maiusc per disegnare dal centro verso l'esterno." # mt
hintstep.ellipse.3 = "Scegli Torta o Arco sulla barra delle proprietà, o trascina il nodo dell'ellisse con lo strumento Forma." # mt
hintstep.three_point_ellipse.1 = "Trascina per tracciare la linea centrale dell'ellisse, con qualsiasi angolo." # mt
hintstep.three_point_ellipse.2 = "Muovi il puntatore per impostare l'altezza e fai clic." # mt
hintstep.polygon.1 = "Imposta il numero di punte sulla barra delle proprietà e trascina in diagonale." # mt
hintstep.polygon.2 = "Tieni premuto Ctrl per un poligono simmetrico, o Maiusc per disegnare dal centro verso l'esterno." # mt
hintstep.polygon.3 = "Trascina un nodo con lo strumento Forma: i nodi corrispondenti di ogni lato seguono, così il poligono resta simmetrico." # mt
hintstep.star.1 = "Imposta il numero di punte e la nitidezza sulla barra delle proprietà e trascina." # mt
hintstep.star.2 = "Scegli Stella complessa per una stella i cui lati si incrociano." # mt
hintstep.star.3 = "Tieni premuto Ctrl per una stella simmetrica, o Maiusc per disegnare dal centro verso l'esterno." # mt
hintstep.spiral.1 = "Imposta il numero di giri sulla barra delle proprietà e trascina." # mt
hintstep.spiral.2 = "Scegli Simmetrico per giri equidistanti, o Logaritmica per giri che si allontanano sempre di più." # mt
hintstep.spiral.3 = "Tieni premuto Ctrl per una spirale rotonda, o Maiusc per disegnare dal centro verso l'esterno." # mt
hintstep.common_shapes.1 = "Fai clic sul pulsante delle forme sulla barra delle proprietà e scegli una forma: forme di base, frecce, simboli di diagramma di flusso, banner o richiami." # mt
hintstep.common_shapes.2 = "Trascina per disegnare la forma. Tieni premuto Ctrl per mantenerne le proporzioni, o Maiusc per disegnare dal centro verso l'esterno." # mt
hintstep.action_lines.1 = "Scegli Parallela o Radiale e il numero di linee sulla barra delle proprietà." # mt
hintstep.action_lines.2 = "Trascina un riquadro: le linee di velocità lo riempiono." # mt
hintstep.graph_paper.1 = "Imposta il numero di righe e colonne sulla barra delle proprietà." # mt
hintstep.graph_paper.2 = "Trascina per disegnare la griglia. Tieni premuto Ctrl per celle quadrate." # mt
hintstep.graph_paper.3 = "La griglia è un gruppo di rettangoli: separa il gruppo per colorare o spostare singole celle." # mt
