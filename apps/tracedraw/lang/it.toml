web.notice_title = "TraceDraw nel browser"
web.notice_text = "**Un browser è più lento:** disegni grandi, effetti pesanti e file grandi richiedono più tempo, i font installati sul computer non sono disponibili (i font liberi arrivano dal catalogo della pagina quando un disegno li richiede, e quelli aggiunti nel Gestore font restano), e i file si aprono caricandoli e si salvano come download.\n\nÈ lo stesso programma Rust dell'app desktop, compilato in WebAssembly per provarlo senza installare nulla.\n\nPer il lavoro vero e i file grandi usa l'app per Windows, macOS o Linux: gira in modo nativo, alla massima velocità." # mt
