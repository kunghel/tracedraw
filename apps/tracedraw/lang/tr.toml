welcome.learn_4_title = "Düğümler"
welcome.learn_5_body = "Efektler düzenlenebilir kalır: efektin panelini Efektler menüsünden açın, değerleri değiştirin ve nesne güncellenir. Efektleri Düzleştir onları kalıcı hâle getirir."
