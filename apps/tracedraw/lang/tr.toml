welcome.learn_1_body = "Araç kutusundan bir araç seçin (açılır menüsü için düğmeyi basılı tutun) ve sayfada sürükleyin. Kısıtlamak için Ctrl, merkezden çizmek için Shift tuşunu basılı tutun."
welcome.learn_1_title = "Çizim"
welcome.learn_2_body = "Seçmek için tıklayın, döndürme ve eğme tutamaçları için yeniden tıklayın, ölçeklemek için köşeleri sürükleyin. Ok tuşları kaydırır; Shift+ok tuşları on kat daha uzağa kaydırır."
welcome.learn_2_title = "Seçme ve dönüştürme"
welcome.learn_3_body = "Dolgu için bir palet rengine sol tıklayın, anahat için sağ tıklayın. Özellikler paneli gradyan, desen, doku ve ağ dolgularını düzenler."
welcome.learn_3_title = "Dolgular ve anahatlar"
