hintstep.shape_builder.2 = "The parts become one new object in the colours of the front object, cut out of the objects they came from."
hintstep.shape_builder.3 = "Hold Alt while you drag to take the parts away; click a part to make it an object of its own."
hintstep.zoom.1 = "O noktada yakınlaştırmak için tıklayın." # mt
hintstep.zoom.2 = "Pencereyi dolduracak şekilde yakınlaştırmak için bir dikdörtgen sürükleyin." # mt
hintstep.zoom.3 = "Uzaklaştırmak için sağ tıklayın ya da Shift+tıklayın. Tüm nesneleri görmek için aracın düğmesine çift tıklayın." # mt
