web.notice_text = "**Tarayıcı daha yavaştır:** büyük çizimler, ağır efektler ve büyük dosyalar daha uzun sürer, bilgisayarınızda yüklü yazı tipleri kullanılamaz (ücretsiz yazı tipleri bir çizim gerektirdiğinde sayfanın kataloğundan gelir, Yazı Tipi Yöneticisi'nde eklediğiniz yazı tipleri saklanır), dosyalar yüklenerek açılır ve indirme olarak kaydedilir.\n\nBu, masaüstü uygulamasıyla aynı Rust programıdır; hiçbir şey kurmadan denemeniz için WebAssembly'ye derlenmiştir.\n\nGerçek iş ve büyük dosyalar için Windows, macOS veya Linux uygulamasını kullanın: yerel olarak, tam hızda çalışır." # mt
