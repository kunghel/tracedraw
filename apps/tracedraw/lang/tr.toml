welcome.news.more = "Daha fazlasını öğrenmek ister misiniz?" # mt
welcome.news.v0_51_1_body = "Büyük bir çizimi kaydetmek gibi uzun süren bir adım artık rapor öneren bir ileti göstermiyor: büyük bir dosyanın her kaydında çıkıyor ve çökme gibi görünüyordu. Rapor yalnızca TraceDraw gerçekten bir hata nedeniyle kapandığında önerilir ve artık hatanın nedenini korur. macOS'ta, bir olay işlenirken başka bir olay geldiğinde TraceDraw artık kapanmıyor." # mt
welcome.news.v0_51_1_title = "“Yanıt vermiyor” iletileri artık yok" # mt
welcome.news.v0_51_0_body = "Büyük çizimler hızlı kalır: tekerlekle yakınlaştırma, efektli nesneleri seçme, renk sürükleme ve uzun metinlerde yazma daha az iş gerektirir, büyük resimler daha az bellek kullanır. Delikleri Koruyarak Ayır bir eğriyi her deliği kendi parçasında bırakarak böler, Dolguları Değiştir ve Dolgudan Kontur renk panelinin menüsündedir, Hizala ve Dağıt nesneleri sayfada eşit kenar boşluklarıyla dağıtır. Semboller temiz bir sayfada düzenlenir, dikey cetvel yukarıdan sayabilir, .zip olarak gönderilen çizim pencereye bırakılınca açılır ve tablo hücreleri yukarıdan aşağı hizalanır. Bu sürüm ayrıca bildirdiğiniz birçok hatayı düzeltir." # mt
welcome.news.v0_51_0_title = "Daha hızlı büyük çizimler, Delikleri Koruyarak Ayır ve zip çizimler" # mt
welcome.news.v0_50_3_body = "TraceDraw 10 saniyeden uzun yanıt vermediğinde ya da bir hata nedeniyle kapandığında artık bunu söylüyor ve ne yaptığına dair bir rapor göndermeyi öneriyor; çizimin adı veya içeriği olmadan: Rapor Gönder, kontrol edip göndermeniz için doldurulmuş bir GitHub kaydı açar. Karşılıklı sayfalarda, çok sayfalı görünümde başka bir sayfaya bırakılan nesne yeniden o sayfaya ait olur; 0.50.1 bunu bozmuştu." # mt
welcome.news.v0_50_3_title = "TraceDraw yanıt vermediğinde raporlar, karşılıklı sayfalar arasında nesneler" # mt
welcome.news.v0_50_2_body = "Bu sürüm 0.50.1 için iki bildirimi düzeltir. Bir PDF/X dosyası, örneğin U.S. Web Coated (SWOP) v2 gibi çizimin kendi CMYK profili için yapılır; eskiden hep FOGRA39 yazıyordu. Bir kırpma çerçevesindeki karışım, yalnızca seçim resim olarak dışa aktarıldığında adımlarını korur; eskiden merdiven gibi çıkıyordu." # mt
welcome.news.v0_50_2_title = "Düzeltmeler: PDF/X çıktı koşulu ve dışa aktarılan resimlerdeki karışımlar" # mt
welcome.news.v0_50_1_body = "Bu sürüm 0.50.0 için bildirdiklerinizi düzeltir. Windows'ta Yardım > Güncellemeler, Gezgin .cdr resimlerini gösterirken bile kurulumu bitirir ve bir güncelleme tamamlanmadıysa bunu söyler. Karşılıklı sayfalarda iki sayfanın birlikte seçilen nesneleri kendi sayfalarında kalır. Grubu çözmek grubun gölgesini korur, Dosya > Geri Döndür .cdr, SVG veya PDF'den açılan çizimlerde çalışır ve Farklı Kaydet Mac'te türü ve sürümü yeniden gösterir. Sürüm 15 .cdr dosyaları gölgeleri ve saydamlıklarıyla açılır, Yardım da Şekil Üreticisi'nin ve 0.50'nin yeni araçlarının nasıl kullanılacağını adım adım gösterir." # mt
welcome.news.v0_50_1_title = "Düzeltmeler: Windows'ta güncellemeler, karşılıklı sayfalar, grubu çözme, Geri Döndür ve Farklı Kaydet" # mt
welcome.news.v0_50_0_body = "Zarflar şekilleri ve resimleri büken bir ağ aldı, Nesne > Şekilleri Birleştir de üst üste binen nesneleri tek adımda böler, birleştirir ve keser. Eğrilik Kalemi tıklanan noktalardan yumuşak eğriler çizer, metin metin çubuğundan daire, kemer ve dalga biçimine bükülür ve bir yola oturtulan nesneler onu canlı izler. Katman efektleri pürüzlü kenar, eskiz dolgu, kesim işaretleri ve yumuşak kenar ekler, degradeler titreşimli olabilir ve serbest renk noktaları karıştırabilir, dolgular holografik olabilir. 3D Döndürme, Işık Parlaması, Her Birini Dönüştür ve Saydamlığı Düzleştir yeni, arayüz Vietnamca da var. Bu sürüm ayrıca yazdırmadan PDF içe aktarmaya, .cdr kaydetmeden izlemeye kadar bildirdiğiniz birçok hatayı düzeltir." # mt
welcome.news.v0_50_0_title = "Ağ zarflar, Şekilleri Birleştir, Eğrilik Kalemi ve canlı efektler" # mt
welcome.news.v0_49_0_body = "Bu sürüm düzeltmeler getiriyor. Yarıda başarısız olan bir kaydetme artık yerine geçtiği dosyayı kaybetmiyor; iki TraceDraw'ın veya aynı adlı iki çizimin otomatik yedekleri artık birbirinin üzerine yazmıyor. Büyük çizimler hızlı kalıyor: on binlerce nesnede Grupla, Birleştir, Grubu Çöz ve Geri Al saniyenin bir kesrini sürüyor ve derin iç içe çizimler yeniden açılıyor. .cdr olarak kaydedilen bir çizim gizli katmanlarını, desen ve ağ dolgularını, emojileri, satır sonlarını ve spot renk geçişlerini koruyor. PDF, SVG, EPS ve EMF dosyaları gösterdiklerine daha yakın açılıp kaydediliyor: dış çizgili metin, geçişler, kademeli saydamlıklar, döndürülmüş resimler, İbranice ve Arapça. Eğrilere Dönüştür her kelimenin rengini koruyor, bir kılavuz çizgisi her nesnenin üzerinden tutulabiliyor ve Birleştir sonucu seçiyor. Windows'ta TraceDraw artık birkaç saniyede bir işlem başlatarak tüm bilgisayarı yavaşlatmıyor; tabletlerde Shift, Ctrl ve Alt iki dokunuşla kilitleniyor." # mt
welcome.news.v0_49_0_title = "Daha güvenli kaydetme, daha sadık içe aktarma ve daha hızlı büyük çizimler" # mt
welcome.news.v0_48_0_body = "Bu sürüm düzeltmeler getiriyor. Metinde Shift+Enter satırı bölüyor, numaralı madde işaretleri yeniden okunabiliyor, büyük ilk harfler ayarlanan satır sayısına uyuyor ve Eğrilere Dönüştür üst üste binen harfleri koruyor. İzleme, ilerlemesini ve İptal düğmesini gösteren bir pencerede yapılıyor, böylece program artık donmuş görünmüyor. Dışa aktarılan resimler sayfanın tüm kenarlarını koruyor, kenarda açık renkli çizgi kalmıyor ve .cdr olarak kaydetmek artık sıfır uzunluktaki çizgileri atlamıyor. İçe aktarılan resimler renk modlarını koruyor, .cdr dosyalarındaki klonlar asıllarına bağlı kalıyor ve .cdr desen saydamlıkları ile sağdan sola yazı tipleri doğru açılıyor. Dokunmatik ekranlarda Kalem son düğümden devam ediyor, 2 noktalı çizgi parmağı izliyor ve Nesneler panelinin satırları sürüklenebiliyor. Kılavuz çizgilerinin Nesneler panelinde bir menüsü var, ızgara sayfanın üstünden başlıyor ve çok iç içe bloklar içeren bir DXF dosyası artık belleği tüketmiyor. İzleme programlarından gelen klasik .ai dosyaları renkli ve gruplu açılıyor, Kontur kutularında Enter konturu uyguluyor." # mt
welcome.news.v0_48_0_title = "Metin, izleme, dışa aktarma ve dokunmatik ekran düzeltmeleri" # mt
welcome.news.v0_47_0_body = "Şekil Oluşturucu aracı, üst üste binen nesnelerin parçalarını tek bir sürüklemeyle birleştirir ya da çıkarır; Birleştir aracı eğrilerin uçlarını tek bir çizgiyle birleştirir. Elektronik tablolar (.xlsx, CSV, TSV) düzenlenebilir tablolar olarak açılır, formüller Nesne > Ekle > Formül ile eklenir ve metin sağdan sola akabilir, numaralı madde işaretleri ve farklı genişlikte sütunlarla. Yazdırma bir posteri birkaç kâğıda böler, her kalıbı kendi tramıyla ayrı bir dosyaya koyar ve elle çift taraflı yazdırır. Katman Efektleri bir nesneye parıltı, eğim ve gölgeleri canlı olarak üst üste ekler. Yardım > Performans Testi bilgisayarı puanlar, Hafif yakınlaştırma yavaş bilgisayarlara yardım eder. .cdr dosyaları B-spline eğrilerini, perspektifleri ve dairesel saydamlıkları korur. Videolarınızdan düzeltmeler: gölgeler nesnelerinde kalıyor ve ayrılabiliyor, yakınlaştırma kutusu gerçek yakınlaştırmayı gösteriyor, her palet kendi başına kayıyor, Tümünü Seç kilitli nesneleri dışarıda bırakıyor ve panel sekmeleri adlarını koruyor. .tdraw dosyaları çok daha küçük: her resim yalnızca bir kez, sıkıştırılmış olarak saklanıyor ve içe aktarılan JPEG'ler olduğu gibi kalıyor; büyük dosyalar için yükleme çubuğu var. Eski dosyalar açılmaya devam ediyor, ancak 0.47 veya daha yenisiyle kaydedilen bir dosya yalnızca 0.47 veya daha yenisinde açılıyor." # mt
welcome.news.v0_47_0_title = "Şekil Oluşturucu, elektronik tablolar, formüller ve poster baskısı" # mt
welcome.news.v0_46_0_body = "Perspektif resimlerde çalışıyor ve bir harmanlamanın adımlarına tıklamak tüm harmanlamayı seçiyor. Anahattı Nesneye Dönüştür, Kaynak, Kırp ve Birleştir grupların içinde çalışıyor, Efektleri Düzleştir gölgeleri ayırıyor ve Renk Stilleri paneline sürüklenen nesneler renk stili oluyor. Palet renkleri Seçim veya Şekil aracıyla seçilen tablo hücrelerini dolduruyor ve ölçek alanları bir nesnenin ne kadar ölçeklendiğini gösteriyor. Baskı Önizleme tek bir sayfayı kendi başına döndürüyor ve karşılıklı sayfaların sırtını aşan nesneleri koruyor, bir PDF resim olarak açılabiliyor ve PDF dışa aktarımı geçişli saydamlığı ve gölgeleri koruyor. DXF dosyaları AutoCAD'de açılıyor, .cdr sanatsal metni dosyanın koyduğu yerde duruyor ve Windows'ta pencereye bırakılan dosyalar artık kaybolmuyor." # mt
welcome.news.v0_46_0_title = "Resimlerde perspektif, tablo hücreleri ve Baskı Önizleme düzeltmeleri" # mt
