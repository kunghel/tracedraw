hintstep.join.3 = "İki eğrinin uçları, ilkinin dolgusu ve dış çizgisiyle tek bir eğri olur. Bir çizginin tüm birleştirmeleri tek bir geri alma adımıdır." # mt
hintstep.eraser.1 = "Geçtiğiniz kısımları silmek için bir nesnenin üzerinde sürükleyin. Bir tıklama tek bir nokta siler." # mt
hintstep.eraser.2 = "Özellik Çubuğu'nda kalınlığı ve yuvarlak ya da kare bir uç ayarlayın." # mt
hintstep.eraser.3 = "Bir nesneyi tamamen silmek için araçla ona çift tıklayın." # mt
