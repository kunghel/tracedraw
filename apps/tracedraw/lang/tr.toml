hintstep.segment_delete.2 = "Dokunduğu her kısmı silmek için anahatların üzerinden bir dikdörtgen sürükleyin." # mt
hintstep.join.1 = "Açık eğrilerin uç düğümleri üzerinden bir çizgi çizin: çizginin onlara ulaştığı sırayla çiftler halinde birleşirler. Yakın uçlar tek düğüm olur; uzak olanlar düz bir parçayla birleşir." # mt
