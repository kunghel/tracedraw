web.notice_text = "**У браузері робота повільніша:** великі малюнки, складні ефекти й великі файли потребують більше часу. Шрифти, встановлені на вашому комп'ютері, недоступні: безкоштовні шрифти завантажуються з каталогу сторінки, коли текст уперше їх використовує, а шрифти, додані через «Керування шрифтами», зберігаються в цьому браузері. Файли відкриваються через завантаження на сторінку, а зберігаються як завантаження з браузера.\n\nЦе та сама програма мовою Rust, що й настільний застосунок, скомпільована у WebAssembly. Її можна спробувати без встановлення.\n\nДля повсякденної роботи й великих файлів використовуйте настільний застосунок для Windows, macOS або Linux: він працює безпосередньо в системі з повною швидкодією." # mt
