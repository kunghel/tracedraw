welcome.news.v0_50_0_body = "Envelopes take a mesh that bends shapes and pictures, and Object > Combine Shapes breaks, merges and cuts overlapping objects in one step. The Curvature Pen draws smooth curves through the points you click, text curves into circles, arches and waves from the text bar, and objects fitted to a path follow it live. Layer effects add rough edges, sketch fills, trim marks and soft edges, gradients can dither and blend free colour points, and fills can be holographic foil. 3D Revolve, Light Flare, Transform Each and Flatten Transparency are new, and the interface comes in Vietnamese. This version also fixes many bugs you reported, from printing and PDF import to .cdr saving and tracing." # review
