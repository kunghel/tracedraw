welcome.news.v0_53_0_body = "Object > Insert > Chart from Data draws a table as columns, bars, lines or a pie. Merge Shapes follows a dragged object smoothly, takes in copies and more objects, and Convert to Curves keeps its paint. Combine Live works in every mode, Round Corners and Slice join the layer effects, and the Symbol Scatter panel gets a brush. Layers can show on a chosen range of pages, booklets take 16 pages a side with creep, PDF export can compress pictures to a target file size, and right-click menus can be customized. Drawings with thousands of texts open and pan much faster. This version also fixes many bugs you reported." # mt
welcome.news.v0_53_0_title = "Charts from data, smoother Merge Shapes and layers on page ranges" # mt
welcome.news.v0_52_0_body = "A double click on a picture opens a complete image editing mode, with its own toolbox, keys for every tool, new masks and brushes, and Image and Adjust menus. Common Shapes stay adjustable after they are drawn, with diamond handles for an arrow's head, a rounded corner or a callout's tail. Saving and exporting a large drawing run in the background with their progress shown, PostScript printers on Windows keep CMYK values, and layers can be picked several at once in the Objects docker. This version also fixes many bugs you reported." # review
welcome.news.v0_52_0_title = "A complete image editing mode, adjustable Common Shapes and saving in the background" # review
