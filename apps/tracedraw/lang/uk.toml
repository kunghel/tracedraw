welcome.learn_1_body = "Виберіть інструмент на панелі й протягніть по сторінці. Утримуйте кнопку інструмента, щоб відкрити його групу. Ctrl обмежує пропорції та кути, Shift малює від центра." # mt
welcome.learn_1_title = "Малюнок" # mt
welcome.learn_2_body = "Клацніть, щоб вибрати об'єкт; клацніть ще раз, щоб показати маркери повороту й нахилу. Тягніть за кути, щоб змінити розмір. Клавіші зі стрілками переміщують об'єкт, а з Shift крок удесятеро більший." # mt
welcome.learn_2_title = "Вибір і перетворення" # mt
welcome.learn_3_body = "Клацніть колір палітри лівою кнопкою, щоб задати заливку, або правою, щоб задати обведення. На панелі властивостей можна редагувати градієнтні, візерункові, текстурні та сітчасті заливки." # mt
welcome.learn_3_title = "Заливки й обведення" # mt
welcome.learn_4_body = "Інструмент «Форма» (F10) редагує вузли: подвійне клацання сегмента додає вузол, а вузла видаляє його. На панелі властивостей можна зробити вузол кутовим, гладким або симетричним." # mt
welcome.learn_4_title = "Вузли" # mt
welcome.learn_5_body = "Ефекти залишаються редагованими: відкрийте панель ефекту з меню «Ефекти» й змініть значення, щоб оновити об'єкт. Команда «Застосувати ефекти остаточно» перетворює результат на звичайні об'єкти." # mt
welcome.learn_5_title = "Ефекти" # mt
welcome.my_templates = "Мої шаблони" # mt
welcome.new_document = "Новий документ" # mt
welcome.new_from_template = "Створити з шаблону" # mt
welcome.news.more = "Бажаєте дізнатися більше?" # mt
welcome.news.v0_49_0_body = "This version is about fixes. A save that fails half way no longer loses the file it replaces, and the auto-backups of two TraceDraws, or of two drawings of the same name, no longer overwrite each other. Large drawings stay quick: Group, Combine, Ungroup and Undo of tens of thousands of objects take a fraction of a second, and deeply nested drawings open again. Saved as .cdr, a drawing keeps its hidden layers, pattern and mesh fills, emoji, line breaks and spot colour gradients. PDF, SVG, EPS and EMF files come in and go out closer to what they show: outlined text, gradients, fading transparencies, turned pictures, Hebrew and Arabic. Convert to Curves keeps each word's colour, a guideline can be taken over any object, and Combine selects its result. On Windows, TraceDraw no longer slows the whole computer by starting a process every few seconds, and on tablets Shift, Ctrl and Alt lock with two taps." # review
welcome.news.v0_49_0_title = "Safer saving, truer imports and faster large drawings" # review
welcome.news.v0_48_0_body = "This version is about fixes. In text, Shift+Enter breaks the line, numbered bullets can be read again, drop caps keep to their number of lines, and Convert to Curves keeps overlapping letters. Tracing runs in a window with its progress and Cancel, so the program no longer looks frozen. Exported pictures keep every edge of the page, with no light line along the border, and saving as .cdr no longer leaves out lines of no length. Imported pictures keep their colour mode, .cdr clones stay linked to their master, and .cdr pattern transparencies and right-to-left fonts open. On touch screens the Pen goes on from the last node, the 2-point line follows the finger and Objects docker rows can be dragged. Guidelines have a menu in the Objects docker, the grid starts at the top of the page, and a DXF file of deeply nested blocks no longer runs out of memory. Classic .ai files from tracing programs open in colour and grouped, and Enter in the Contour boxes applies the contour." # review
welcome.news.v0_48_0_title = "Fixes for text, tracing, exports and touch screens" # review
welcome.news.v0_46_0_body = "Perspective works on pictures, and a click on a blend's steps selects the whole blend. Convert Outline to Object, Weld, Trim and Combine work inside groups, Flatten Effects breaks off drop shadows, and objects dragged onto the Color Styles docker become colour styles. Palette colours fill table cells chosen with the Pick or Shape tool, and the scale fields show how far an object is scaled. Print Preview turns one page on its own and keeps objects across the spine of facing pages, a PDF can open as pictures, and PDF export keeps gradient transparency and drop shadows. DXF files open in AutoCAD, .cdr artistic text sits where the file places it, and files dropped on the window on Windows are no longer lost." # review
welcome.news.v0_46_0_title = "Perspective on pictures, table cells and Print Preview fixes" # review
