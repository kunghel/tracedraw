welcome.news.v0_51_1_body = "Тривала дія, наприклад збереження великого малюнка, більше не викликає повідомлення з пропозицією надіслати звіт: воно з'являлося під час кожного збереження великого файлу й виглядало як повідомлення про аварійне завершення. Звіт пропонується лише тоді, коли TraceDraw справді закрився через помилку, і тепер зберігає її причину. У macOS TraceDraw більше не закривається, коли подія надходить під час обробки іншої." # mt
welcome.news.v0_51_1_title = "Без зайвих повідомлень «не відповідає»" # mt
welcome.news.v0_51_0_body = "Великі малюнки працюють швидко: масштабування колесом, вибір об'єктів з ефектами, перетягування кольорів і введення довгих текстів потребують менше обчислень, а великі зображення займають менше пам'яті. «Розбити зі збереженням отворів» розділяє криву, залишаючи кожен отвір у відповідній частині; «Обміняти заливки» та «Обведення із заливки» доступні в меню панелі кольорів, а «Вирівняти й розподілити» може розміщувати об'єкти з однаковими проміжками на сторінці. Символи редагуються на чистому аркуші, вертикальна лінійка може відлічувати згори вниз, малюнок у .zip відкривається перетягуванням у вікно, а клітинки таблиці вирівнюються по вертикалі. Ця версія також виправляє багато помилок, про які ви повідомили." # mt
welcome.news.v0_51_0_title = "Швидші великі малюнки, розбиття зі збереженням отворів і малюнки в архівах" # mt
welcome.news.v0_50_3_body = "Якщо TraceDraw не відповідає понад 10 секунд або закривається через помилку, він тепер повідомляє про це й пропонує надіслати звіт про виконувані дії без назви й вмісту малюнка: «Надіслати звіт» відкриває заповнене звернення на GitHub, яке можна перевірити й надіслати. На розвороті об'єкт, відпущений на іншій сторінці в багатосторінковому режимі, знову належить цій сторінці; у 0.50.1 це було порушено." # mt
welcome.news.v0_50_3_title = "Звіти, коли TraceDraw не відповідає, й об'єкти на розворотах" # mt
welcome.news.v0_50_2_body = "Ця версія виправляє дві проблеми, про які повідомили для 0.50.1. Файл PDF/X створюється для власного CMYK-профілю малюнка, наприклад U.S. Web Coated (SWOP) v2, тоді як раніше завжди вказувався FOGRA39. Перетікання всередині рамки обрізання зберігає свої переходи під час експорту лише вибраних об'єктів як зображення, замість ступінчастого вигляду." # mt
welcome.news.v0_50_2_title = "Виправлення: умови виведення PDF/X і перетікання в експортованих зображеннях" # mt
welcome.news.v0_50_1_body = "Ця версія виправляє проблеми, про які ви повідомили для 0.50.0. У Windows «Довідка > Оновлення» завершує встановлення, навіть коли Провідник показує зображення .cdr, і повідомляє, якщо оновлення не завершилося. На розвороті об'єкти обох сторінок, вибрані разом, залишаються на своїх сторінках. Розгрупування зберігає тінь групи, «Файл > Повернути» працює для малюнків, відкритих із .cdr, SVG або PDF, а «Зберегти як» знову показує тип і версію на Mac. Файли .cdr версії 15 відкриваються з тінями й прозорістю, а довідка покроково пояснює використання генератора фігур та нових інструментів 0.50." # mt
welcome.news.v0_50_1_title = "Виправлення: оновлення у Windows, розвороти, розгрупування, повернення й збереження як" # mt
