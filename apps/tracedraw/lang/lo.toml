hintobj.curve.title = "ເສັ້ນໂຄ້ງ"
hintobj.curve.1 = "ໃຊ້ເຄື່ອງມື ຮູບຮ່າງ ແກ່ຈຸດຂໍ້ຕໍ່ ແລະ ສ່ວນເສັ້ນເພື່ອປ່ຽນຮູບຮ່າງ; ກົດສອງເທື່ອໃສ່ສ່ວນເສັ້ນເພື່ອເພີ່ມຈຸດຂໍ້ຕໍ່."
hintobj.curve.2 = "ຮວມເຂົ້າກັນ (Ctrl+L) ເຊື່ອມເສັ້ນໂຄ້ງເຂົ້າເປັນເສັ້ນດຽວ; ແຍກອອກ (Ctrl+K) ແຍກເສັ້ນໂຄ້ງອອກເປັນສ່ວນຕ່າງໆ."
hintobj.curve.bar = "ຕຳແໜ່ງ, ຂະໜາດ ແລະ ມຸມອຽງ, ຄວາມໜາເສັ້ນຂອບ, ຮູບແບບເສັ້ນ, ຫົວລູກສອນ ແລະ ລຳດັບຊັ້ນ."
hintobj.rectangle.title = "ຮູບສີ່ແຈສາກ"
hintobj.rectangle.1 = "ໃຊ້ເຄື່ອງມື ຮູບຮ່າງ ແກ່ຈຸດຂໍ້ຕໍ່ມຸມເພື່ອເຮັດໃຫ້ມຸມມົນ."
hintobj.rectangle.2 = "ແປງເປັນເສັ້ນໂຄ້ງ (Ctrl+Q) ເຮັດໃຫ້ມັນກາຍເປັນເສັ້ນໂຄ້ງທີ່ຈຸດຂໍ້ຕໍ່ຍ້າຍໄດ້ຢ່າງອິດສະຫຼະ."
hintobj.rectangle.bar = "ຕຳແໜ່ງ, ຂະໜາດ ແລະ ມຸມອຽງ, ມຸມມົນ, ມຸມເວົ້າ ຫຼື ມຸມຕັດ, ເສັ້ນຂອບ ແລະ ລຳດັບຊັ້ນ."
hintobj.ellipse.title = "ຮູບວົງລີ"
hintobj.ellipse.1 = "ໃຊ້ເຄື່ອງມື ຮູບຮ່າງ ແກ່ຈຸດຂໍ້ຕໍ່ເຂົ້າທາງໃນຮູບວົງລີເພື່ອເຮັດເປັນຮູບຊິ້ນພາຍ ຫຼື ອອກທາງນອກເພື່ອເຮັດເປັນຮູບເສັ້ນໂຄ້ງ."
hintobj.ellipse.2 = "ແປງເປັນເສັ້ນໂຄ້ງ (Ctrl+Q) ເຮັດໃຫ້ມັນກາຍເປັນເສັ້ນໂຄ້ງທີ່ຈຸດຂໍ້ຕໍ່ຍ້າຍໄດ້ຢ່າງອິດສະຫຼະ."
hintobj.ellipse.bar = "ຕຳແໜ່ງ, ຂະໜາດ ແລະ ມຸມອຽງ, ຮູບວົງລີ, ຮູບຊິ້ນພາຍ ຫຼື ຮູບເສັ້ນໂຄ້ງ ພ້ອມມຸມເລີ່ມ ແລະ ມຸມສິ້ນສຸດ, ເສັ້ນຂອບ ແລະ ລຳດັບຊັ້ນ."
hintobj.polygon.title = "ຮູບຫຼາຍແຈ ຫຼື ດາວ"
hintobj.polygon.1 = "ໃຊ້ເຄື່ອງມື ຮູບຮ່າງ ແກ່ຈຸດຂໍ້ຕໍ່ໃດໜຶ່ງ: ທຸກໆດ້ານ ຫຼື ທຸກໆແສກຈະປ່ຽນໄປພ້ອມກັນ."
hintobj.polygon.2 = "ແປງເປັນເສັ້ນໂຄ້ງ (Ctrl+Q) ເຮັດໃຫ້ມັນກາຍເປັນເສັ້ນໂຄ້ງທີ່ຈຸດຂໍ້ຕໍ່ຍ້າຍໄດ້ຢ່າງອິດສະຫຼະ."
hintobj.polygon.bar = "ຕຳແໜ່ງ, ຂະໜາດ ແລະ ມຸມອຽງ, ຈຳນວນແສກ ຫຼື ດ້ານ, ຄວາມແຫຼມ, ເສັ້ນຂອບ ແລະ ລຳດັບຊັ້ນ."
hintobj.text.title = "ຂໍ້ຄວາມສິລະປະ"
hintobj.text.1 = "ກົດໃສ່ດ້ວຍເຄື່ອງມື ຂໍ້ຄວາມ ເພື່ອແກ້ໄຂຄຳສັບ; ແກ່ຈຸດຄວບຄຸມມຸມເພື່ອປັບຂະໜາດຕົວອັກສອນ."
hintobj.text.2 = "ໃຊ້ເຄື່ອງມື ຮູບຮ່າງ ແກ່ຈຸດຂໍ້ຕໍ່ຂອງຕົວອັກສອນເພື່ອຍ້າຍຕົວອັກສອນນັ້ນ."
hintobj.text.bar = "ຕຳແໜ່ງ, ຂະໜາດ ແລະ ມຸມອຽງ, ຈາກນັ້ນແມ່ນແບບອັກສອນ, ຂະໜາດ, ຮູບແບບ ແລະ ການຈັດລຽງ."
hintobj.paragraph_text.title = "ຂໍ້ຄວາມຫຍໍ້ໜ້າ"
hintobj.paragraph_text.1 = "ກົດໃສ່ດ້ວຍເຄື່ອງມື ຂໍ້ຄວາມ ເພື່ອແກ້ໄຂຄຳສັບ; ຂໍ້ຄວາມຈະຂຶ້ນແຖວໃໝ່ອັດຕະໂນມັດຕາມຂອບຂອງກອບ."
hintobj.paragraph_text.2 = "ແກ່ຈຸດຄວບຄຸມເພື່ອປັບຂະໜາດກອບ: ຂໍ້ຄວາມຈະໄຫຼຄືນໃໝ່ໃຫ້ພໍດີ."
hintobj.paragraph_text.bar = "ຕຳແໜ່ງ, ຂະໜາດ ແລະ ມຸມອຽງ, ຈາກນັ້ນແມ່ນແບບອັກສອນ, ຂະໜາດ, ຮູບແບບ, ການຈັດລຽງ ແລະ ການຕັ້ງຄ່າຫຍໍ້ໜ້າ."
hintobj.bitmap.title = "ບິດແມັບ"
hintobj.bitmap.1 = "ຕັດຮູບດ້ວຍເຄື່ອງມື ຕັດຮູບ, ຫຼື ດູດເອົາສີຈາກຮູບດ້ວຍເຄື່ອງມືດູດສີ."
hintobj.bitmap.2 = "ເມນູ ບິດແມັບ ຈະແປງຮູບເປັນເສັ້ນໂຄ້ງ, ປັບຄວາມລະອຽດ, ປ່ຽນໂໝດສີ ແລະ ໃສ່ລູກຫຼິ້ນພິເສດ."
hintobj.bitmap.bar = "ຕຳແໜ່ງ, ຂະໜາດ ແລະ ມຸມອຽງ, ແກ້ໄຂບິດແມັບ, ຕັດບິດແມັບ, ແປງບິດແມັບເປັນເສັ້ນ ແລະ ດັດຮູບໃຫ້ຊື່."
hintobj.group.title = "ກຸ່ມ"
hintobj.group.1 = "ກຸ່ມຈະຍ້າຍ, ປັບຂະໜາດ ແລະ ໝູນໄປພ້ອມກັນ; Ctrl+ກົດ ເພື່ອເລືອກວັດຖຸອັນດຽວທີ່ຢູ່ທາງໃນ."
hintobj.group.2 = "ຍົກເລີກການຈັດກຸ່ມ (Ctrl+U) ເພື່ອແຍກອອກຈາກກັນ; ແຜງວັດຖຸຈະສະແດງລາຍການສິ່ງທີ່ຢູ່ຂ້າງໃນ."
hintobj.group.bar = "ຕຳແໜ່ງ, ຂະໜາດ ແລະ ມຸມອຽງ, ເສັ້ນຂອບ, ລຳດັບຊັ້ນ, ຈັດກຸ່ມ ແລະ ຍົກເລີກການຈັດກຸ່ມ, ພ້ອມທັງຄຳສັ່ງດັດຮູບຮ່າງ."
hintobj.clip_frame.title = "ກອບຕັດຮູບ"
hintobj.clip_frame.1 = "ມັນສະແດງສະເພາະເນື້ອຫາສ່ວນທີ່ຢູ່ທາງໃນກອບເທົ່ານັ້ນ. ແກ່ວັດຖຸມາໃສ່ ແລະ ກົດ W ຄ້າງໄວ້ເພື່ອເພີ່ມເຂົ້າ."
hintobj.clip_frame.2 = "ວັດຖຸ > ຕັດໃສ່ກອບ > ແກ້ໄຂເນື້ອຫາ ຊ່ວຍໃຫ້ຍ້າຍເນື້ອຫາໄດ້; ດຶງເນື້ອຫາອອກ ຈະເອົາມັນອອກມາ."
hintobj.clip_frame.bar = "ຕຳແໜ່ງ, ຂະໜາດ ແລະ ມຸມອຽງ, ປັບເນື້ອຫາໃຫ້ພໍດີ, ລັອກເນື້ອຫາ ແລະ ສຳເລັດການແກ້ໄຂເນື້ອຫາ."
hintobj.blend.title = "ການເຊື່ອມກືນ"
hintobj.blend.1 = "ຍ້າຍ, ປັບຂະໜາດ ຫຼື ປ່ຽນສີວັດຖຸເລີ່ມຕົ້ນ ຫຼື ສິ້ນສຸດ ແລ້ວຂັ້ນຕອນລະຫວ່າງກາງຈະປ່ຽນຕາມ."
hintobj.blend.2 = "ກົດໃສ່ດ້ວຍເຄື່ອງມື ເຊື່ອມກືນ ເພື່ອປ່ຽນຈຳນວນຂັ້ນຕອນ; ແຍກກຸ່ມເຊື່ອມກືນອອກ ຈະແປງຂັ້ນຕອນຕ່າງໆເປັນວັດຖຸທຳມະດາ."
hintobj.blend.bar = "ເມື່ອໃຊ້ເຄື່ອງມື ເຊື່ອມກືນ: ຈຳນວນຂັ້ນຕອນ ແລະ ການໝູນ, ລຶບລ້າງການເຊື່ອມກືນ ແລະ ແຍກອອກຈາກກັນ."
hintobj.dimension.title = "ເສັ້ນບອກຂະໜາດ"
hintobj.dimension.1 = "ປ້າຍກຳກັບຈະສະແດງໄລຍະຫ່າງ ຫຼື ມຸມທີ່ວັດແທກໄດ້ຕາມຫົວໜ່ວຍທີ່ເລືອກ."
hintobj.dimension.2 = "ແຕ້ມເພີ່ມເຕີມດ້ວຍເຄື່ອງມືວັດແທກຂະໜາດ; ດູດຕິດໃສ່ຈຸດຂໍ້ຕໍ່ເພື່ອການວັດແທກທີ່ຊັດເຈນ."
hintobj.dimension.bar = "ຄວາມລະອຽດ, ຫົວໜ່ວຍ, ຄຳນຳໜ້າ ແລະ ຄຳລົງທ້າຍ, ຕຳແໜ່ງ ແລະ ຂະໜາດຂໍ້ຄວາມ, ລູກສອນ ແລະ ຄວາມໜາເສັ້ນ."
hintobj.connector.title = "ເສັ້ນເຊື່ອມຕໍ່"
hintobj.connector.1 = "ມັນຈະຕິດຢູ່ກັບວັດຖຸຢູ່ສົ້ນທັງສອງສະເໝີ: ຍ້າຍວັດຖຸແລ້ວເສັ້ນຈະຍ້າຍຕາມ."
hintobj.connector.2 = "ເຄື່ອງມື ແກ້ໄຂຈຸດຍຶດ ໃຊ້ເພີ່ມ, ຍ້າຍ ແລະ ລຶບຈຸດຍຶດທີ່ມັນຕິດຢູ່."
hintobj.connector.bar = "ຕຳແໜ່ງ, ຂະໜາດ ແລະ ມຸມອຽງ, ຮູບແບບເສັ້ນ (ຊື່, ມຸມສາກ ຫຼື ມົນ) ແລະ ເສັ້ນຂອບ."
hintobj.callout.title = "ກ່ອງຄຳອະທິບາຍ"
hintobj.callout.1 = "ມັນຊີ້ຈາກປາຍໄປຫາຂໍ້ຄວາມ; ແກ້ໄຂຂໍ້ຄວາມດ້ວຍເຄື່ອງມື ຂໍ້ຄວາມ."
hintobj.callout.2 = "ແຕ້ມເພີ່ມດ້ວຍເຄື່ອງມື ກ່ອງຄຳອະທິບາຍ: ແກ່ຈາກປາຍໄປຫາຂໍ້ພັບ, ແລ້ວກົດບ່ອນທີ່ຈະວາງຂໍ້ຄວາມ."
hintobj.callout.bar = "ຕຳແໜ່ງ, ຂະໜາດ ແລະ ມຸມອຽງ, ຫົວລູກສອນຢູ່ປາຍ ແລະ ຮູບຮ່າງອ້ອມຂໍ້ຄວາມ."
hintobj.table.title = "ຕາຕະລາງ"
hintobj.table.1 = "ກົດໃສ່ຫ້ອງດ້ວຍເຄື່ອງມື ຕາຕະລາງ ແລ້ວພິມ; ກົດ Tab ເພື່ອໄປຫ້ອງຖັດໄປ."
hintobj.table.2 = "ເມນູ ຕາຕະລາງ ໃຊ້ແຊກ, ລຶບ, ຮວມ ແລະ ແບ່ງແຖວ ພ້ອມທັງຖັນ."
hintobj.table.bar = "ເມື່ອໃຊ້ເຄື່ອງມື ຕາຕະລາງ: ແຖວ ແລະ ຖັນ, ພື້ນຫຼັງ, ເສັ້ນຂອບ ແລະ ໄລຍະຫ່າງຂອບຫ້ອງ."
hintobj.symbol.title = "ສັນຍະລັກ"
hintobj.symbol.1 = "ທຸກສຳເນົາຂອງສັນຍະລັກຈະສະແດງຮູບຄືກັນ: ແກ້ໄຂສັນຍະລັກເທື່ອດຽວແລ້ວສຳເນົາທັງໝົດຈະປ່ຽນຕາມ."
hintobj.symbol.2 = "ແຜງສັນຍະລັກຈະສະແດງລາຍການສັນຍະລັກຂອງຮູບແຕ້ມ ແລະ ໃຊ້ແກ້ໄຂພວກມັນ."
hintobj.symbol.bar = "ຕຳແໜ່ງ, ຂະໜາດ ແລະ ມຸມອຽງ, ເສັ້ນຂອບ ແລະ ລຳດັບຊັ້ນ."
hintobj.effect.title = "ວັດຖຸທີ່ມີລູກຫຼິ້ນພິເສດ"
hintobj.effect.1 = "ລູກຫຼິ້ນສົດ ເຊັ່ນ: ເສັ້ນຊ້ອນຂອບ, ການດັດຮູບຊົງ, ການດຶງມິຕິ ຫຼື ການບິດບ້ຽວ ຈະຖືກແຕ້ມໃໝ່ທຸກຄັ້ງທີ່ທ່ານປ່ຽນແປງວັດຖຸ."
hintobj.effect.2 = "ກົດໃສ່ດ້ວຍເຄື່ອງມືຂອງລູກຫຼິ້ນນັ້ນເພື່ອປ່ຽນແປງ; ແຜງລູກຫຼິ້ນຈະສະແດງລາຍການລູກຫຼິ້ນ ແລະ ໃຊ້ລຶບພວກມັນອອກ."
hintobj.effect.bar = "ຕຳແໜ່ງ, ຂະໜາດ ແລະ ມຸມອຽງ, ເສັ້ນຂອບ ແລະ ລຳດັບຊັ້ນ; ເຄື່ອງມືຂອງແຕ່ລະລູກຫຼິ້ນຈະສະແດງຕົວເລືອກສະເພາະຕົວ."
hintobj.several.title = "ຫຼາຍວັດຖຸ"
hintobj.several.1 = "ແກ່ພວກມັນເພື່ອຍ້າຍໄປພ້ອມກັນ; ແກ່ຈຸດຄວບຄຸມເພື່ອປັບຂະໜາດໄປພ້ອມກັນ."
hintobj.several.2 = "ຈັດກຸ່ມ (Ctrl+G) ເພື່ອຮວບຮວມໄວ້ນຳກັນ; ຮວມ (Ctrl+L) ເພື່ອເຮັດໃຫ້ເປັນເສັ້ນໂຄ້ງດຽວ; ຈັດລຽງ ແລະ ແບ່ງໄລຍະ ເພື່ອຈັດໃຫ້ສະເໝີກັນ."
hintobj.several.bar = "ຕຳແໜ່ງ ແລະ ຂະໜາດຂອງສິ່ງທີ່ເລືອກ, ຈັດກຸ່ມ, ຮວມ, ເຊື່ອມຕິດ, ຕັດອອກ, ຕັດສ່ວນທັບຊ້ອນ ແລະ ຄຳສັ່ງດັດຮູບຮ່າງອື່ນໆ."
