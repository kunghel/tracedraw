# Hints panel: the steps of each tool's page (ui/hint_pics.rs)
hintstep.pick.1 = "ຄລິກໃສ່ວັດຖຸເພື່ອເລືອກ. ຈະມີຈຸດຈັບແປດຈຸດປະກົດຂຶ້ນອ້ອມຮອບວັດຖຸ."
hintstep.pick.2 = "ລາກວັດຖຸເພື່ອຍ້າຍ. ລາກຈຸດຈັບທີ່ມຸມເພື່ອປັບຂະໜາດຕາມສັດສ່ວນ, ຫຼື ລາກຈຸດຈັບດ້ານຂ້າງເພື່ອຢືດຂະໜາດ."
hintstep.pick.3 = "ຄລິກໃສ່ວັດຖຸທີ່ເລືອກອີກຄັ້ງເພື່ອສະແດງຈຸດຈັບໝູນ: ລາກລູກສອນທີ່ມຸມເພື່ອໝູນ, ລາກລູກສອນດ້ານຂ້າງເພື່ອອຽງ."
hintstep.pick.4 = "ລາກກອບອ້ອມຮອບວັດຖຸ ໂດຍເລີ່ມຈາກພື້ນທີ່ວ່າງ ເພື່ອເລືອກທຸກວັດຖຸທີ່ຢູ່ພາຍໃນກອບທັງໝົດ."
hintstep.pick.5 = "Shift+ຄລິກ ເພື່ອເພີ່ມວັດຖຸເຂົ້າໃນການເລືອກ ຫຼື ເອົາອອກ; Ctrl+ຄລິກ ເພື່ອເລືອກວັດຖຸທີ່ຢູ່ພາຍໃນກຸ່ມ; Alt+ຄລິກ ເພື່ອເລືອກວັດຖຸທີ່ຢູ່ທາງກ້ອງ."
hintstep.freehand_pick.1 = "ລາກເສັ້ນອ້ອມຮອບວັດຖຸທີ່ທ່ານຕ້ອງການ. ເມື່ອປ່ອຍມື, ທຸກວັດຖຸທີ່ຢູ່ພາຍໃນວົງເສັ້ນນັ້ນຈະຖືກເລືອກ."
hintstep.freehand_pick.2 = "ກົດ Alt ຄ້າງໄວ້ຕອນປ່ອຍມື ເພື່ອເລືອກທຸກວັດຖຸທີ່ເສັ້ນລາກຜ່ານຖືກ."
hintstep.freehand_pick.3 = "ກົດ Shift ຄ້າງໄວ້ເພື່ອເພີ່ມເຂົ້າໃນການເລືອກ, ຫຼື ກົດ Ctrl ເພື່ອລາກເປັນຮູບສີ່ແຈສາກແທນເສັ້ນໂຄ້ງ. ວັດຖຸທີ່ເລືອກສາມາດຍ້າຍ ແລະ ປັບຂະໜາດໄດ້ຄືກັບເຄື່ອງມື Pick."
hintstep.free_transform.1 = "ເລືອກວັດຖຸ, ເລືອກ 'ໝູນອິດສະຫຼະ' ເທິງແຖບຄຸນສົມບັດ ແລ້ວລາກ: ວັດຖຸຈະໝູນອ້ອມຈຸດທີ່ທ່ານກົດ."
hintstep.free_transform.2 = "ການສະທ້ອນມຸມອິດສະຫຼະ ຈະສະທ້ອນວັດຖຸຂ້າມເສັ້ນແຕ່ຈຸດກົດໄປຫາຕົວກະພິບ."
hintstep.free_transform.3 = "ການປັບຂະໜາດອິດສະຫຼະ ຈະປັບຂະໜາດວັດຖຸຈາກຈຸດກົດ, ແລະ ການອຽງອິດສະຫຼະ ຈະເຮັດໃຫ້ວັດຖຸອຽງ."
hintstep.free_transform.4 = "ກົດ Alt ຄ້າງໄວ້ເພື່ອປັບຂະໜາດ, Ctrl ເພື່ອອຽງ ຫຼື Shift ເພື່ອສະທ້ອນໃນການລາກຄັ້ງດຽວ. ຫາກເປີດ 'ນຳໃຊ້ກັບສຳເນົາ', ການລາກຈະແປງຮູບຮ່າງໃສ່ສຳເນົາແທນ."
hintstep.shape.1 = "ຄລິກໃສ່ເສັ້ນໂຄ້ງເພື່ອສະແດງຈຸດເຊື່ອມຕໍ່, ແລ້ວລາກຈຸດເຊື່ອມຕໍ່ເພື່ອຍ້າຍ."
hintstep.shape.2 = "ຄລິກໃສ່ຈຸດເຊື່ອມຕໍ່ເພື່ອສະແດງແຂນຄວບຄຸມ, ແລະ ລາກແຂນຄວບຄຸມເພື່ອປ່ຽນຄວາມໂຄ້ງຂອງເສັ້ນ."
hintstep.shape.3 = "ລາກສ່ວນເສັ້ນເພື່ອດັດໂຄ້ງ. ເສັ້ນຊື່ຈະກາຍເປັນເສັ້ນໂຄ້ງ."
hintstep.shape.4 = "ຄລິກສອງບາດໃສ່ສ່ວນເສັ້ນເພື່ອເພີ່ມຈຸດເຊື່ອມຕໍ່; ຄລິກສອງບາດໃສ່ຈຸດເຊື່ອມຕໍ່ເພື່ອລຶບອອກ."
hintstep.shape.5 = "ໃນຮູບສີ່ແຈສາກ, ລາກຈຸດເຊື່ອມຕໍ່ທີ່ມຸມເພື່ອເຮັດໃຫ້ມຸມມົນ. ໃນຮູບວົງຮີ, ລາກຈຸດເຊື່ອມຕໍ່ເຂົ້າດ້ານໃນເພື່ອສ້າງຮູບພາຍ ຫຼື ລາກອອກດ້ານນອກເພື່ອສ້າງເສັ້ນໂຄ້ງເປີດ."
hintstep.smooth.1 = "ເລືອກເສັ້ນໂຄ້ງແລ້ວລາກໄປຕາມເສັ້ນຂອບ: ຮອຍຄື້ນ ແລະ ຈຸດເຊື່ອມຕໍ່ທີ່ເກີນມາຈະຖືກປັບໃຫ້ລຽບນຽນຕາມຮອຍແປງທີ່ຜ່ານ."
hintstep.smooth.2 = "ຂະໜາດຫົວແປງ (Nib size) ກຳນົດລັດສະໝີຂອງແປງ ແລະ ອັດຕາ (Rate) ກຳນົດຄວາມແຮງໃນການປັບລຽບ. ຜົນລັບຈະເກີດຂຶ້ນແຮງທີ່ສຸດຢູ່ໃຈກາງຫົວແປງ."
hintstep.smear.1 = "ເລືອກວັດຖຸແລ້ວລາກຈາກພາຍໃນເສັ້ນຂອບອອກມາຂ້າງນອກ ເພື່ອດຶງສ່ວນຍື່ນອອກມາ."
hintstep.smear.2 = "ລາກຈາກພາຍນອກເສັ້ນຂອບເຂົ້າໄປຂ້າງໃນ ເພື່ອຍູ້ໃຫ້ເກີດຮອຍເວົ້າ."
hintstep.smear.3 = "ຄ່າແຮງກົດເທິງແຖບຄຸນສົມບັດກຳນົດໄລຍະທີ່ເສັ້ນຂອບຈະຍັບຍ້າຍ, ແລະ ຂະໜາດຫົວແປງກຳນົດລັດສະໝີຂອງແປງ."
hintstep.twirl.1 = "ເລືອກວັດຖຸ, ວາງຫົວແປງໄວ້ທີ່ຂອບຂອງມັນ ແລ້ວກົດປຸ່ມເມົາສ໌ຄ້າງໄວ້: ເສັ້ນຂອບຈະໝູນວຽນເປັນກົ້ນຫອຍ ແລະ ໃຫຍ່ຂຶ້ນເລື້ອຍໆ ໃນຂະນະທີ່ກົດຄ້າງ."
hintstep.twirl.2 = "ເລືອກໝູນຕາມເຂັມໂມງ ຫຼື ທວນເຂັມໂມງເທິງແຖບຄຸນສົມບັດ, ຫຼື ກົດ Alt ຄ້າງໄວ້ເພື່ອໝູນໄປອີກທາງ. ຄວາມໄວກຳນົດຄວາມໄວໃນການໝູນ."
hintstep.attract_repel.1 = "ເລືອກວັດຖຸ ແລະ ກົດປຸ່ມເມົາສ໌ຄ້າງໄວ້ໂດຍໃຫ້ຫົວແປງຢູ່ເທິງເສັ້ນຂອບ: ໂໝດດຶງດູດ (Attract) ຈະດຶງຈຸດເຊື່ອມຕໍ່ເຂົ້າມາຫາຕົວກະພິບ."
hintstep.attract_repel.2 = "ເລືອກໂໝດຍູ້ອອກ (Repel), ຫຼື ກົດ Alt ຄ້າງໄວ້ ເພື່ອຍູ້ຈຸດເຊື່ອມຕໍ່ອອກໄປຈາກຕົວກະພິບ."
hintstep.attract_repel.3 = "ຂະໜາດຫົວແປງກຳນົດພື້ນທີ່ທີ່ໄດ້ຮັບຜົນກະທົບ ແລະ ຄວາມໄວກຳນົດຄວາມໄວໃນການປ່ຽນແປງ. ການວາງຕົວກະພິບໄວ້ນິ້ງໆ ຈະເຮັດໃຫ້ຜົນກະທົບເກີດຂຶ້ນຕໍ່ເນື່ອງ."
hintstep.smudge.1 = "ເລືອກວັດຖຸແລ້ວລາກຜ່ານເສັ້ນຂອບ: ເສັ້ນຂອບຈະຖືກດຶງໃຫ້ຍ້າຍໄປຢ່າງລຽບນຽນຕາມຮອຍລາກ."
hintstep.smudge.2 = "ແຮງກົດກຳນົດໄລຍະທີ່ເສັ້ນຂອບຈະຖືກດຶງໄປ, ແລະ ຂະໜາດຫົວແປງກຳນົດລັດສະໝີຂອງແປງ."
hintstep.roughen.1 = "ເລືອກວັດຖຸແລ້ວລາກໄປຕາມເສັ້ນຂອບ: ຮອຍແຫຼມແບບແຂ້ວເລື່ອຍຈະປະກົດຂຶ້ນຕາມບ່ອນທີ່ທ່ານລາກຜ່ານ."
hintstep.roughen.2 = "ຄວາມຖີ່ (Frequency) ກຳນົດຈຳນວນຮອຍແຫຼມ, ແລະ ຂະໜາດຮອຍແຫຼມ (Spike size) ກຳນົດຄວາມສູງຂອງຮອຍແຫຼມ."
hintstep.variable_outline.1 = "ເລືອກວັດຖຸທີ່ມີເສັ້ນຂອບ ແລ້ວລາກຜ່ານເສັ້ນຂອບ: ຈຸດກຳນົດຄວາມກວ້າງຈະຖືກເພີ່ມ ແລະ ເສັ້ນຂອບຈະຂະຫຍາຍອອກໄປຫາຕົວກະພິບທັງສອງດ້ານ."
hintstep.variable_outline.2 = "ເພີ່ມຈຸດກຳນົດຄວາມກວ້າງເພີ່ມເຕີມດ້ວຍວິທີດຽວກັນ. ຄວາມກວ້າງຈະປ່ຽນແປງຢ່າງຕໍ່ເນື່ອງລຽບນຽນຈາກຈຸດໜຶ່ງໄປຫາຈຸດຖັດໄປ."
hintstep.variable_outline.3 = "ກົດ Shift ຫຼື Alt ຄ້າງໄວ້ຕອນເລີ່ມລາກ ເພື່ອປ່ຽນສະເພາະດ້ານທີ່ຕົວກະພິບຢູ່ເທົ່ານັ້ນ."
hintstep.variable_outline.4 = "ຄລິກໃສ່ຈຸດເຊື່ອມຕໍ່ເພື່ອພິມຄວາມກວ້າງດ້ານຊ້າຍ ແລະ ຂວາເທິງແຖບຄຸນສົມບັດ; ກົດ Delete ເພື່ອລຶບຈຸດນັ້ນອອກ."
hintstep.crop.1 = "ລາກກອບສີ່ແຈສາກທັບສ່ວນທີ່ທ່ານຕ້ອງການຮັກສາໄວ້. ຮູບແຕ້ມສ່ວນທີ່ຢູ່ນອກກອບຈະມືດລົງ."
hintstep.crop.2 = "ລາກພາຍໃນພື້ນທີ່ເພື່ອຍ້າຍຕຳແໜ່ງ, ຫຼື ລາກຈຸດຈັບອັນໃດອັນໜຶ່ງເພື່ອປັບຂະໜາດ."
hintstep.crop.3 = "ຄລິກສອງບາດພາຍໃນພື້ນທີ່ ຫຼື ກົດ Enter ເພື່ອຕັດຄອບ. ກົດ Esc ເພື່ອຍົກເລີກ."
hintstep.knife.1 = "ເລືອກ 'ເສັ້ນສອງຈຸດ' ຫຼື 'ແຕ້ມອິດສະຫຼະ' ເທິງແຖບຄຸນສົມບັດ, ແລ້ວລາກຜ່ານວັດຖຸເພື່ອຕັດແບ່ງ."
hintstep.knife.2 = "ສ່ວນທີ່ຖືກຕັດຈະກາຍເປັນວັດຖຸແຍກຕ່າງຫາກ ເຊິ່ງທ່ານສາມາດຍ້າຍອອກຈາກກັນໄດ້ດ້ວຍເຄື່ອງມື Pick."
hintstep.knife.3 = "ຄຳສັ່ງ Split ຈະປະເສັ້ນບາງໆ ໄວ້ລະຫວ່າງຊິ້ນສ່ວນ; Gap ຈະລຶບແຖບເສັ້ນອອກຕາມຄວາມກວ້າງທີ່ທ່ານກຳນົດ."
hintstep.segment_delete.1 = "ຄລິກໃສ່ສ່ວນຂອງເສັ້ນຂອບລະຫວ່າງຈຸດຕັດສອງຈຸດເພື່ອລຶບມັນອອກ."
hintstep.segment_delete.2 = "ລາກກອບສີ່ແຈສາກຜ່ານເສັ້ນຂອບເພື່ອລຶບທຸກສ່ວນທີ່ກອບສຳຜັດຖືກ."
hintstep.eraser.1 = "ລາກຜ່ານວັດຖຸເພື່ອລຶບສ່ວນທີ່ທ່ານລາກຜ່ານ. ການຄລິກບາດດຽວຈະລຶບໜຶ່ງຈຸດ."
hintstep.eraser.2 = "ກຳນົດຄວາມໜາ ແລະ ເລືອກຫົວຢາງລຶບແບບມົນ ຫຼື ແບບສີ່ແຈເທິງແຖບຄຸນສົມບັດ."
hintstep.eraser.3 = "ຄລິກສອງບາດໃສ່ວັດຖຸດ້ວຍເຄື່ອງມືນີ້ເພື່ອລຶບວັດຖຸນັ້ນອອກທັງໝົດ."
hintstep.zoom.1 = "ຄລິກເພື່ອຊູມເຂົ້າທີ່ຈຸດນັ້ນ."
hintstep.zoom.2 = "ລາກກອບສີ່ແຈສາກເພື່ອຊູມຂະຫຍາຍໃຫ້ພື້ນທີ່ນັ້ນເຕັມໜ້າຕ່າງ."
hintstep.zoom.3 = "ຄລິກຂວາ ຫຼື Shift+ຄລິກ ເພື່ອຊູມອອກ. ຄລິກສອງບາດໃສ່ປຸ່ມເຄື່ອງມືເພື່ອເບິ່ງວັດຖຸທັງໝົດ."
hintstep.pan.1 = "ລາກເພື່ອຍ້າຍມຸມມອງໄປໃນທິດທາງໃດກໍໄດ້. ຮູບແຕ້ມຈະບໍ່ມີການປ່ຽນແປງ."
hintstep.pan.2 = "ໃນຂະນະທີ່ໃຊ້ເຄື່ອງມືໃດກໍຕາມ, ສາມາດກົດປຸ່ມເມົາສ໌ກາງຄ້າງໄວ້ແລ້ວລາກເພື່ອຍ້າຍມຸມມອງໄດ້."
hintstep.freehand.1 = "ລາກໃສ່ໜ້າເຈ້ຍເພື່ອແຕ້ມເສັ້ນຕາມການເຄື່ອນທີ່ຂອງຕົວກະພິບ, ແລ້ວປ່ອຍມືເພື່ອສິ້ນສຸດ."
hintstep.freehand.2 = "ຄລິກບ່ອນທີ່ເສັ້ນຊື່ເລີ່ມຕົ້ນ ແລະ ຄລິກອີກຄັ້ງບ່ອນທີ່ເສັ້ນສິ້ນສຸດ. ກົດ Ctrl ຄ້າງໄວ້ເພື່ອປັບມຸມເທື່ອລະ 15 ອົງສາ."
hintstep.freehand.3 = "ເລີ່ມຕົ້ນທີ່ຈຸດປາຍຂອງເສັ້ນໂຄ້ງທີ່ເລືອກເພື່ອແຕ້ມຕໍ່; ສິ້ນສຸດທີ່ຈຸດປາຍອີກເບື້ອງໜຶ່ງເພື່ອປິດຮູບຮ່າງ."
hintstep.freehand.4 = "ຄ່າປັບລຽບ (Smoothing) ເທິງແຖບຄຸນສົມບັດກຳນົດລະດັບຄວາມລຽບນຽນຂອງເສັ້ນເມື່ອທ່ານປ່ອຍມື."
hintstep.two_point_line.1 = "ກົດເມົາສ໌ຄ້າງບ່ອນທີ່ເສັ້ນເລີ່ມຕົ້ນ ແລະ ປ່ອຍມືບ່ອນທີ່ເສັ້ນສິ້ນສຸດ."
hintstep.two_point_line.2 = "ກົດ Ctrl ຄ້າງໄວ້ເພື່ອຈຳກັດມຸມເສັ້ນເທື່ອລະ 15 ອົງສາ."
hintstep.bezier.1 = "ຄລິກເພື່ອວາງຈຸດມຸມຫັກ, ແລະ ຄລິກອີກຄັ້ງເພື່ອແຕ້ມສ່ວນເສັ້ນຊື່ມາຍັງຈຸດນັ້ນ."
hintstep.bezier.2 = "ລາກເພື່ອວາງຈຸດໂຄ້ງລຽບ ແລະ ດຶງແຂນປັບອອກມາ ເຊິ່ງຈະເປັນຕົວກຳນົດທິດທາງ ແລະ ຄວາມໂຄ້ງຂອງເສັ້ນ."
hintstep.bezier.3 = "ຄລິກໃສ່ຈຸດທຳອິດເພື່ອປິດຮູບຮ່າງເສັ້ນໂຄ້ງ, ຫຼື ຄລິກສອງບາດ/ກົດ Enter ເພື່ອສິ້ນສຸດ. ກົດ Esc ເພື່ອຍົກເລີກເສັ້ນໂຄ້ງຖິ້ມ."
hintstep.pen.1 = "ຄລິກເພື່ອເພີ່ມຈຸດມຸມຫັກທີ່ເຊື່ອມຕໍ່ກັນດ້ວຍສ່ວນເສັ້ນຊື່."
hintstep.pen.2 = "ລາກເພື່ອເພີ່ມຈຸດໂຄ້ງລຽບ: ເສັ້ນໂຄ້ງຈະເກີດຮູບຮ່າງຂຶ້ນໃນຂະນະທີ່ລາກ, ແລະ ສ່ວນເສັ້ນຖັດໄປຈະຕິດຕາມຕົວກະພິບ."
hintstep.pen.3 = "ຄລິກໃສ່ຈຸດທຳອິດເພື່ອປິດເສັ້ນໂຄ້ງ, ຫຼື ຄລິກສອງບາດ/ກົດ Enter ເພື່ອສິ້ນສຸດ."
hintstep.bspline.1 = "ຄລິກເພື່ອວາງຈຸດຄວບຄຸມ. ເສັ້ນໂຄ້ງຈະແລ່ນຜ່ານຢ່າງລຽບນຽນ ແລະ ຢູ່ພາຍໃນຂອບເຂດຂອງຈຸດເຫຼົ່ານັ້ນສະເໝີ."
hintstep.bspline.2 = "ຄລິກສອງບາດ ຫຼື ກົດ Enter ເພື່ອສິ້ນສຸດ, ຫຼື ຄລິກໃສ່ຈຸດທຳອິດເພື່ອປິດເສັ້ນໂຄ້ງໃຫ້ເປັນຮອບວຽນປິດ."
hintstep.polyline.1 = "ຄລິກເພື່ອເພີ່ມແຕ່ລະມຸມ: ສ່ວນເສັ້ນຊື່ຈະເຊື່ອມຕໍ່ກັນໄປເລື້ອຍໆ."
hintstep.polyline.2 = "ຄລິກສອງບາດ ຫຼື ກົດ Enter ເພື່ອສິ້ນສຸດ, ຫຼື ຄລິກໃສ່ຈຸດທຳອິດເພື່ອປິດຮູບຮ່າງ. Ctrl ຈະຊ່ວຍຈຳກັດແຕ່ລະສ່ວນເສັ້ນໃຫ້ຢູ່ໃນມຸມເທື່ອລະ 15 ອົງສາ."
hintstep.three_point_curve.1 = "ລາກຈາກຈຸດເລີ່ມຕົ້ນຂອງເສັ້ນໂຄ້ງໄປຫາຈຸດສິ້ນສຸດ."
hintstep.three_point_curve.2 = "ເລື່ອນຕົວກະພິບເພື່ອດັດເສັ້ນໃຫ້ໂຄ້ງ ແລ້ວຄລິກໃສ່ຈຸດທີ່ຕ້ອງການໃຫ້ເສັ້ນແລ່ນຜ່ານ."
hintstep.brush_strokes.1 = "ເລືອກໂໝດ ແລະ ຄວາມກວ້າງເທິງແຖບຄຸນສົມບັດ: ຄ່າທີ່ກຳນົດໄວ້, ແປງແຕ້ມ, ຫົວພົ່ນ, ຕົວຂຽນຫວາດ ຫຼື ແຮງກົດ."
hintstep.brush_strokes.2 = "ລາກໃສ່ໜ້າເຈ້ຍ: ເສັ້ນຈະກາຍເປັນຮອຍແປງທີ່ມີສີພື້ນ ເຊິ່ງມີຄວາມກວ້າງປ່ຽນແປງໄປຕາມລວງຍາວ."
hintstep.brush_strokes.3 = "ຫາກຕ້ອງການປ່ຽນເສັ້ນໂຄ້ງທີ່ມີຢູ່ແລ້ວໃຫ້ເປັນຮອຍແປງ, ໃຫ້ເລືອກເສັ້ນເຫຼົ່ານັ້ນແລ້ວຄລິກ 'ນຳໃຊ້ກັບເສັ້ນໂຄ້ງ' ໃນແຜງ Brush Strokes."
hintstep.painterly_brush.1 = "ເລືອກຫົວແປງ, ຂະໜາດ ແລະ ຄວາມໂປ່ງໃສເທິງແຖບຄຸນສົມບັດ, ແລ້ວລາກໃສ່ໜ້າເຈ້ຍ."
hintstep.painterly_brush.2 = "ຫາກຕ້ອງການແຕ້ມສີໃສ່ເສັ້ນຂອບຂອງວັດຖຸທີ່ມີຢູ່, ໃຫ້ຄລິກໃສ່ວັດຖຸນັ້ນແລ້ວເລືອກຫົວແປງ."
hintstep.painterly_brush.3 = "ຄຳສັ່ງ Clear Brushstroke ຈະປ່ຽນວັດຖຸທີ່ເລືອກໃຫ້ກັບຄືນມາເປັນເສັ້ນຂອບທຳມະດາ."
hintstep.shape_recognition.1 = "ແຕ້ມຮູບສີ່ແຈສາກ, ວົງຮີ ຫຼື ສາມແຈແບບຄ່າວໆ ໃນບາດດຽວ: ມັນຈະປ່ຽນເປັນຮູບຮ່າງທີ່ສະອາດງາມຕາໂດຍອັດຕະໂນມັດ."
hintstep.shape_recognition.2 = "ຮອຍແຕ້ມທີ່ເກືອບຊື່ຈະກາຍເປັນເສັ້ນຊື່; ສ່ວນຮອຍແຕ້ມອື່ນໆ ຈະກາຍເປັນເສັ້ນໂຄ້ງທີ່ລຽບນຽນ."
hintstep.shape_recognition.3 = "ຄ່າ Shape recognition ແລະ Smoothing ເທິງແຖບຄຸນສົມບັດກຳນົດຄວາມງ່າຍໃນການປ່ຽນຮອຍແຕ້ມໃຫ້ເປັນຮູບຮ່າງ ແລະ ລະດັບຄວາມລຽບນຽນ."
hintstep.sketch.1 = "ແຕ້ມຮອຍເສັ້ນ: ເສັ້ນຈະຖືກປັບໃຫ້ລຽບນຽນ ແລະ ຖືກເລືອກໄວ້."
hintstep.sketch.2 = "ເລີ່ມແຕ້ມເສັ້ນຖັດໄປໃກ້ໆ ກັບຈຸດສິ້ນສຸດຂອງເສັ້ນກ່ອນໜ້າ. ຫາກເປີດ 'ເຊື່ອມຕໍ່' (Join) ໄວ້, ມັນຈະຖືກລວມເຂົ້າເປັນເສັ້ນໂຄ້ງດຽວກັນ."
hintstep.rectangle.1 = "ລາກຕາມແນວສະແຍງຈາກມຸມໜຶ່ງໄປຫາມຸມກົງກັນຂ້າມ."
hintstep.rectangle.2 = "ກົດ Ctrl ຄ້າງໄວ້ເພື່ອແຕ້ມຮູບຈະຕຸລັດ, ຫຼື ກົດ Shift ເພື່ອແຕ້ມອອກຈາກຈຸດໃຈກາງ."
hintstep.rectangle.3 = "ຕັ້ງຄ່າມຸມມົນ, ມຸມເວົ້າ ຫຼື ມຸມຕັດເທິງແຖບຄຸນສົມບັດ, ຫຼື ລາກຈຸດເຊື່ອມຕໍ່ທີ່ມຸມດ້ວຍເຄື່ອງມື Shape."
hintstep.rectangle.4 = "ຄລິກສອງບາດໃສ່ປຸ່ມເຄື່ອງມືເພື່ອແຕ້ມຮູບສີ່ແຈສາກຂະໜາດເທົ່າກັບໜ້າເຈ້ຍ."
hintstep.three_point_rectangle.1 = "ລາກເພື່ອແຕ້ມເສັ້ນພື້ນຖານ ໃນມຸມໃດກໍໄດ້."
hintstep.three_point_rectangle.2 = "ເລື່ອນຕົວກະພິບເພື່ອກຳນົດຄວາມສູງ ແລ້ວຄລິກ."
hintstep.ellipse.1 = "ລາກຕາມແນວສະແຍງເພື່ອແຕ້ມຮູບວົງຮີ."
hintstep.ellipse.2 = "ກົດ Ctrl ຄ້າງໄວ້ເພື່ອແຕ້ມຮູບວົງມົນ, ຫຼື ກົດ Shift ເພື່ອແຕ້ມອອກຈາກຈຸດໃຈກາງ."
hintstep.ellipse.3 = "ເລືອກ 'ຮູບພາຍ' ຫຼື 'ເສັ້ນໂຄ້ງ' ເທິງແຖບຄຸນສົມບັດ, ຫຼື ລາກຈຸດເຊື່ອມຕໍ່ຂອງວົງຮີດ້ວຍເຄື່ອງມື Shape."
hintstep.three_point_ellipse.1 = "ລາກເພື່ອແຕ້ມເສັ້ນຜ່າສູນກາງຂອງວົງຮີ ໃນມຸມໃດກໍໄດ້."
hintstep.three_point_ellipse.2 = "ເລື່ອນຕົວກະພິບເພື່ອກຳນົດຄວາມສູງ ແລ້ວຄລິກ."
hintstep.polygon.1 = "ກຳນົດຈຳນວນມຸມ/ຈຸດເທິງແຖບຄຸນສົມບັດ ແລ້ວລາກຕາມແນວສະແຍງ."
hintstep.polygon.2 = "ກົດ Ctrl ຄ້າງໄວ້ສຳລັບຮູບຫຼາຍແຈສົມມາດ, ຫຼື ກົດ Shift ເພື່ອແຕ້ມອອກຈາກຈຸດໃຈກາງ."
hintstep.polygon.3 = "ລາກຈຸດເຊື່ອມຕໍ່ດ້ວຍເຄື່ອງມື Shape: ຈຸດທີ່ກົງກັນຂອງທຸກໆ ດ້ານຈະປ່ຽນແປງຕາມ, ເຮັດໃຫ້ຮູບຫຼາຍແຈຍັງຄົງສົມມາດຢູ່ສະເໝີ."
hintstep.star.1 = "ກຳນົດຈຳນວນແສງດາວ ແລະ ຄວາມຄົມແຫຼມເທິງແຖບຄຸນສົມບັດ ແລ້ວລາກ."
hintstep.star.2 = "ເລືອກ 'ດາວຊັບຊ້ອນ' (Complex star) ສຳລັບຮູບດາວທີ່ມີເສັ້ນດ້ານຕັດກັນ."
hintstep.star.3 = "ກົດ Ctrl ຄ້າງໄວ້ສຳລັບຮູບດາວທີ່ສົມມາດ, ຫຼື ກົດ Shift ເພື່ອແຕ້ມອອກຈາກຈຸດໃຈກາງ."
hintstep.spiral.1 = "ກຳນົດຈຳນວນຮອບວຽນເທິງແຖບຄຸນສົມບັດ ແລ້ວລາກ."
hintstep.spiral.2 = "ເລືອກ 'ສົມມາດ' ສຳລັບຮອບວຽນທີ່ມີໄລຍະຫ່າງເທົ່າກັນ, ຫຼື 'ລໍກາຣິດ' ສຳລັບຮອບວຽນທີ່ຂະຫຍາຍໄລຍະຫ່າງກວ້າງອອກເລື້ອຍໆ."
hintstep.spiral.3 = "ກົດ Ctrl ຄ້າງໄວ້ສຳລັບຮູບກ້ຽວວຽນມົນກົມ, ຫຼື ກົດ Shift ເພື່ອແຕ້ມອອກຈາກຈຸດໃຈກາງ."
hintstep.common_shapes.1 = "ຄລິກປຸ່ມຮູບຮ່າງເທິງແຖບຄຸນສົມບັດ ແລ້ວເລືອກຮູບຮ່າງ: ຮູບຮ່າງພື້ນຖານ, ລູກສອນ, ສັນຍະລັກຜັງວຽກ, ປ້າຍໂບ ຫຼື ກ່ອງຄຳເວົ້າ."
hintstep.common_shapes.2 = "ລາກເພື່ອແຕ້ມຮູບຮ່າງ. ກົດ Ctrl ຄ້າງໄວ້ເພື່ອຮັກສາສັດສ່ວນ, ຫຼື ກົດ Shift ເພື່ອແຕ້ມອອກຈາກຈຸດໃຈກາງ."
hintstep.action_lines.1 = "ເລືອກແບບຂະໜານ ຫຼື ແບບກະຈາຍ ແລະ ກຳນົດຈຳນວນເສັ້ນເທິງແຖບຄຸນສົມບັດ."
hintstep.action_lines.2 = "ລາກກອບສີ່ແຈ: ເສັ້ນຄວາມໄວຈະແຕ້ມຕື່ມໃສ່ຈົນເຕັມກອບ."
hintstep.graph_paper.1 = "ກຳນົດຈຳນວນແຖວ ແລະ ຖັນເທິງແຖບຄຸນສົມບັດ."
hintstep.graph_paper.2 = "ລາກເພື່ອແຕ້ມຕາຕະລາງ. ກົດ Ctrl ຄ້າງໄວ້ສຳລັບຊ່ອງສີ່ແຈສະເໝີ."
hintstep.graph_paper.3 = "ຕາຕະລາງນີ້ແມ່ນກຸ່ມຂອງຮູບສີ່ແຈສາກ: ສາມາດແຍກກຸ່ມ (ungroup) ເພື່ອໃສ່ສີ ຫຼື ຍ້າຍແຕ່ລະຊ່ອງໄດ້."
hintstep.text.1 = "ຄລິກບ່ອນທີ່ຕ້ອງການໃຫ້ຂໍ້ຄວາມເລີ່ມຕົ້ນ ແລ້ວພິມ: ຂໍ້ຄວາມສິລະປະ. ກົດ Enter ເພື່ອຂຶ້ນແຖວໃໝ່."
hintstep.text.2 = "ລາກກອບສີ່ແຈ ແລ້ວພິມ: ຂໍ້ຄວາມຫຍໍ້ໜ້າຈະຕັດຂຶ້ນແຖວໃໝ່ໂດຍອັດຕະໂນມັດເມື່ອຮອດຂອບຂອງກອບ."
hintstep.text.3 = "ກົດ Esc ເພື່ອສິ້ນສຸດ. ຄລິກໃສ່ຂໍ້ຄວາມດ້ວຍເຄື່ອງມືນີ້ເພື່ອແກ້ໄຂ, ແລະ ເລືອກຟອນຕ໌, ຂະໜາດ ແລະ ຮູບແບບເທິງແຖບຄຸນສົມບັດ."
hintstep.table.1 = "ກຳນົດຈຳນວນແຖວ ແລະ ຖັນເທິງແຖບຄຸນສົມບັດ ແລ້ວລາກຮູບສີ່ແຈສາກ."
hintstep.table.2 = "ຄລິກໃສ່ຊ່ອງຕາຕະລາງແລ້ວພິມ. ກົດ Tab ເພື່ອໄປຍັງຊ່ອງຖັດໄປ."
hintstep.table.3 = "ເມນູ Table ໃຊ້ສຳລັບແຊກ, ລຶບ, ລວມ ແລະ ແຍກແຖວ ແລະ ຖັນ."
hintstep.parallel_dimension.1 = "ລາກຈາກຈຸດທຳອິດໄປຫາຈຸດທີສອງ, ຫຼື ຄລິກໃສ່ທັງສອງຈຸດ."
hintstep.parallel_dimension.2 = "ເລື່ອນຕົວກະພິບ ແລ້ວຄລິກບ່ອນທີ່ຕ້ອງການວາງເສັ້ນບອກຂະໜາດ."
hintstep.parallel_dimension.3 = "ດູດຈັບໃສ່ຈຸດເຊື່ອມຕໍ່ເພື່ອການວັດແທກທີ່ຊັດເຈນ. ຕັ້ງຄ່າຄວາມລະອຽດ ແລະ ຫົວໜ່ວຍເທິງແຖບຄຸນສົມບັດ."
hintstep.hv_dimension.1 = "ລາກຈາກຈຸດທຳອິດໄປຫາຈຸດທີສອງ, ຫຼື ຄລິກໃສ່ທັງສອງຈຸດ."
hintstep.hv_dimension.2 = "ເລື່ອນຕົວກະພິບ ແລ້ວຄລິກບ່ອນທີ່ຕ້ອງການວາງເສັ້ນ. ມັນຈະວັດແທກສະເພາະໄລຍະຫ່າງລວງນອນ ຫຼື ລວງຕັ້ງເທົ່ານັ້ນ."
hintstep.angular_dimension.1 = "ຄລິກໃສ່ຈຸດຍອດຂອງມຸມ."
hintstep.angular_dimension.2 = "ຄລິກຈຸດໜຶ່ງເທິງແຂນມຸມທຳອິດ, ແລ້ວຄລິກອີກຈຸດໜຶ່ງເທິງແຂນມຸມທີສອງ."
hintstep.angular_dimension.3 = "ຄລິກບ່ອນທີ່ຕ້ອງການວາງເສັ້ນໂຄ້ງ ແລະ ຕົວເລກບອກຂະໜາດ."
hintstep.segment_dimension.1 = "ຄລິກໃສ່ສ່ວນເສັ້ນຂອງວັດຖຸເພື່ອກຳນົດເອົາສອງສົ້ນຂອງມັນ."
hintstep.segment_dimension.2 = "ຄລິກບ່ອນທີ່ຕ້ອງການວາງເສັ້ນບອກຂະໜາດ."
hintstep.callout.1 = "ລາກຈາກປາຍແຫຼມ (ຈຸດທີ່ຕ້ອງການຊີ້ໃສ່) ໄປຫາຈຸດພັບງໍ."
hintstep.callout.2 = "ຄລິກບ່ອນທີ່ຕ້ອງການວາງຂໍ້ຄວາມ, ແລ້ວພິມຂໍ້ຄວາມ."
hintstep.callout.3 = "ເລືອກຮູບແບບຫົວລູກສອນ ແລະ ຮູບຮ່າງອ້ອມຮອບຂໍ້ຄວາມເທິງແຖບຄຸນສົມບັດ."
hintstep.connector.1 = "ລາກຈາກວັດຖຸໜຶ່ງໄປຫາອີກວັດຖຸໜຶ່ງ: ເສັ້ນຈະແລ່ນລະຫວ່າງຈຸດຍຶດຂອງພວກມັນ."
hintstep.connector.2 = "ຍ້າຍ ຫຼື ປັບຂະໜາດວັດຖຸໃດໜຶ່ງ: ເສັ້ນເຊື່ອມຕໍ່ຈະຍັງຄົງຕິດຢູ່ສະເໝີ."
hintstep.right_angle_connector.1 = "ລາກຈາກວັດຖຸໜຶ່ງໄປຫາອີກວັດຖຸໜຶ່ງ: ເສັ້ນເຊື່ອມຕໍ່ຈະແລ່ນເປັນສ່ວນເສັ້ນລວງນອນ ແລະ ລວງຕັ້ງແບບມຸມສາກ."
hintstep.right_angle_connector.2 = "ຍ້າຍວັດຖຸໃດໜຶ່ງ: ເສັ້ນເຊື່ອມຕໍ່ຈະຍັງຄົງຕິດຢູ່ ແລະ ປັບປ່ຽນເສັ້ນທາງໃໝ່ໂດຍອັດຕະໂນມັດ."
hintstep.rounded_connector.1 = "ລາກຈາກວັດຖຸໜຶ່ງໄປຫາອີກວັດຖຸໜຶ່ງ: ເສັ້ນເຊື່ອມຕໍ່ຈະແລ່ນເປັນສ່ວນເສັ້ນລວງນອນ ແລະ ລວງຕັ້ງ ພ້ອມມຸມມົນ."
hintstep.rounded_connector.2 = "ກຳນົດລັດສະໝີມຸມມົນເທິງແຖບຄຸນສົມບັດ. ຍ້າຍວັດຖຸໃດໜຶ່ງແລ້ວເສັ້ນເຊື່ອມຕໍ່ຈະຍ້າຍຕາມ."
hintstep.anchor_editing.1 = "ຄລິກໃສ່ວັດຖຸເພື່ອສະແດງຈຸດຍຶດເປັນຮູບດອກຈັນສີ່ແຈ."
hintstep.anchor_editing.2 = "ຄລິກພາຍໃນວັດຖຸເພື່ອເພີ່ມຈຸດຍຶດ, ແລະ ລາກຈຸດຍຶດທີ່ທ່ານເພີ່ມເພື່ອຍ້າຍຕຳແໜ່ງ."
hintstep.anchor_editing.3 = "ເລືອກຈຸດຍຶດແລ້ວກົດ Delete, ຫຼື ຄລິກສອງບາດໃສ່ມັນ ເພື່ອລຶບອອກ. ຈຸດຍຶດສີ່ຈຸດຢູ່ເຄິ່ງກາງຂອງແຕ່ລະດ້ານຈະຄົງຢູ່ສະເໝີ."
hintstep.drop_shadow.1 = "ລາກຈາກເຄິ່ງກາງຂອງວັດຖຸໄປຫາບ່ອນທີ່ຕ້ອງການໃຫ້ເງົາຕົກກະທົບ."
hintstep.drop_shadow.2 = "ລາກຈາກຂອບຂອງວັດຖຸສຳລັບເງົາແບບມີມິຕິທັດສະນີຍະພາບທີ່ຕັ້ງຢູ່ເທິງຂອບນັ້ນ."
hintstep.drop_shadow.3 = "ລາກແຖບເລື່ອນລະຫວ່າງຈຸດຈັບເພື່ອປ່ຽນຄວາມໂປ່ງແສງ, ແລະ ລາກຈຸດຈັບປາຍສຸດເພື່ອຍ້າຍຕຳແໜ່ງເງົາ."
hintstep.drop_shadow.4 = "ກຳນົດຄວາມມົວຟຸ້ງ (feathering) ແລະ ສີເທິງແຖບຄຸນສົມບັດ."
hintstep.contour.1 = "ລາກຈາກວັດຖຸອອກໄປທາງນອກສຳລັບເສັ້ນຂອບຊ້ອນດ້ານນອກ."
hintstep.contour.2 = "ລາກເຂົ້າຫາເຄິ່ງກາງສຳລັບເສັ້ນຂອບຊ້ອນດ້ານໃນ."
hintstep.contour.3 = "ກຳນົດຈຳນວນຂັ້ນ, ໄລຍະຫ່າງ ແລະ ສີຂອງຂັ້ນສຸດທ້າຍເທິງແຖບຄຸນສົມບັດ."
hintstep.blend.1 = "ລາກຈາກວັດຖຸໜຶ່ງໄປຫາອີກວັດຖຸໜຶ່ງ: ຂັ້ນຕອນກາງຈະປະກົດຂຶ້ນລະຫວ່າງສອງວັດຖຸ."
hintstep.blend.2 = "ກຳນົດຈຳນວນຂັ້ນເທິງແຖບຄຸນສົມບັດ. ຍ້າຍ, ປັບຂະໜາດ ຫຼື ປ່ຽນສີວັດຖຸໃດໜຶ່ງ ແລ້ວຂັ້ນຕອນກາງຈະປ່ຽນຕາມ."
hintstep.distort.1 = "ຍູ້ ແລະ ດຶງ: ລາກໄປທາງຂວາເທິງວັດຖຸສຳລັບຮອຍແຫຼມ, ຫຼື ລາກໄປທາງຊ້າຍສຳລັບກີບດອກມົນ."
hintstep.distort.2 = "ຊິບ: ລາກອອກຈາກຈຸດເລີ່ມຕົ້ນສຳລັບແຂ້ວແບບຊິກແຊກ. ແຮງລາກໄກເທົ່າໃດ, ແຂ້ວກໍຈະຍິ່ງສູງຂຶ້ນເທົ່ານັ້ນ."
hintstep.distort.3 = "ບິດກ້ຽວ: ລາກອ້ອມຮອບຈຸດເລີ່ມຕົ້ນເພື່ອໝູນບິດວັດຖຸ."
hintstep.distort.4 = "ລາກຮູບດອກຈັນສີ່ແຈເພື່ອຍ້າຍຈຸດໃຈກາງຂອງການບິດບ້ຽວ. ການລາກໃໝ່ອີກຄັ້ງຈະປ່ຽນແທນຄ່າເດີມ."
hintstep.envelope.1 = "ຄລິກໃສ່ວັດຖຸ: ກອບທີ່ມີແປດຈຸດເຊື່ອມຕໍ່ຈະປະກົດຂຶ້ນອ້ອມຮອບມັນ."
hintstep.envelope.2 = "ລາກຈຸດເຊື່ອມຕໍ່ເພື່ອປັບຮູບຮ່າງຂອງກອບ. ວັດຖຸຈະດັດໂຄ້ງຕາມຮູບຮ່າງກອບນັ້ນ."
hintstep.envelope.3 = "ເລືອກເສັ້ນຊື່, ເສັ້ນໂຄ້ງດ່ຽວ, ເສັ້ນໂຄ້ງຄູ່ ຫຼື ແບບອິດສະຫຼະເທິງແຖບຄຸນສົມບັດເພື່ອກຳນົດຮູບແບບການໂຄ້ງຂອງດ້ານ."
hintstep.extrude.1 = "ລາກອອກຈາກວັດຖຸ: ດ້ານຂ້າງຈະແລ່ນຈາກເສັ້ນຂອບໄປຫາຈຸດສິ້ນສຸດຂອງການລາກ, ເຊິ່ງຄືຈຸດລວມສາຍຕາ."
hintstep.extrude.2 = "ລາກຈຸດຈັບທີ່ມີຮູບກາກະບາດເພື່ອຍ້າຍຈຸດລວມສາຍຕາ."
hintstep.extrude.3 = "ກຳນົດຄວາມເລິກ, ແສງສະຫວ່າງ ແລະ ສີເທິງແຖບຄຸນສົມບັດ."
hintstep.block_shadow.1 = "ລາກອອກຈາກວັດຖຸໄປໃນທິດທາງທີ່ຕ້ອງການໃຫ້ເງົາທອດໄປ."
hintstep.block_shadow.2 = "ກຳນົດຄວາມເລິກ, ທິດທາງ, ສີ ແລະ ຊ່ອງຫວ່າງເທິງແຖບຄຸນສົມບັດ."
hintstep.transparency.1 = "ຄລິກໃສ່ວັດຖຸ ແລະ ເລືອກ 'ສະໝ່ຳສະເໝີ' ເທິງແຖບຄຸນສົມບັດ ເພື່ອໃຫ້ມີຄວາມໂປ່ງໃສເທົ່າກັນທັງໝົດ."
hintstep.transparency.2 = "ລາກຜ່ານວັດຖຸສຳລັບຄວາມໂປ່ງໃສແບບໄລ່ລະດັບ: ທຶບແສງບ່ອນທີ່ກົດ, ໂປ່ງໃສບ່ອນທີ່ປ່ອຍມື."
hintstep.transparency.3 = "ລາກແຖບເລື່ອນເພື່ອຍ້າຍຈຸດເຄິ່ງກາງຂອງການໄລ່ສີ, ແລະ ລາກຈຸດເຊື່ອມຕໍ່ເພື່ອປ່ຽນຄວາມຍາວ ແລະ ມຸມ."
hintstep.color_eyedropper.1 = "ຄລິກໃສ່ວັດຖຸເພື່ອດູດເອົາສີຂອງມັນ."
hintstep.color_eyedropper.2 = "ຄລິກໃສ່ວັດຖຸອື່ນເພື່ອຖອກສີນັ້ນໃສ່; Shift+ຄລິກ ເພື່ອໃສ່ສີເສັ້ນຂອບ."
hintstep.color_eyedropper.3 = "ຄລິກປຸ່ມເລືອກເທິງແຖບຄຸນສົມບັດເພື່ອດູດສີໃໝ່. ກົດ Esc ເພື່ອກັບຄືນໄປຫາເຄື່ອງມື Pick."
hintstep.attributes_eyedropper.1 = "ຄລິກໃສ່ວັດຖຸຕົ້ນແບບທີ່ຈະສຳເນົາຄຸນລັກສະນະ."
hintstep.attributes_eyedropper.2 = "ຄລິກໃສ່ແຕ່ລະວັດຖຸທີ່ຕ້ອງການນຳຄຸນລັກສະນະໄປໃຊ້."
hintstep.attributes_eyedropper.3 = "ເລືອກສິ່ງທີ່ຈະສຳເນົາເທິງແຖບຄຸນສົມບັດ: ຄຸນສົມບັດທົ່ວໄປ, ການແປງຮູບຮ່າງ ຫຼື ເອັບເຟັກ. Shift+ຄລິກ ເພື່ອດູດຄຸນລັກສະນະຈາກວັດຖຸອື່ນ."
hintstep.interactive_fill.1 = "ລາກຜ່ານວັດຖຸ: ການຖອກສີແບບໄລ່ລະດັບຈະແລ່ນແຕ່ຈຸດທີ່ກົດໄປຫາຈຸດທີ່ປ່ອຍມື."
hintstep.interactive_fill.2 = "ລາກແຖບເລື່ອນລະຫວ່າງຈຸດສີເພື່ອຍ້າຍຈຸດເຄິ່ງກາງທີ່ສີມາບັນຈົບກັນ."
hintstep.interactive_fill.3 = "ລາກຈຸດສີປາຍທາງເພື່ອປ່ຽນຄວາມຍາວ ແລະ ມຸມຂອງການໄລ່ລະດັບສີ."
hintstep.interactive_fill.4 = "ຄລິກສອງບາດໃສ່ເສັ້ນເພື່ອເພີ່ມຈຸດສີ, ແລະ ລາກສີຈາກຖາດສີມາໃສ່ຈຸດເຊື່ອມຕໍ່ເພື່ອປ່ຽນສີໃໝ່."
hintstep.area_fill.1 = "ຄລິກພາຍໃນພື້ນທີ່ປິດໃດກໍໄດ້, ແມ່ນແຕ່ພື້ນທີ່ທີ່ເກີດຈາກວັດຖຸຫຼາຍອັນຊ້ອນທັບກັນ."
hintstep.area_fill.2 = "ພື້ນທີ່ນັ້ນຈະກາຍເປັນວັດຖຸໃໝ່ທີ່ມີສີພື້ນ; ສ່ວນວັດຖຸອ້ອມຮອບຈະຍັງຄົງຄືເກົ່າ."
hintstep.area_fill.3 = "ເລືອກສີພື້ນ ແລະ ເສັ້ນຂອບຂອງວັດຖຸໃໝ່ເທິງແຖບຄຸນສົມບັດ."
hintstep.mesh_fill.1 = "ກຳນົດແຖວ ແລະ ຖັນເທິງແຖບຄຸນສົມບັດ ແລ້ວຄລິກໃສ່ວັດຖຸເພື່ອເພີ່ມຕາໜ່າງ."
hintstep.mesh_fill.2 = "ຄລິກໃສ່ຈຸດເຊື່ອມຕໍ່, ແລ້ວຄລິກໃສ່ສີໃນຖາດສີເພື່ອໃສ່ສີໃຫ້ຈຸດນັ້ນ."
hintstep.mesh_fill.3 = "ລາກຈຸດເຊື່ອມຕໍ່ເພື່ອດັດທິດທາງການໄຫຼຂອງສີ."
hintstep.mesh_fill.4 = "ຄລິກສອງບາດພາຍໃນຕາໜ່າງເພື່ອເພີ່ມແຖວ ແລະ ຖັນ; ກົດ Delete ເພື່ອລຶບແຖວ ແລະ ຖັນຂອງຈຸດທີ່ເລືອກອອກ."
hintstep.outline_pen.1 = "ເລືອກວັດຖຸ ແລະ ເລືອກເຄື່ອງມືນີ້: ກ່ອງຂໍ້ຄວາມ Outline Pen ຈະເປີດຂຶ້ນ."
hintstep.outline_pen.2 = "ກຳນົດຄວາມກວ້າງ, ຮູບແບບ, ມຸມແຈ, ຫົວປາຍເສັ້ນ ແລະ ຫົວລູກສອນ, ແລ້ວຄລິກ OK."
hintstep.outline_pen.3 = "ຫາກບໍ່ໄດ້ເລືອກວັດຖຸໃດໄວ້, ການຕັ້ງຄ່ານີ້ຈະມີຜົນກັບວັດຖຸທີ່ທ່ານຈະແຕ້ມຕໍ່ໄປ."
hintstep.outline_color.1 = "ເລືອກວັດຖຸ ແລະ ເລືອກເຄື່ອງມືນີ້: ແຜງ Color ຈະເປີດຂຶ້ນ."
hintstep.outline_color.2 = "ເລືອກສີເພື່ອກຳນົດສີເສັ້ນຂອບ. ການຄລິກຂວາໃສ່ສີໃນຖາດສີກໍໃຫ້ຜົນຄືກັນ."
