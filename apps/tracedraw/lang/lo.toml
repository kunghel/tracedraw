hinttopic.connector_lines = "ເສັ້ນເຊື່ອມຕໍ່ຈະຜູກວັດຖຸເຂົ້າຫາກັນ ແລະ ຍັງຄົງຕິດຢູ່ສະເໝີເມື່ອວັດຖຸຖືກຍ້າຍ."
hinttopic.dimension_lines = "ເສັ້ນບອກຂະໜາດສະແດງຂະໜາດຂອງວັດຖຸ ລວມທັງໄລຍະຫ່າງ ຫຼື ມຸມລະຫວ່າງຈຸດຕ່າງໆ; ເສັ້ນເຫຼົ່ານີ້ຈະອັບເດດອັດຕະໂນມັດເມື່ອວັດຖຸປ່ຽນແປງ."
hinttopic.effects = "ເພີ່ມຄວາມເລິກ ແລະ ຄວາມເຄື່ອນໄຫວໃຫ້ວັດຖຸດ້ວຍເງົາ, ເສັ້ນຂອບຊ້ອນ, ການປະສົມຮູບຮ່າງ, ການບິດບ້ຽວ, ຊອງຄວບຄຸມ, ການດຶງເປັນ 3 ມິຕິ ແລະ ຄວາມໂປ່ງໃສ."
hinttopic.fill = "ຕື່ມສີວັດຖຸດ້ວຍສີລ້ວນ, ສີໄລ່ລະດັບ, ລວດລາຍ, ພື້ນຜິວ ແລະ ຕາໜ່າງສີ. **ກົດ** ທີ່ຈານສີເພື່ອຕື່ມສີໃສ່ວັດຖຸທີ່ເລືອກ."
hinttopic.help = "ກົດ **F1** ເພື່ອເບິ່ງວິທີໃຊ້, ເປີດໜ້າຕ່າງ **ຄໍາແນະນໍາ** ນີ້ໄວ້ຂະນະເຮັດວຽກ, ແລະ ເບິ່ງໜ້າຈໍຍິນດີຕ້ອນຮັບເພື່ອເລີ່ມຕົ້ນການໃຊ້ງານ."
hinttopic.lines = "ເມນູຍ່ອຍຂອງເຄື່ອງມື **ເສັ້ນໂຄ້ງ** ບັນຈຸເຄື່ອງມືສໍາລັບການແຕ້ມເສັ້ນ, ທັງແບບອິດສະຫຼະ, ແບບຊັດເຈນ, ເສັ້ນຊື່ ຫຼື ເສັ້ນໂຄ້ງ."
hinttopic.move_scale = "ລາກວັດຖຸທີ່ເລືອກເພື່ອຍ້າຍ; ກົດ **Ctrl** ຄ້າງໄວ້ເພື່ອໃຫ້ຍ້າຍໃນແນວນອນ ຫຼື ແນວຕັ້ງຊື່. ລາກ **ປຸ່ມມຸມ** ເພື່ອປັບຂະໜາດຕາມສັດສ່ວນ ແລະ ລາກ **ປຸ່ມດ້ານຂ້າງ** ເພື່ອຢືດຂະໜາດ; ກົດ **Shift** ເພື່ອປັບຂະໜາດຈາກຈຸດໃຈກາງ. ປຸ່ມລູກສອນໃຊ້ສໍາລັບຂຍັບວັດຖຸເທື່ອລະໜ້ອຍ."
hinttopic.outline = "ຕັ້ງຄ່າຄວາມກວ້າງ, ສີ ແລະ ຮູບແບບຂອງເສັ້ນຂອບ. **ກົດຂວາ** ທີ່ຈານສີເພື່ອປ່ຽນສີເສັ້ນຂອບຂອງວັດຖຸທີ່ເລືອກ."
hinttopic.rotate_skew = "ກົດທີ່ວັດຖຸທີ່ເລືອກອີກຄັ້ງເພື່ອສະແດງປຸ່ມໝູນ ແລະ ປຸ່ມອຽງ. ລາກ **ລູກສອນມຸມ** ເພື່ອໝູນ ແລະ ລາກ **ລູກສອນດ້ານຂ້າງ** ເພື່ອອຽງ; ກົດ **Ctrl** ຄ້າງໄວ້ເພື່ອໝູນເທື່ອລະ 15 ອົງສາ. ລາກເຄື່ອງໝາຍຈຸດໃຈກາງເພື່ອປ່ຽນຈຸດໝູນ."
hinttopic.select = "ກົດທີ່ວັດຖຸເພື່ອເລືອກ. ກົດ **Shift**+ກົດ ເພື່ອເພີ່ມ ຫຼື ຍົກເລີກການເລືອກວັດຖຸ; ລາກເທິງພື້ນທີ່ຫວ່າງເພື່ອເລືອກວັດຖຸທີ່ຢູ່ໃນຂອບເຂດ; ກົດ **Alt**+ກົດ ເພື່ອເລືອກວັດຖຸທີ່ຢູ່ກ້ອງ; ກົດ **Ctrl**+ກົດ ເພື່ອເລືອກວັດຖຸທີ່ຢູ່ໃນກຸ່ມ."
hinttopic.shape_objects = "ປ່ຽນຮູບຮ່າງຂອງວັດຖຸດ້ວຍການແກ້ໄຂຈຸດໂນດ, ດັດບິດເສັ້ນຂອບ, ຫຼື ຕັດ ແລະ ລຶບບາງສ່ວນອອກ."
hinttopic.shapes = "ແຕ້ມຮູບສີ່ແຈສາກ, ວົງຮີ, ຮູບຫຼາຍແຈ, ຮູບດາວ, ຮູບກົ້ນຫອຍ, ຕາໜ່າງ ແລະ ຮູບຮ່າງສໍາເລັດຮູບໂດຍການລາກຕາມເສັ້ນສະແຍງ. ກົດ **Ctrl** ຄ້າງໄວ້ເພື່ອຮັກສາສັດສ່ວນ; ກົດ **Shift** ເພື່ອແຕ້ມອອກຈາກຈຸດໃຈກາງ."
hinttopic.text = "ກົດດ້ວຍເຄື່ອງມື **ຂໍ້ຄວາມ** ເພື່ອເພີ່ມຂໍ້ຄວາມສິລະປະ, ຫຼື ລາກເພື່ອເພີ່ມຂໍ້ຄວາມຫຍໍ້ໜ້າໃນກອບ. ກົດພາຍໃນຂໍ້ຄວາມເພື່ອແກ້ໄຂ."
