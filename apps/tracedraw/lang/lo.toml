web.notice_text = "**ບຣາວເຊີຈະເຮັດວຽກຊ້າກວ່າ:** ຮູບແຕ້ມຂະໜາດໃຫຍ່, ເອັບເຟັກທີ່ຊັບຊ້ອນ ແລະ ໄຟລ໌ໃຫຍ່ຈະໃຊ້ເວລາດົນກວ່າ, ຟອນຕ໌ທີ່ຕິດຕັ້ງໃນຄອມພິວເຕີຂອງທ່ານຈະໃຊ້ບໍ່ໄດ້ (ຟອນຕ໌ຟຣີຈະຖືກດາວໂຫຼດຈາກລາຍການຂອງໜ້າເວັບໃນຄັ້ງທຳອິດທີ່ຂໍ້ຄວາມຕ້ອງການ, ແລະ ຟອນຕ໌ທີ່ທ່ານເພີ່ມໃນ ຕົວຈັດການຟອນຕ໌ ຈະຖືກເກັບໄວ້ໃນບຣາວເຊີນີ້), ແລະ ການເປີດໄຟລ໌ແມ່ນຜ່ານການອັບໂຫຼດ ສ່ວນການບັນທຶກແມ່ນຜ່ານການດາວໂຫຼດ.\n\nນີ້ແມ່ນໂປຣແກຣມ Rust ຕົວດຽວກັນກັບແອັບ desktop ເຊິ່ງຖືກຄອມໄພລ໌ເປັນ WebAssembly ເພື່ອໃຫ້ທ່ານສາມາດທົດລອງໃຊ້ໄດ້ໂດຍບໍ່ຕ້ອງຕິດຕັ້ງຫຍັງເລີຍ.\n\nສຳລັບວຽກງານຕົວຈິງ ແລະ ໄຟລ໌ຂະໜາດໃຫຍ່, ແນະນຳໃຫ້ໃຊ້ແອັບ desktop ສຳລັບ Windows, macOS ຫຼື Linux ເຊິ່ງຈະເຮັດວຽກໄດ້ເຕັມປະສິດທິພາບ ແລະ ໄວທີ່ສຸດ." # mt
web.notice_download = "ດາວໂຫຼດແອັບ desktop"
web.notice_store = "ດາວໂຫຼດຈາກ Microsoft Store"
web.notice_store_note = "ໃນ Windows, TraceDraw ຍັງມີຢູ່ໃນ Microsoft Store ເຊິ່ງໄດ້ຮັບການຮັບຮອງ ແລະ ອັບເດດສະເໝີໂດຍ Windows. ແຕ່ລະລຸ້ນຕ້ອງຜ່ານການກວດສອບຂອງ Store ກ່ອນ, ດັ່ງນັ້ນລຸ້ນໃນ Store ອາດຈະຊ້າກວ່າລຸ້ນດາວໂຫຼດຫຼ້າສຸດໜຶ່ງ ຫຼື ຫຼາຍລຸ້ນ."
