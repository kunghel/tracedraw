hinttopic.ai = "TraceDraw ບໍ່ມີລະບົບ AI ໃນຕົວ: **AI Drawing**, **AI Generate** (ສ້າງ, ຣີມິກ, ເວັກເຕີ) ແລະ **Remove Background** ຈະໃຊ້ບໍລິການ AI ດຽວກັນທີ່ທ່ານເຊື່ອມຕໍ່ໃນ **Tools > Options > AI > Service** ດ້ວຍລະຫັດຄີຂອງທ່ານເອງ, ແລະ ຈະບໍ່ມີການສົ່ງຂໍ້ມູນໃດໆ ຈົນກວ່າທ່ານຈະກົດສັ່ງ. ຫາກບໍລິການນັ້ນບໍ່ສາມາດເຮັດວຽກຕາມຄຳສັ່ງໄດ້, ປຸ່ມຄຳສັ່ງຈະສະແດງເປັນສີເທົາ."
hintai.cloud = "**ບໍລິການອອນລາຍ**: ເລືອກຄ່າທີ່ກຳນົດໄວ້ (Anthropic, OpenAI, Google Gemini) ແລ້ວວາງ API key ຂອງທ່ານ. ລະຫັດ Gemini ຂໍໄດ້ຈາກ Google AI Studio, ສ່ວນລະຫັດ OpenAI ຂໍໄດ້ຈາກແພລັດຟອມ OpenAI."
hintai.local = "**AI ໃນເຄື່ອງນີ້**: ສຳລັບ AI Drawing ໃຫ້ເລືອກ **Ollama**, **LM Studio**, **llama.cpp** ຫຼື **vLLM** (ຫຼື ພິມທີ່ຢູ່ເຊີເວີໃດກໍໄດ້ທີ່ຮອງຮັບ chat completions API). ບໍ່ຈຳເປັນຕ້ອງໃຊ້ລະຫັດຄີ; ປຸ່ມ **ທົດສອບການເຊື່ອມຕໍ່** ຈະສະແດງລາຍຊື່ໂມເດວທີ່ມີ."
hintai.web = "**ໃນບຣາວເຊີ**, ເຊີເວີພາຍໃນເຄື່ອງຕ້ອງອະນຸຍາດຄຳຮ້ອງຂໍຈາກໜ້າເວັບ (ສຳລັບ Ollama: **OLLAMA_ORIGINS=***). ສ່ວນແອັບ desktop ແມ່ນບໍ່ຈຳເປັນຕ້ອງຕັ້ງຄ່າຫຍັງເພີ່ມ."
hintai.privacy = "**ສິ່ງທີ່ຖືກສົ່ງໄປ**: ສົ່ງສະເພາະສິ່ງທີ່ຈຳເປັນຕໍ່ຄຳສັ່ງນັ້ນໆ ເມື່ອທ່ານກົດສັ່ງເທົ່ານັ້ນ. ລະຫັດຄີຈະຖືກເກັບໄວ້ໃນໜ່ວຍຄວາມຈຳຊົ່ວຄາວ ເວັ້ນເສຍແຕ່ທ່ານຈະເລືອກໃຫ້ຈື່ໄວ້."
