docker.fit_to_path_above_desc = "ວາງວັດຖຸໄວ້ເບື້ອງຊ້າຍຂອງທິດທາງເສັ້ນ (ຢູ່ເທິງເສັ້ນທີ່ແຕ້ມຈາກຊ້າຍຫາຂວາ)."
docker.fit_to_path_below_desc = "ວາງວັດຖຸໄວ້ເບື້ອງຂວາຂອງທິດທາງເສັ້ນ (ຢູ່ກ້ອງເສັ້ນທີ່ແຕ້ມຈາກຊ້າຍຫາຂວາ)."
docker.fit_to_path_side_desc = "ໄລຍະຫ່າງຈາກເສັ້ນທາງ ຫາຂອບທີ່ໃກ້ທີ່ສຸດຂອງວັດຖຸແຕ່ລະອັນ."
docker.fit_to_path_fixed_desc = "ໝູນທຸກວັດຖຸດ້ວຍມຸມດຽວກັນ, ບໍ່ວ່າທິດທາງຂອງເສັ້ນທາງຈະໄປທາງໃດ."
docker.fit_to_path_angle_desc = "ອົງສາປີ້ນເຂັມໂມງ; ເພີ່ມໃສ່ທິດທາງຂອງເສັ້ນທາງເມື່ອວັດຖຸໝູນຕາມເສັ້ນ."
docker.fit_to_path_order_desc = "ລຳດັບຂອງວັດຖຸທີ່ຈັດວາງໄປຕາມເສັ້ນທາງ."
docker.fit_to_path_keep_originals_desc = "ຮັກສາວັດຖຸເດີມທີ່ເລືອກໄວ້ບ່ອນເກົ່າ ແລ້ວວາງສຳເນົາຂອງພວກມັນລົງເທິງເສັ້ນທາງ."
docker.fit_to_path_group_desc = "ຮວມວັດຖຸທີ່ວາງລົງໄປໃຫ້ເປັນກຸ່ມດຽວ."
docker.fit_to_path_contiguous_desc = "ໄລ່ຕາມທຸກເສັ້ນຍ່ອຍຂອງເສັ້ນທາງຕໍ່ກັນໄປ ຄືກັບເປັນເສັ້ນດຽວ; ຫາກປິດ, ຈະໃຊ້ສະເພາະເສັ້ນຍ່ອຍທຳອິດ."
docker.fit_to_path_reference_desc = "ຈຸດໃດຂອງວັດຖຸທີ່ຈະວາງລົງເທິງເສັ້ນທາງ: ຈຸດໃຈກາງການໝູນ, ຫຼື ຈຸດຂອງກອບວັດຖຸ (ເລືອກຜ່ານຈຸດກຳເນີດ)."
docker.fit_to_path_origin_desc = "ຈຸດຂອງກອບວັດຖຸທີ່ຈະວາງລົງເທິງເສັ້ນທາງ."
docker.fit_to_path_ignore_rotation_desc = "ລ້າງຄ່າການໝູນທີ່ວັດຖຸມີຢູ່ກ່ອນໜ້າ ອອກກ່ອນຈະນຳໄປວາງ."
docker.fit_to_path_spin_desc = "ມຸມໝູນທີ່ເພີ່ມໃສ່ວັດຖຸຕໍ່ໆກັນ: ເທົ່າກັນທັງໝົດ, ຄ່ອຍໆເພີ່ມຂຶ້ນຕາມເສັ້ນ, ແບບສຸ່ມ, ຫຼື ທັງສອງຢ່າງ."
