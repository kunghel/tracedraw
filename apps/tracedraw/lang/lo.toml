welcome.learn_1_body = "ເລືອກເຄື່ອງມືຈາກກ່ອງເຄື່ອງມື (ກົດປຸ່ມຄ້າງໄວ້ເພື່ອເປີດເມນູຍ່ອຍ) ແລ້ວລາກໃສ່ໜ້າເຈ້ຍ. ກົດ Ctrl ຄ້າງໄວ້ເພື່ອຈຳກັດສັດສ່ວນ, ກົດ Shift ເພື່ອແຕ້ມຈາກຈຸດໃຈກາງ."
welcome.learn_1_title = "ການແຕ້ມ"
welcome.learn_2_body = "ຄລິກເພື່ອເລືອກ, ຄລິກອີກຄັ້ງເພື່ອສະແດງຈຸດຈັບໝູນ ແລະ ອຽງ, ລາກມຸມເພື່ອປັບຂະໜາດ. ປຸ່ມລູກສອນໃຊ້ຍັບຍ້າຍເລັກນ້ອຍ; Shift+ລູກສອນ ຈະຍັບຍ້າຍໄກຂຶ້ນສິບເທົ່າ."
welcome.learn_2_title = "ການເລືອກ ແລະ ການແປງຮູບຮ່າງ"
welcome.learn_3_body = "ຄລິກຊ້າຍໃສ່ຖາດສີເພື່ອໃສ່ສີພື້ນ, ຄລິກຂວາເພື່ອໃສ່ສີເສັ້ນຂອບ. ແຖບຄຸນສົມບັດໃຊ້ແກ້ໄຂການໄລ່ລະດັບສີ, ລວດລາຍ, ພື້ນຜິວ ແລະ ສີຕາໜ່າງ."
welcome.learn_3_title = "ສີພື້ນ ແລະ ເສັ້ນຂອບ"
welcome.learn_4_body = "ເຄື່ອງມື Shape (F10) ໃຊ້ດັດແກ້ຈຸດເຊື່ອມຕໍ່: ຄລິກສອງບາດໃສ່ສ່ວນເສັ້ນເພື່ອເພີ່ມຈຸດ, ຄລິກສອງບາດໃສ່ຈຸດເພື່ອລຶບອອກ, ໃຊ້ແຖບຄຸນສົມບັດສຳລັບຈຸດຫັກມຸມ, ຈຸດລຽບ ແລະ ຈຸດສົມມາດ."
welcome.learn_4_title = "ຈຸດເຊື່ອມຕໍ່"
welcome.learn_5_body = "ເອັບເຟັກສາມາດແກ້ໄຂໄດ້ຕະຫຼອດເວລາ: ເປີດແຖບເອັບເຟັກຈາກເມນູ Effects, ປ່ຽນຄ່າຕ່າງໆ ແລ້ວວັດຖຸຈະອັບເດດທັນທີ. ຄຳສັ່ງ Flatten Effects ຈະລວມພວກມັນໃຫ້ເປັນຊິ້ນດຽວ."
welcome.learn_5_title = "ເອັບເຟັກ"
