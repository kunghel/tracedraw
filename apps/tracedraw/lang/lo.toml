welcome.news.more = "ຕ້ອງການຮູ້ເພີ່ມເຕີມບໍ່?"
welcome.news.v0_38_body = "ຕອນນີ້ທ່ານສາມາດເປີດຖາດສີໄດ້ຫຼາຍອັນພ້ອມກັນ, ແຕ່ລະອັນຢູ່ໃນແຖບຂອງຕົນເອງ, ຕິດຢູ່ຂອບໃດກໍໄດ້ຂອງໜ້າຕ່າງ ຫຼື ຕັ້ງເປັນແບບລອຍ, ແລະ ລະບົບຈັດການຖາດສີມີການຈັດວາງທີ່ຊັດເຈນຂຶ້ນ. ການປັບປຸງພື້ນທີ່ເຮັດວຽກຍັງສືບຕໍ່: ໄອຄອນຂອງກ່ອງເຄື່ອງມື ແລະ ແຖບເຄື່ອງມືຈະຂະຫຍາຍຕາມຂະໜາດປຸ່ມທີ່ທ່ານເລືອກ ເຊິ່ງມີເຖິງ 5 ຂະໜາດ. ຂໍ້ຄວາມຫຍໍ້ໜ້າຈະໄຫຼຈັດແຖວໃໝ່ໂດຍອັດຕະໂນມັດໃນຂະນະທີ່ທ່ານປັບຂະໜາດກອບ, ຕົວຄວບຄຸມການບິດບ້ຽວເບິ່ງເຫັນໄດ້ງ່າຍຂຶ້ນ, ແລະ ທ່ານສາມາດເລືອກໄລຍະຫ່າງລະຫວ່າງໜ້າໃນມຸມມອງຫຼາຍໜ້າໄດ້. ການໄລ່ລະດັບສີ ແລະ ວັດຖຸໂປ່ງແສງໃນໄຟລ໌ .cdr ຈະເປີດຂຶ້ນມາຕາມຮູບແບບທີ່ສ້າງໄວ້, ແລະ ໄຟລ໌ PDF ກໍຍັງຄົງຮັກສາເຄື່ອງໝາຍຕັດຂອບ, ສີພິເສດ ແລະ ຮູບຮ່າງທີ່ຕັດຄລິບໄວ້."
welcome.news.v0_38_title = "ເປີດຫຼາຍຖາດສີໄດ້ພ້ອມກັນ"
welcome.news.v0_39_body = "ໃນບຣາວເຊີ, ປາກກາກະດານແຕ້ມຈະແຕ້ມເສັ້ນໜາ ຫຼື ບາງຕາມແຮງກົດໜັກ ຫຼື ເບົາຂອງທ່ານ, ແລະ ໃນ Linux ທ່ານສາມາດລາກໄຟລ໌ຈາກຕົວຈັດການໄຟລ໌ມາໃສ່ໜ້າຕ່າງໄດ້ອີກຄັ້ງ. ທ່ານສາມາດສ້າງຖາດສີຂອງຕົນເອງ ແລະ ສະແດງແຕ່ລະອັນໃນແຖບສະເພາະໄດ້. ຮູບດາວສາມາດປີ້ນດ້ານໃນອອກໄດ້, ມຸມມົນຂອງສີ່ແຈສາກສາມາດເຮັດໃຫ້ໃຫຍ່ຂຶ້ນໄດ້ຫຼາຍເມື່ອມີພື້ນທີ່ພຽງພໍ, ແລະ ການແປງເປັນບິດແມັບຂາວດຳ (Grayscale) ຫຼື CMYK ຈະໄດ້ຮູບພາບປະເພດນັ້ນແທ້ໆ. ໄຟລ໌ .cdr ທີ່ມີກອບດັດຮູບຮ່າງ (Envelopes) ແລະ ການໄລ່ສີຈະເບິ່ງຄືກັບຕົ້ນສະບັບຫຼາຍຂຶ້ນ, ແລະ ໃນ Windows ຕົວຕິດຕັ້ງຈະຖາມວ່າຕ້ອງການໃຫ້ TraceDraw ໃຊ້ພາສາໃດ."
welcome.news.v0_39_title = "ຮອງຮັບແຮງກົດປາກກາໃນບຣາວເຊີ ແລະ ຖາດສີສ່ວນຕົວ"
welcome.news.v0_40_body = "TraceCut ເປັນໜ້າຕ່າງໃໝ່ສຳລັບເຄື່ອງຕັດພລັອດເຕີ: ສົ່ງຮູບແຕ້ມຂອງທ່ານໄປຍັງເຄື່ອງຕັດ, ເພີ່ມເສັ້ນຕັດ, ຈັດວາງຮູບຮ່າງລົງໃນແຜ່ນງານ ຫຼື ມ້ວນເຈ້ຍເພື່ອປະຢັດວັດສະດຸ, ແລະ ວັດແທກຂະໜາດພວກມັນ. ເມນູ ແລະ ລາຍການຕ່າງໆ ສາມາດໃຊ້ງານຜ່ານແປ້ນພິມໄດ້ແລ້ວ. ໃນໂທລະສັບ Android ສ່ວນຕິດຕໍ່ຜູ້ໃຊ້ຈະປັບໃຫ້ພໍດີກັບໜ້າຈໍ, ແລະ ມືທີ່ວາງເທິງໜ້າຈໍຈະບໍ່ແຕ້ມເສັ້ນລົບກວນໃນຂະນະທີ່ທ່ານໃຊ້ປາກກາ. ປາກກາກະດານແຕ້ມສາມາດໃຊ້ງານໄດ້ໃນ Linux ຜ່ານ Wayland. ໄຟລ໌ .cdr ສາມາດເປີດພ້ອມຈຸດແທັບ, ໜ້າຫຼັກ (Master pages), ການໄລ່ລະດັບສີ ແລະ ການບິດບ້ຽວ, ແລະ ໄຟລ໌ .cdr ທີ່ທ່ານບັນທຶກພ້ອມຂໍ້ຄວາມສາມາດເປີດໃນໂປຣແກຣມອື່ນໄດ້ອີກຄັ້ງ. ຮູບພາບໃນໄຟລ໌ PDF ຈະເຂົ້າມາດ້ວຍຄວາມລະອຽດເຕັມ, ສາມາດສົ່ງອອກ JPEG ແລະ TIFF ເປັນ CMYK ໄດ້, ສາມາດບັນທຶກຮູບພາບໃນຮູບແບບສະເພາະຂອງຕົນເອງໄດ້, ແລະ ເຄື່ອງມືຫຼາຍຢ່າງເຮັດວຽກໄດ້ດີຍິ່ງຂຶ້ນ."
welcome.news.v0_40_title = "TraceCut ສຳລັບເຄື່ອງຕັດພລັອດເຕີ"
welcome.news.v0_41_body = "ເທິງໜ້າຈໍສຳຜັດ, ປຸ່ມ Shift, Ctrl ແລະ Alt ຊ່ວຍໃຫ້ນິ້ວມືເຮັດວຽກແທນການກົດປຸ່ມຄ້າງໄວ້ໄດ້, ແລະ ປຸ່ມລັດ Alt ສາມາດເປີດໄດ້ທຸກເມນູ ແມ່ນແຕ່ໃນໜ້າຕ່າງແຄບ. ໃນ Android ສ່ວນຕິດຕໍ່ຜູ້ໃຊ້ຈະຫຼົບຮອຍບວມຂອງກ້ອງ ແລະ ມຸມມົນຂອງໜ້າຈໍ, ແລະ ລະບົບລວມຂໍ້ມູນ (Data Merge) ສາມາດໃຊ້ໂຟນເດີຮູບພາບໄດ້; ໃນບຣາວເຊີ Apple Pencil ສາມາດໃຊ້ງານໄດ້ໃນ Safari ເທິງ iPad, ແລະ ສາມາດບັນທຶກ WebP ແບບບີບອັດສູນເສຍຄຸນນະພາບເພື່ອໃຫ້ໄຟລ໌ນ້ອຍລົງໄດ້. ໄຟລ໌ .cdr ຈະຮັກສາກົດລະບຽບການຕື່ມສີຂອງເສັ້ນໂຄ້ງທີ່ຊ້ອນທັບກັນ ເຮັດໃຫ້ຕົວອັກສອນທີ່ແປງແລ້ວບໍ່ມີຊ່ອງວ່າງສີຂາວ, ພ້ອມທັງເປີດໄຟລ໌ພ້ອມຈຸດແທັບ, ຂໍ້ຄວາມຫຼາຍຖັນ, ເສັ້ນແນະນຳທີ່ໃຊ້ຮ່ວມກັນທຸກໜ້າ ແລະ ວັດຖຸໃນໜ້າຫຼັກ. ໄຟລ໌ທີ່ນຳເຂົ້າຈະຖືກວາງຕາມຕົວກະພິບ, ຄຳສັ່ງ Repeat ຈະຫຼິ້ນຊ້ຳກຸ່ມການກະທຳທັງໝົດ, ແລະ ຈຸດ B-spline ສາມາດຕັ້ງໃຫ້ຕິດແໜ້ນ ຫຼື ລອຍຕົວໄດ້. ທ່ານສາມາດຕັດຄອບພິກເຊວຂອງຮູບພາບ, ພິມເປັນສີຂາວດຳ ຫຼື ພິມລຽງລຳດັບກັບຫຼັງພາຍໃນໄລຍະຂອບເຈ້ຍແທ້ຂອງເຄື່ອງພິມ, ແລະ ຮູບພາບ CMYK ຍັງຄົງຮັກສາຄວາມໂປ່ງໃສໄວ້ໄດ້. ແຖບເລື່ອນສາມາດເຊື່ອງໄດ້, ຖາດສີສາມາດດຶງສີຈາກຮູບພາບໄດ້, ແລະ ໃນ Windows ແຖບຫົວຂໍ້ຈະປ່ຽນຕາມຮູບແບບໂໝດມືດ."
welcome.news.v0_41_title = "ປຸ່ມສຳຜັດ, ໄຟລ໌ .cdr ທີ່ດີຂຶ້ນ ແລະ ການຕັດຄອບຮູບພາບ"
welcome.news.v0_42_1_body = "ຕົວຕິດຕັ້ງ Windows 32 ບິດ ຕອນນີ້ຕິດຕັ້ງໃນ Windows 64 ບິດໄດ້ນຳ, ຫຼັງຈາກແນະນຳຕົວຕິດຕັ້ງ 64 ບິດ ເຊິ່ງເປັນທາງເລືອກທີ່ດີກວ່າຢູ່ທີ່ນັ້ນ. ລາຍການດາວໂຫຼດຂອງທຸກລຸ້ນໃສ່ຊື່ແຕ່ລະໄຟລ໌ຕາມລະບົບ, ໂດຍມີຕົວຕິດຕັ້ງ Windows 64 ບິດກ່ອນ." # mt
welcome.news.v0_42_1_title = "ຕົວຕິດຕັ້ງ Windows ໃນທຸກ Windows" # mt
welcome.news.v0_42_body = "ສາມາດສະແດງໜ້າຄູ່ກັນເປັນໜ້າຄູ່ດ້ວຍ ໜ້າຄູ່, ແລະ ການນຳເຂົ້າ PDF ທີ່ມີຫຼາຍໜ້າຈະຖາມວ່າຈະນຳເຂົ້າໜ້າໃດ ແລະ ວາງໄວ້ບ່ອນໃດ. ຂໍ້ຄວາມສາມາດເຊື່ອມໂຍງກັນໄດ້, ສິ່ງທີ່ທ່ານພິມໃນອັນໜຶ່ງຈະປາກົດໃນອັນອື່ນ. ສຳເນົາຊ້ຳສາມາດເຕັມທັງໜ້າດ້ວຍສຳເນົາ, ແລະ ການຈັດວາງການພິມສາມາດບັນທຶກເປັນຄ່າທີ່ຕັ້ງໄວ້ ແລະ ໃສ່ເລກລົງຕາມຖັນສຳລັບປີ້ ແລະ ບັດ. ໃນໜ້າຈໍສຳຜັດ, ແຖບເຄື່ອງມືທີ່ຍາວ, ກ່ອງເຄື່ອງມື ແລະ ຈານສີ ເລື່ອນໄດ້ດ້ວຍນິ້ວມື. Ctrl+Tab ສະຫຼັບລະຫວ່າງຮູບແຕ້ມທີ່ເປີດຢູ່, ເສັ້ນນຳທາງຈາກໄຟລ໌ .cdr ສາມາດເລືອກ ແລະ ຍ້າຍໄດ້, ສັນຍະລັກໃໝ່ຮັກສາຈຸດຈັບຂອງມັນ, ເງົາຂອງຮູບພາບຕາມຮູບຮ່າງຂອງມັນ, Ctrl ແຕ້ມຮູບຫຼາຍແຈສະເໝີ, ແລະ ຕົວນຳທາງສະແດງຮູບແຕ້ມທັງໝົດ." # mt
welcome.news.v0_42_title = "ໜ້າຄູ່, ການເລືອກໜ້າ PDF ແລະ ຂໍ້ຄວາມທີ່ເຊື່ອມໂຍງ" # mt
welcome.news.v0_43_body = "TraceCut ປ່ຽນຮູບຮ່າງຂອງທ່ານເປັນ G-code ສຳລັບເຄື່ອງກັດ CNC, ວາງຕາໄກ່, ແລະ ແຕ້ມຊິ້ນສ່ວນແບນຂອງກ່ອງທີ່ຕໍ່ແບບນິ້ວມື ຫຼື ຖາດພັບ ພ້ອມສຳລັບຕັດ. ການສົ່ງອອກຈະຖາມຫາໄຟລ໌ກ່ອນ ແລ້ວຈຶ່ງສະແດງຕົວເລືອກຂອງຮູບແບບນັ້ນ, ແລະ ການຕິດຕັ້ງອັບເດດຈະສະແດງຄວາມຄືບໜ້າໃນໜ້າຕ່າງຂອງມັນເອງ. ແຜງຂໍ້ຄວາມມີປຸ່ມສຳລັບທຸກຄຸນສົມບັດ OpenType ແລະ ຮູບແບບຕົວອັກສອນໃໝ່ ເຊັ່ນ ຂີດກ້ອງສອງເສັ້ນ ແລະ ຕົວພິມໃຫຍ່ທັງໝົດ; ການຕື່ມສີມີລາຍແບບຂັ້ນຕອນ ແລະ ການຈັດວາງລາຍ, ແລະ ຫົວລູກສອນສາມາດປັບຂະໜາດ, ເລື່ອນ ແລະ ກັບດ້ານໄດ້. ສ່ວນຕິດຕໍ່ມີພາສາລາວແລ້ວ, ແລະ ຊື່ໄຟລ໌ທີ່ເປັນພາສາເຮັບເຣີ ແລະ ອັກສອນອື່ນໆ ຈະຮັກສາຕົວອັກສອນຂອງມັນໄວ້. ການຮວມຂໍ້ມູນພິມສາມາດພິມຕາມລຳດັບຕັດແລ້ວຊ້ອນ ແລະ ສ້າງຕົວເລກສຸ່ມສຳລັບປີ້ໄດ້. ເທິງໜ້າຈໍສຳຜັດ, ການແຕະດ້ວຍສອງນິ້ວຈະຍົກເລີກການກະທຳ ແລະ ການແຕະດ້ວຍສາມນິ້ວຈະເຮັດຄືນ. ເລືອກສິ່ງທີ່ຄ້າຍຄືກັນ ຈະເລືອກວັດຖຸທີ່ຄ້າຍກັບສິ່ງທີ່ເລືອກໄວ້, ຮູບຮ່າງຂອງຂ້ອຍ ເກັບຮູບຮ່າງຂອງທ່ານເອງໄວ້ໃນຮູບຮ່າງທົ່ວໄປ, ແລະ ເສັ້ນຂອບມີຈຸດຈັບໃຫ້ລາກເທິງຮູບແຕ້ມ." # mt
welcome.news.v0_43_title = "ເສັ້ນທາງເຄື່ອງມື CNC, ການສ້າງກ່ອງ ແລະ ການຕື່ມສີແບບໃໝ່" # mt
welcome.news.v0_44_2_body = "ໄຟລ໌ .tdraw ຖືກບັນທຶກແບບກະທັດຮັດ, ນ້ອຍລົງຫຼາຍເທົ່າ. ກຸ່ມ, ຕາຕະລາງ ແລະ ກອບຈະຖືກເລືອກສະເພາະບ່ອນທີ່ມີວັດຖຸ, ແລະ ໃນມຸມມອງຫຼາຍໜ້າ ວັດຖຸທີ່ວາງໃສ່ໜ້າອື່ນຈະເປັນຂອງໜ້ານັ້ນ. ການແປງເປັນບິດແມັບຮັກສາເສັ້ນຂອບໜາ ແລະ ໝຶກ CMYK, ແລະ ໂໝດສີເທົາແປງຮູບແທ້. ໄຟລ໌ .cdr ຮັກສາວັດຖຸທີ່ລັອກໄວ້ໃຫ້ລັອກຢູ່, ແລະ ຈານສີ Pantone ຂອງ CorelDRAW ເປີດພ້ອມຊື່ ແລະ ສີສະເພາະ. ມຸມຫຍັກ ແລະ ມຸມຕັດຍັງແກ້ໄຂໄດ້, ການສຳເນົາຊອງຈະໃສ່ວັດຖຸເຂົ້າໄປໃນມັນ, ເສັ້ນໂຄ້ງ B-spline ບໍ່ກະໂດດອີກໃນເວລາແຕ້ມ, ແປງຂຽນລາຍມືແຕ້ມເສັ້ນລຽບ, ຄວາມໂປ່ງໃສແບບລັດສະໝີຄືກັບ CorelDRAW, ແລະ ການສົ່ງອອກສິ່ງທີ່ເລືອກຮັກສາເສັ້ນຂອບທັງໝົດ. ການຕິດຕາມຮັກສາຮູບທີ່ເກີນຂອບໂປ່ງໃສ, ການອັດອອກຮັກສາການຕື່ມຕາໜ່າງເມື່ອຍ້າຍ, ແລະ ເສັ້ນນຳທາງໝຸນອ້ອມຈຸດສູນກາງທີ່ຖືກຍ້າຍ." # mt
welcome.news.v0_44_2_title = "ໄຟລ໌ .tdraw ນ້ອຍລົງ, ການເລືອກແມ່ນຍຳຂຶ້ນ ແລະ ຄວາມໂປ່ງໃສແບບລັດສະໝີ" # mt
welcome.news.v0_44_1_body = "ການຜະສົມລະຫວ່າງສອງຂໍ້ຄວາມຮັກສາຂັ້ນຕອນໄວ້ທາງຫຼັງຂໍ້ຄວາມດ້ານໜ້າ ຫຼັງຈາກທັງສອງຖືກຈັດກຸ່ມ ຫຼື ປ່ຽນສີ. ໄຟລ໌ .cdr ເປີດຮູບສີ່ຫຼ່ຽມມຸມມົນດ້ວຍມຸມຂອງມັນເອງ ແລະ ຂໍ້ຄວາມສິລະປະພ້ອມຊອງທີ່ຍັງໂຄ້ງຢູ່. ໃນ Linux, ວັດຖຸທີ່ສຳເນົາໃນ TraceDraw ຈະວາງໃສ່ໂປຣແກຣມອື່ນເປັນຮູບພາບ, ແລະ ມາໂຄຣປູກະເບື້ອງທີ່ເຜີຍແຜ່ແລ້ວເຮັດວຽກຈົນຈົບ. ການຄລິກສອງເທື່ອດ້ວຍເຄື່ອງມືມືເປົ່າແຕ້ມເສັ້ນຂອງມຸມ, ຂະໜາດຕົວອັກສອນທີ່ພິມໃຫ້ຊ່ອງຕາຕະລາງປັບຂະໜາດຂໍ້ຄວາມຂອງມັນ, ແລະ ການກົດ Delete ຄ້າງໄວ້ເທິງຂໍ້ທີ່ເລືອກຈະລຶບສະເພາະຂໍ້ເຫຼົ່ານັ້ນ. ໃນຂະນະທີ່ຮູບທີ່ນຳເຂົ້າລໍຖ້າບ່ອນຂອງມັນ, ປ້າຍຂ້າງຕົວຊີ້ບອກວ່າຕ້ອງເຮັດຫຍັງ, ແຖບໜ້າຮັກສາຊື່ຕາມລຳດັບ, ແລະ ເຮັດຊ້ຳໝຸນສຳເນົາອ້ອມຈຸດສູນກາງການໝຸນທີ່ຖືກຍ້າຍ." # mt
welcome.news.v0_44_1_title = "ການຜະສົມທີ່ຈັດກຸ່ມ, ມຸມ ແລະ ຊອງຂອງ .cdr, ການສຳເນົາໄປໂປຣແກຣມອື່ນ" # mt
welcome.news.v0_44_body = "ລຸ້ນນີ້ແກ້ໄຂບັນຫາທີ່ການທົບທວນດ້ວຍວິດີໂອຂອງລຸ້ນ 0.43 ໄດ້ພົບເຫັນ: ດຶງມິຕິ 3D ຮັກສາຮູບທີ່ໝຸນໃນ 3D ໄວ້ບ່ອນເດີມ ແລະ ແຕ້ມໜ້າຂອງມັນຕາມລຳດັບທີ່ຖືກຕ້ອງ, ແລະ ຂອບລ່ຽມອຽງເທິງຂໍ້ຄວາມບໍ່ພັບທັບຕົວເອງອີກ. ເງົາຕົກກະທົບຮັກສາຮູຂອງວົງແຫວນ, ວັດຖຸທີ່ດຶງມິຕິທອດເງົາພ້ອມກັບຕົວຂອງມັນ, ກຸ່ມທອດເງົາບລັອກພຽງອັນດຽວ, ແລະ ຊອງຄວບຄຸມຮູບຮ່າງເທິງວັດຖຸທີ່ດຶງມິຕິຈະໂຄ້ງທັງຕົວ. ການມົນມຸມໃຊ້ໄດ້ກັບດ້ານທີ່ໂຄ້ງ, ການເຮັດໃຫ້ລຽບເຮັດໃຫ້ມົນທັງສອງຂ້າງບ່ອນທີ່ສີ່ຫຼ່ຽມ ຫຼື ດາວທີ່ແປງແລ້ວປິດກັນ, ປຸ່ມ C, S ແລະ Y ເຮັດໃຫ້ຈຸດເປັນມຸມແຫຼມ, ລຽບ ຫຼື ສົມມາດ, ເລືອກສິ່ງທີ່ຄ້າຍຄືກັນເບິ່ງພາຍໃນກຸ່ມນຳ, ການຫຼຸດຈຸດຮັກສາເສັ້ນໂຄ້ງໃຫ້ເປັນເສັ້ນໂຄ້ງ, ແປງເປັນບິດແມັບວາງຮູບໄວ້ໃນບ່ອນຂອງວັດຖຸໃນລຳດັບຊັ້ນ, ແລະ ຖູປ້າຍດຶງເສັ້ນຂອບອອກໄປຢ່າງລຽບນຽນ. ການເບິ່ງກ່ອນພິມສາມາດສະແດງໝຶກສີດຽວດ້ວຍສີຂອງມັນເອງ, ໜ້າທັງໝົດຍັງເຫັນຢູ່ໃນຂະນະຂະຫຍາຍ ແລະ ເລື່ອນ, ແຜງຄຸນສົມບັດສະແດງພາກດຽວດ້ວຍການຄລິກເທື່ອດຽວ, ແລະ ປຸ່ມໃໝ່ກັບການເລືອກ, ສະແດງເສັ້ນນຳ ແລະ ຕາຂ່າຍ, ແລະ ກະຈາຍວັດຖຸ. ໄຟລ໌ .cdr ເປີດພ້ອມກັບຕາຕະລາງ ແລະ ຕົວອັກສອນທີ່ມີເຄື່ອງໝາຍຂອງລຸ້ນເກົ່າ, ວັດຖຸຫວ່າງເປົ່າບໍ່ຖືກນັບວ່າອ່ານບໍ່ໄດ້ອີກ, ແລະ TraceCut ຈັດວາງວັດຖຸທີ່ມີຊອງຄວບຄຸມຕາມຮູບທີ່ມັນສະແດງ. ໃນ Windows ຕົວຊີ້ຂອງເຄື່ອງມືເຄື່ອນຕາມເມົາສ໌ໂດຍບໍ່ຊັກຊ້າ ແລະ ໄຟລ໌ຂອງແບບທີ່ເປີດຢູ່ບໍ່ສາມາດລຶບ ຫຼື ຍ້າຍໄດ້; ຊື່ໄຟລ໌ພາສາໄທສະແດງຕົວອັກສອນຂອງມັນ, ຂອບໜ້າຈໍໃນ Android ມີຂີດຈຳກັດທີ່ເໝາະສົມ, ແລະ ຂໍ້ຄວາມພາສາຮິນດີຈາກ PDF ເຂົ້າມາຕາມທີ່ພິມໄວ້." # mt
