hinttopic.connector_lines = "Các đường kết nối nối các đối tượng và luôn gắn liền khi các đối tượng di chuyển."
hinttopic.dimension_lines = "Đường kích thước hiển thị kích thước của vật thể và khoảng cách hoặc góc giữa các điểm; chúng cập nhật khi các đối tượng thay đổi."
hinttopic.effects = "Cung cấp cho đối tượng chiều sâu và chuyển động với bóng, đường viền, pha trộn, biến dạng, bao bọc, ép đùn và trong suốt."
hinttopic.fill = "Tô màu các đối tượng bằng màu sắc đồng nhất, màu tô chuyển màu, hoa văn, họa tiết và mắt lưới. **Nhấp vào** một bảng màu để điền vào vùng chọn."
hinttopic.help = "Nhấn **F1** để được trợ giúp, giữ bảng **Gợi ý** này mở trong khi bạn làm việc và xem Màn hình chào mừng để bắt đầu."
hinttopic.lines = "Hộp thả xuống công cụ **Curve** chứa các công cụ để vẽ đường, tự do hoặc chính xác, thẳng hoặc cong."
hinttopic.move_scale = "Kéo đối tượng đã chọn để di chuyển nó; **Ctrl** giữ nó trên một đường ngang hoặc dọc. Kéo **tay cầm ở góc** để chia tỷ lệ cho phù hợp và **tay cầm bên** để kéo dài nó; **Shift** chia tỷ lệ từ tâm. Các phím mũi tên di chuyển vùng chọn."
hinttopic.outline = "Đặt chiều rộng, màu sắc và kiểu dáng của đường viền. **Nhấp chuột phải** một bảng màu để tô màu cho đường viền của vùng chọn."
hinttopic.rotate_skew = "Bấm lại vào đối tượng đã chọn để hiển thị các núm điều khiển xoay và nghiêng. Kéo **mũi tên góc** để xoay và **mũi tên bên** để nghiêng; **Ctrl** xoay theo bước 15 độ. Kéo điểm đánh dấu ở giữa để thay đổi tâm xoay."
hinttopic.select = "Bấm vào một đối tượng để chọn nó. **Shift**+nhấp vào để thêm hoặc xóa đối tượng; kéo trên vùng trống để chọn các đối tượng bên trong vùng chọn; **Alt**+click chọn đối tượng bên dưới; **Ctrl**+click chọn một đối tượng trong một nhóm."
hinttopic.shape_objects = "Thay đổi hình dạng của đối tượng bằng cách chỉnh sửa các nút, làm biến dạng đường viền của chúng hoặc cắt và xóa các phần của chúng."
hinttopic.shapes = "Vẽ hình chữ nhật, hình elip, đa giác, ngôi sao, hình xoắn ốc, lưới và các hình dạng tạo sẵn bằng cách kéo theo đường chéo. **Ctrl** giữ nguyên tỷ lệ; **Shift** vẽ từ tâm."
hinttopic.text = "Nhấp bằng công cụ **Văn bản** để thêm văn bản nghệ thuật hoặc kéo để thêm văn bản đoạn văn vào khung. Bấm vào bên trong văn bản để chỉnh sửa nó."
