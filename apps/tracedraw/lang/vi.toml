welcome.learn = "Tìm hiểu"
welcome.learn_1_body = "Chọn một công cụ từ hộp công cụ (giữ nút để thả xuống) và kéo trên trang. Giữ Ctrl để hạn chế, Shift để vẽ từ giữa."
welcome.learn_1_title = "Vẽ"
welcome.learn_2_body = "Bấm để chọn, bấm lần nữa để xoay và nghiêng các chốt điều khiển, kéo các góc theo tỷ lệ. Phím mũi tên di chuyển; Shift+mũi tên di chuyển thêm mười lần nữa."
welcome.learn_2_title = "Lựa chọn và chuyển đổi"
welcome.learn_3_body = "Nhấp chuột trái vào bảng màu để tô màu, nhấp chuột phải để tạo đường viền. Bảng Thuộc tính chỉnh sửa độ dốc, mẫu, kết cấu và lưới."
welcome.learn_3_title = "Điền và phác thảo"
welcome.learn_4_body = "Công cụ Shape (F10) chỉnh sửa các nút: bấm đúp vào một đoạn để thêm nút, bấm đúp vào nút để xóa nút đó, sử dụng thanh thuộc tính cho đỉnh, mịn và đối xứng."
welcome.learn_4_title = "Nút"
welcome.learn_5_body = "Các hiệu ứng vẫn có thể chỉnh sửa được: mở bảng hiệu ứng từ menu Hiệu ứng, thay đổi các giá trị và cập nhật đối tượng. Flatten Effects nướng chúng."
welcome.learn_5_title = "Hiệu ứng"
welcome.my_templates = "Mẫu của tôi"
welcome.new_document = "Tài liệu mới"
welcome.new_from_template = "Mới từ Mẫu"
welcome.news.more = "Bạn muốn biết thêm?"
welcome.news.v0_51_1_body = "Một bước mất nhiều thời gian, như lưu một bản vẽ lớn, không còn hiện thông báo đề nghị gửi báo cáo: thông báo đó xuất hiện mỗi lần lưu tệp lớn và trông như một sự cố. Báo cáo chỉ được đề nghị khi TraceDraw thực sự đóng vì lỗi, và giờ giữ lại nguyên nhân của lỗi. Trên macOS, TraceDraw không còn đóng khi một sự kiện đến trong lúc sự kiện khác vẫn đang được xử lý." # mt
welcome.news.v0_51_1_title = "Không còn thông báo “ngừng phản hồi”" # mt
welcome.news.v0_51_0_body = "Bản vẽ lớn vẫn nhanh: thu phóng bằng con lăn, chọn đối tượng có hiệu ứng, kéo màu và gõ văn bản dài đều ít việc hơn, và ảnh lớn tốn ít bộ nhớ hơn. Tách giữ lỗ chia một đường cong và giữ mỗi lỗ trong phần của nó, Đổi màu tô và Viền từ màu tô có trong menu bảng màu, và Căn chỉnh và phân bố trải các đối tượng với lề đều trên trang. Biểu tượng được sửa trên một tờ sạch, thước dọc có thể đếm từ trên xuống, bản vẽ gửi dạng .zip mở khi thả vào cửa sổ, và ô bảng căn từ trên xuống dưới. Phiên bản này cũng sửa nhiều lỗi bạn đã báo." # mt
welcome.news.v0_51_0_title = "Bản vẽ lớn nhanh hơn, Tách giữ lỗ và bản vẽ nén zip" # mt
welcome.news.v0_50_3_body = "Khi TraceDraw không phản hồi quá 10 giây, hoặc đóng vì lỗi, giờ đây nó báo cho bạn và đề nghị gửi báo cáo về việc nó đang làm, không kèm tên hay nội dung bản vẽ: Gửi báo cáo mở một issue GitHub đã điền sẵn để bạn kiểm tra và gửi. Với trang đối diện, đối tượng thả vào trang khác trong chế độ xem nhiều trang lại thuộc về trang đó, điều mà 0.50.1 đã làm hỏng." # mt
welcome.news.v0_50_3_title = "Báo cáo khi TraceDraw ngừng phản hồi, đối tượng giữa các trang đối diện" # mt
welcome.news.v0_50_2_body = "Phiên bản này sửa hai báo cáo về 0.50.1. Tệp PDF/X được tạo cho hồ sơ CMYK của chính bản vẽ, ví dụ U.S. Web Coated (SWOP) v2, trước đây luôn ghi FOGRA39. Hòa trộn bên trong khung cắt giữ nguyên các bước khi chỉ xuất vùng chọn thành ảnh, trước đây chúng ra thành bậc thang." # mt
welcome.news.v0_50_2_title = "Sửa lỗi: điều kiện đầu ra PDF/X và hòa trộn trong ảnh xuất" # mt
welcome.news.v0_50_1_body = "Phiên bản này sửa những gì các bạn báo cáo ở 0.50.0. Trên Windows, Trợ giúp > Cập nhật cài đặt xong ngay cả khi Explorer đang hiển thị ảnh .cdr, và báo khi một bản cập nhật chưa hoàn tất. Với trang đối diện, các đối tượng của cả hai trang được chọn cùng nhau vẫn ở trang của chúng. Rã nhóm giữ bóng đổ của nhóm, Tệp > Hoàn nguyên hoạt động với bản vẽ mở từ .cdr, SVG hoặc PDF, và Lưu thành lại hiển thị kiểu và phiên bản trên Mac. Tệp .cdr phiên bản 15 mở cùng bóng đổ và độ trong suốt, và Trợ giúp hướng dẫn từng bước cách dùng Trình tạo hình và các công cụ mới của 0.50." # mt
welcome.news.v0_50_1_title = "Sửa lỗi: cập nhật trên Windows, trang đối diện, rã nhóm, Hoàn nguyên và Lưu thành" # mt
welcome.news.v0_50_0_body = "Phong bì có lưới uốn cong hình và ảnh, và Đối tượng > Kết hợp hình tách, gộp và cắt các đối tượng chồng nhau chỉ trong một bước. Bút độ cong vẽ đường cong mượt qua các điểm bạn nhấp, chữ uốn thành vòng tròn, vòm và sóng ngay từ thanh văn bản, và các đối tượng đặt theo đường dẫn đi theo nó trực tiếp. Hiệu ứng lớp thêm mép thô, tô phác thảo, dấu cắt và mép mềm, dải màu có thể hòa sắc và trộn các điểm màu tự do, và màu tô có thể là lá kim ánh ba chiều. Xoay 3D, Lóe sáng, Biến đổi từng cái và Làm phẳng độ trong suốt là mới, và giao diện có tiếng Việt. Phiên bản này cũng sửa nhiều lỗi bạn đã báo, từ in và nhập PDF đến lưu .cdr và đồ lại." # mt
welcome.news.v0_50_0_title = "Phong bì lưới, Kết hợp hình, Bút độ cong và hiệu ứng trực tiếp" # mt
welcome.news.v0_49_0_body = "Phiên bản này là về các bản sửa lỗi. Việc lưu không thành công nửa chừng sẽ không còn làm mất tệp mà nó thay thế nữa và tính năng tự động sao lưu của hai TraceDraw hoặc hai bản vẽ cùng tên không còn ghi đè lên nhau. Các bản vẽ lớn hoạt động nhanh chóng: Nhóm, Kết hợp, Tách nhóm và Hoàn tác hàng chục nghìn đối tượng chỉ mất một phần giây và các bản vẽ được lồng sâu sẽ mở lại. Được lưu dưới dạng .cdr, bản vẽ sẽ giữ các lớp ẩn, mẫu và lưới, biểu tượng cảm xúc, ngắt dòng và chuyển màu theo điểm. Các tệp PDF, SVG, EPS và EMF xuất hiện gần hơn với những gì chúng hiển thị: văn bản có đường viền, độ dốc, độ trong suốt mờ dần, hình ảnh được xoay, tiếng Do Thái và tiếng Ả Rập. Convert to Curves giữ nguyên màu của mỗi từ, một hướng dẫn có thể được áp dụng cho bất kỳ đối tượng nào và Kết hợp chọn kết quả của nó. Trên Windows, TraceDraw không còn làm chậm toàn bộ máy tính bằng cách bắt đầu một quá trình cứ sau vài giây và trên máy tính bảng, khóa Shift, Ctrl và Alt bằng hai lần nhấn."
welcome.news.v0_49_0_title = "Tiết kiệm an toàn hơn, nhập dữ liệu chính xác hơn và bản vẽ lớn nhanh hơn"
welcome.news.v0_48_0_body = "Phiên bản này là về các bản sửa lỗi. Trong văn bản, Shift+Enter ngắt dòng, có thể đọc lại các dấu đầu dòng được đánh số, thả chữ hoa giữ nguyên số dòng của chúng và Convert to Curves giữ các chữ cái chồng lên nhau. Quá trình theo dõi chạy trong một cửa sổ có tiến trình và Hủy, do đó chương trình không còn bị treo nữa. Hình ảnh được xuất sẽ giữ nguyên mọi cạnh của trang, không có đường sáng dọc theo đường viền và lưu dưới dạng .cdr không còn để lại các dòng không có độ dài. Các ảnh được nhập sẽ giữ nguyên chế độ màu, các bản sao .cdr vẫn được liên kết với ảnh chính của chúng, đồng thời độ trong suốt của mẫu .cdr và phông chữ từ phải sang trái mở như trong CorelDRAW. Trên màn hình cảm ứng, Bút đi từ nút cuối cùng, đường 2 điểm đi theo ngón tay và các hàng của đối tượng có thể được kéo. Nguyên tắc có một menu trong docker Đối tượng, lưới bắt đầu ở đầu trang và tệp DXF gồm các khối được lồng sâu không còn hết bộ nhớ. Các tệp .ai cổ điển từ các chương trình theo dõi sẽ mở màu và được nhóm lại, đồng thời Enter trong hộp Đường viền sẽ áp dụng đường viền."
welcome.news.v0_48_0_title = "Sửa lỗi cho văn bản, theo dõi, xuất và màn hình cảm ứng"
welcome.news.v0_47_0_body = "Công cụ Shape Builder hợp nhất hoặc loại bỏ các phần của các đối tượng chồng chéo bằng một thao tác kéo và công cụ Join nối các đầu của đường cong bằng một nét. Bảng tính (.xlsx, CSV, TSV) mở dưới dạng bảng trực tiếp, công thức đi kèm với Đối tượng > Chèn > Công thức và văn bản có thể chạy từ phải sang trái, với các dấu đầu dòng được đánh số và cột có độ rộng khác nhau. In có thể xếp áp phích lên nhiều tờ giấy, đặt mỗi tấm vào một tập tin riêng với màn hình bán sắc riêng và in hai mặt bằng tay. Ngăn xếp Hiệu ứng lớp phát sáng, góc xiên và bóng đổ trực tiếp trên một đối tượng. Trợ giúp > Điểm chuẩn chấm điểm cho máy tính và Thu phóng nhẹ giúp máy tính chạy chậm. Các tệp .cdr giữ các đường cong B-spline, phối cảnh và độ trong suốt xuyên tâm. Các bản sửa lỗi từ video của bạn: bóng vẫn ở trên các đối tượng của chúng và tách ra, hộp thu phóng hiển thị mức thu phóng thực, mỗi bảng màu tự cuộn, Chọn tất cả để lại các đối tượng bị khóa và các tab bảng điều khiển giữ nguyên tên của chúng. Các tệp .tdraw nhỏ hơn nhiều: mỗi ảnh được lưu trữ một lần, được nén và các ảnh JPEG đã nhập được giữ nguyên, có thanh tải cho các tệp lớn. Các tệp cũ hơn vẫn mở được nhưng tệp được lưu ở mức 0,47 trở lên chỉ mở ở mức 0,47 trở lên."
welcome.news.v0_47_0_title = "Shape Builder, bảng tính, công thức và in áp phích"
welcome.news.v0_46_0_body = "Phối cảnh hoạt động trên hình ảnh và một cú nhấp chuột vào các bước của sự hòa trộn sẽ chọn toàn bộ sự hòa trộn. Chuyển đổi Phác thảo thành Đối tượng, Hàn, Cắt và Kết hợp hoạt động bên trong các nhóm, Hiệu ứng Làm phẳng phá vỡ các bóng đổ và các đối tượng được kéo vào docker Kiểu Màu sẽ trở thành các kiểu màu. Màu bảng sẽ lấp đầy các ô trong bảng được chọn bằng công cụ Chọn hoặc Hình dạng và các trường tỷ lệ hiển thị mức độ thu nhỏ của đối tượng. Xem trước khi in tự lật một trang và giữ các đối tượng dọc theo gáy của các trang đối diện, tệp PDF có thể mở dưới dạng hình ảnh và tính năng xuất PDF giữ độ trong suốt của dải màu và bóng đổ. Các tệp DXF mở trong AutoCAD, văn bản nghệ thuật .cdr nằm ở nơi CorelDRAW đặt nó và các tệp được thả trên cửa sổ trên Windows không còn bị mất nữa."
welcome.news.v0_46_0_title = "Phối cảnh trên ảnh, ô bảng và bản sửa lỗi Xem trước bản in"
