hintstep.pick.4 = "Kéo khung xung quanh các đối tượng, bắt đầu từ một điểm trống, để chọn toàn bộ đối tượng bên trong nó."
hintstep.pick.5 = "Shift+click thêm một đối tượng vào vùng chọn hoặc lấy nó ra; Ctrl+click chọn một đối tượng trong một nhóm; Alt+click sẽ chọn đối tượng bên dưới."
hintstep.freehand_pick.1 = "Kéo một vòng quanh các đối tượng bạn muốn. Khi bạn thả ra, mọi đối tượng nằm trong vòng lặp đều được chọn."
hintstep.freehand_pick.2 = "Giữ Alt khi bạn thả ra để chọn mọi đối tượng mà vòng lặp chạm vào."
hintstep.freehand_pick.3 = "Giữ Shift để thêm vào vùng chọn hoặc Ctrl để kéo hình chữ nhật thay vì hình vòng lặp. Các đối tượng được chọn di chuyển và thay đổi kích thước như với công cụ Pick."
hintstep.free_transform.1 = "Chọn một đối tượng, chọn Xoay tự do trên thanh thuộc tính và kéo: đối tượng quay quanh điểm bạn nhấn."
hintstep.free_transform.2 = "Phản xạ góc tự do phản chiếu đối tượng qua đường thẳng từ điểm nhấn đến con trỏ."
hintstep.free_transform.3 = "Tỷ lệ tự do sẽ thay đổi kích thước đối tượng từ điểm nhấn và Độ lệch miễn phí nghiêng nó."
hintstep.free_transform.4 = "Giữ Alt để chia tỷ lệ, Ctrl để nghiêng hoặc Shift để phản chiếu trong một lần kéo. Khi bật Áp dụng để sao chép, thao tác kéo sẽ biến đổi một bản sao."
hintstep.shape.1 = "Bấm vào một đường cong để hiển thị các nút của nó, sau đó kéo một nút để di chuyển nút đó."
hintstep.shape.2 = "Bấm vào một nút để hiển thị các núm điều khiển của nút đó và kéo một núm điều khiển để thay đổi độ cong của đường cong."
hintstep.shape.3 = "Kéo một đoạn để uốn cong nó. Đoạn thẳng trở nên cong."
hintstep.shape.4 = "Bấm đúp vào một phân đoạn để thêm nút vào đó; bấm đúp vào một nút để xóa nó."
hintstep.shape.5 = "Trên hình chữ nhật, kéo nút góc để làm tròn các góc. Trên hình elip, kéo nút vào trong để tạo hình tròn hoặc kéo nút ra ngoài để tạo hình vòng cung."
hintstep.smooth.1 = "Chọn một đường cong và kéo dọc theo đường viền của nó: các điểm lắc lư và các nút bổ sung sẽ được làm mịn đi khi cọ đi qua."
hintstep.smooth.2 = "Kích thước ngòi đặt bán kính của cọ và Đánh giá mức độ mịn của cọ. Hiệu ứng mạnh nhất ở trung tâm của ngòi bút."
hintstep.smear.1 = "Chọn một đối tượng và kéo từ trong đường viền của nó ra ngoài để kéo ra phần mở rộng."
hintstep.smear.2 = "Kéo từ bên ngoài đường viền vào trong để tạo vết lõm."
hintstep.smear.3 = "Áp lực trên thanh thuộc tính sẽ đặt khoảng cách di chuyển của đường viền và kích thước Nib cho bán kính của cọ."
hintstep.twirl.1 = "Chọn một đối tượng, đặt ngòi lên cạnh của nó và giữ nút chuột: đường viền biến thành một vòng xoáy lớn dần khi bạn giữ."
hintstep.twirl.2 = "Chọn theo chiều kim đồng hồ hoặc ngược chiều kim đồng hồ trên thanh thuộc tính hoặc giữ Alt để rẽ sang hướng khác. Tốc độ đặt tốc độ quay của nó."
hintstep.attract_repel.1 = "Chọn một đối tượng và giữ nút chuột với ngòi trên đường viền của nó: Thu hút kéo các nút về phía con trỏ."
hintstep.attract_repel.2 = "Chọn Đẩy lùi hoặc giữ Alt để đẩy các nút ra khỏi con trỏ."
hintstep.attract_repel.3 = "Kích thước ngòi đặt khu vực thay đổi và Tốc độ thay đổi nhanh như thế nào. Giữ con trỏ vẫn tiếp tục."
hintstep.smudge.1 = "Chọn một đối tượng và kéo qua đường viền của nó: đường viền được kéo mượt mà cùng với thao tác kéo."
hintstep.smudge.2 = "Áp lực đặt khoảng cách kéo đường viền và Nib xác định kích thước bán kính của bàn chải."
hintstep.roughen.1 = "Chọn một đối tượng và kéo dọc theo đường viền của nó: các gai lởm chởm xuất hiện ở nơi bạn kéo."
hintstep.roughen.2 = "Tần số đặt ra có bao nhiêu gai và kích thước gai cao bao nhiêu."
hintstep.variable_outline.1 = "Chọn một đối tượng có đường viền và kéo qua đường viền: một nút chiều rộng được thêm vào và đường viền mở rộng đến con trỏ ở cả hai bên."
hintstep.variable_outline.2 = "Thêm nhiều nút chiều rộng theo cách tương tự. Chiều rộng thay đổi trơn tru từ nút này sang nút tiếp theo."
hintstep.variable_outline.3 = "Giữ Shift hoặc Alt khi bạn bắt đầu kéo để chỉ thay đổi phía con trỏ đang ở."
hintstep.variable_outline.4 = "Bấm vào một nút để nhập chiều rộng trái và phải của nút đó trên thanh thuộc tính; Xóa loại bỏ nó."
hintstep.crop.1 = "Kéo một hình chữ nhật lên phần bạn muốn giữ lại. Hình vẽ bên ngoài nó bị mờ đi."
hintstep.crop.2 = "Kéo vào bên trong khu vực để di chuyển hoặc kéo một trong các tay cầm của khu vực đó để thay đổi kích thước."
hintstep.crop.3 = "Bấm đúp vào bên trong khu vực hoặc nhấn Enter để cắt. Esc bỏ cuộc."
hintstep.knife.1 = "Chọn Đường hai điểm hoặc Tự do trên thanh thuộc tính, sau đó kéo qua một đối tượng để cắt đối tượng đó."
hintstep.knife.2 = "Các mảnh trở thành các đối tượng riêng biệt mà bạn có thể tách rời bằng công cụ Pick."
hintstep.knife.3 = "Tách lá một đường chân tóc giữa các mảnh; Khoảng cách loại bỏ một dải có chiều rộng bạn đặt."
hintstep.segment_delete.1 = "Nhấp vào một phần của đường viền giữa hai đường giao nhau để xóa nó."
hintstep.segment_delete.2 = "Kéo một hình chữ nhật qua các đường viền để xóa mọi phần mà nó chạm vào."
hintstep.join.1 = "Vẽ một nét trên các nút cuối của các đường cong mở: chúng được nối theo cặp, theo thứ tự mà nét vẽ chạm đến chúng. Các đầu gần nhau trở thành một nút; hai đầu xa nhau hơn sẽ được một đoạn thẳng."
hintstep.join.2 = "Nhấp vào nút kết thúc và sau đó nhấp vào nút khác để nối hai nút đó. Các đầu của một đường cong đóng nó lại."
hintstep.join.3 = "Phần cuối của hai đường cong tạo thành một đường cong, với phần tô và đường viền của đường cong đầu tiên. Mỗi lần nối một nét là một bước hoàn tác."
hintstep.eraser.1 = "Kéo qua một đối tượng để loại bỏ các phần bạn đi qua. Một cú nhấp chuột sẽ xóa một dấu chấm."
hintstep.eraser.2 = "Đặt độ dày và ngòi tròn hoặc vuông trên thanh thuộc tính."
hintstep.eraser.3 = "Bấm đúp vào một đối tượng bằng công cụ để xóa toàn bộ đối tượng đó."
hintstep.shape_builder.1 = "Chọn các đối tượng chồng chéo, sau đó kéo qua các phần bạn muốn dưới dạng một đối tượng: mỗi phần sẽ sáng lên khi bạn vượt qua nó."
hintstep.shape_builder.2 = "Các bộ phận trở thành một đối tượng mới có màu sắc của đối tượng phía trước, được cắt ra khỏi các đối tượng mà chúng đến từ đó."
hintstep.shape_builder.3 = "Giữ Alt trong khi bạn kéo để lấy các bộ phận đi; nhấp vào một phần để biến nó thành đối tượng của riêng nó."
hintstep.zoom.1 = "Bấm vào để phóng to tại điểm đó."
hintstep.zoom.2 = "Kéo một hình chữ nhật để thu phóng sao cho nó lấp đầy cửa sổ."
hintstep.zoom.3 = "Nhấp chuột phải hoặc Shift+click để thu nhỏ. Bấm đúp vào nút của công cụ để xem mọi đối tượng."
hintstep.pan.1 = "Kéo để di chuyển chế độ xem theo bất kỳ hướng nào. Bản vẽ không thay đổi."
hintstep.pan.2 = "Với bất kỳ công cụ nào, hãy kéo bằng nút chuột giữa để xoay."
hintstep.freehand.1 = "Kéo trên trang để vẽ một đường nơi con trỏ di chuyển và thả ra để kết thúc."
hintstep.freehand.2 = "Bấm vào nơi đường thẳng bắt đầu và bấm lại vào nơi nó kết thúc. Giữ Ctrl cho các bước 15 độ."
hintstep.freehand.3 = "Bắt đầu ở nút cuối của đường cong đã chọn để tiếp tục; kết thúc ở đầu kia của nó để đóng nó lại."
hintstep.freehand.4 = "Làm mịn trên thanh thuộc tính sẽ đặt mức độ làm mịn của đường khi bạn thả ra."
hintstep.two_point_line.1 = "Nhấn vào nơi dòng bắt đầu và thả ra ở nơi nó kết thúc."
hintstep.two_point_line.2 = "Giữ Ctrl để giữ đường thẳng theo các bước 15 độ."
hintstep.bezier.1 = "Bấm để đặt một nút góc và bấm lại để vẽ một đoạn thẳng cho nút đó."
hintstep.bezier.2 = "Kéo để đặt một nút trơn tru và kéo các tay cầm của nó ra để đặt hướng và độ uốn của đường cong."
hintstep.bezier.3 = "Bấm vào nút đầu tiên để đóng đường cong hoặc bấm đúp hoặc nhấn Enter để kết thúc. Esc ném đường cong đi."
hintstep.pen.1 = "Bấm để thêm các nút góc được nối bằng các đoạn thẳng."
hintstep.pen.2 = "Kéo để thêm nút mượt mà: đường cong hình thành trong khi bạn kéo và đoạn tiếp theo đi theo con trỏ."
hintstep.pen.3 = "Bấm vào nút đầu tiên để đóng đường cong hoặc bấm đúp hoặc nhấn Enter để kết thúc."
hintstep.bspline.1 = "Nhấn vào đây để đặt các điểm kiểm soát. Đường cong đi theo chúng một cách trơn tru và luôn ở bên trong chúng."
hintstep.bspline.2 = "Nhấp đúp hoặc nhấn Enter để kết thúc hoặc nhấp vào điểm đầu tiên để đóng đường cong thành một vòng lặp."
hintstep.curvature_pen.1 = "Click to place points. The curve runs through every one of them and bends smoothly by itself; there are no handles to pull." # mt
hintstep.curvature_pen.2 = "Hold Alt (or C or V) as you click to make that point a corner." # mt
hintstep.curvature_pen.3 = "Double-click or press Enter to finish, or click the first point to close the curve. The curve made has its points as nodes, for the Shape tool." # mt
hintstep.polyline.1 = "Bấm để thêm từng góc: các đoạn thẳng nối tiếp nhau."
hintstep.polyline.2 = "Bấm đúp hoặc nhấn Enter để hoàn tất hoặc bấm vào nút đầu tiên để đóng hình. Ctrl giữ mỗi đoạn theo bước 15 độ."
hintstep.three_point_curve.1 = "Kéo từ nơi đường cong bắt đầu đến nơi đường cong kết thúc."
hintstep.three_point_curve.2 = "Di chuyển con trỏ để uốn cong đường cong và nhấp vào điểm nó đi qua."
hintstep.brush_strokes.1 = "Chọn chế độ và độ rộng trên thanh thuộc tính: Preset, Brush, Sprayer, Calligraphic hoặc Expression."
hintstep.brush_strokes.2 = "Kéo trên trang: dòng trở thành một nét tô có chiều rộng thay đổi dọc theo nó."
hintstep.brush_strokes.3 = "Để biến các đường cong hiện có thành nét vẽ, hãy chọn chúng và nhấp vào Áp dụng cho đường cong trong bảng Brush Strokes."
hintstep.painterly_brush.1 = "Chọn bút vẽ, kích thước và độ trong suốt trên thanh thuộc tính, sau đó kéo trên trang."
hintstep.painterly_brush.2 = "Để vẽ đường viền của một đối tượng hiện có, hãy nhấp vào đối tượng đó và chọn một cây cọ."
hintstep.painterly_brush.3 = "Clear BrushStroke trả lại đường nét đơn giản cho các đối tượng đã chọn."
hintstep.shape_recognition.1 = "Vẽ một hình chữ nhật thô, hình elip hoặc hình tam giác bằng một nét: nó trở thành một hình dạng gọn gàng."
hintstep.shape_recognition.2 = "Một nét gần như thẳng sẽ trở thành một đường thẳng; các nét khác trở thành những đường cong mượt mà."
hintstep.shape_recognition.3 = "Nhận dạng hình dạng và Làm mịn trên thanh thuộc tính đặt mức độ dễ dàng của các nét trở thành hình dạng và mức độ chúng được làm mịn."
hintstep.sketch.1 = "Vẽ một nét: nó được làm mịn và chọn."
hintstep.sketch.2 = "Bắt đầu nét tiếp theo gần cuối nét cuối cùng. Khi bật Join, nó sẽ được thêm vào cùng một đường cong."
hintstep.rectangle.1 = "Kéo theo đường chéo từ góc này sang góc đối diện."
hintstep.rectangle.2 = "Giữ Ctrl để vẽ hình vuông, hoặc Shift để vẽ từ giữa ra ngoài."
hintstep.rectangle.3 = "Đặt các góc tròn, hình vỏ sò hoặc vát cạnh trên thanh thuộc tính hoặc kéo nút góc bằng công cụ Hình dạng."
hintstep.rectangle.4 = "Bấm đúp vào nút của công cụ để vẽ một hình chữ nhật có kích thước bằng kích thước của trang."
hintstep.three_point_rectangle.1 = "Kéo để vẽ đường cơ sở ở mọi góc độ."
hintstep.three_point_rectangle.2 = "Di chuyển con trỏ để đặt chiều cao và nhấp chuột."
hintstep.ellipse.1 = "Kéo theo đường chéo để vẽ hình elip."
hintstep.ellipse.2 = "Giữ Ctrl để vẽ hình tròn, Shift để vẽ từ tâm ra ngoài."
hintstep.ellipse.3 = "Chọn Pie hoặc Arc trên thanh thuộc tính hoặc kéo nút của hình elip bằng công cụ Hình dạng."
hintstep.three_point_ellipse.1 = "Kéo để vẽ đường tâm của hình elip ở bất kỳ góc nào."
hintstep.three_point_ellipse.2 = "Di chuyển con trỏ để đặt chiều cao và nhấp chuột."
hintstep.polygon.1 = "Đặt số điểm trên thanh thuộc tính và kéo theo đường chéo."
hintstep.polygon.2 = "Giữ Ctrl để vẽ đa giác đối xứng hoặc Shift để vẽ từ tâm ra ngoài."
hintstep.polygon.3 = "Kéo một nút bằng công cụ Hình dạng: các nút phù hợp ở mỗi bên sẽ theo sau, do đó đa giác vẫn đối xứng."
hintstep.star.1 = "Đặt số điểm và độ sắc nét trên thanh thuộc tính và kéo."
hintstep.star.2 = "Chọn ngôi sao phức tạp cho ngôi sao có các cạnh giao nhau."
hintstep.star.3 = "Giữ Ctrl để vẽ ngôi sao đối xứng hoặc Shift để vẽ từ giữa ra ngoài."
hintstep.spiral.1 = "Đặt số vòng quay trên thanh thuộc tính và kéo."
hintstep.spiral.2 = "Chọn Đối xứng cho các lượt cách đều nhau hoặc Logarit cho các lượt cách xa nhau hơn."
hintstep.spiral.3 = "Giữ Ctrl để vẽ hình xoắn ốc tròn hoặc Shift để vẽ từ giữa ra ngoài."
hintstep.common_shapes.1 = "Bấm vào nút hình dạng trên thanh thuộc tính và chọn một hình dạng: hình dạng cơ bản, mũi tên, biểu tượng lưu đồ, biểu ngữ hoặc chú thích."
hintstep.common_shapes.2 = "Kéo để vẽ hình dạng. Giữ Ctrl để giữ nguyên tỷ lệ hoặc Shift để vẽ từ giữa ra ngoài."
hintstep.action_lines.1 = "Chọn Parallel hoặc Radial và số dòng trên thanh thuộc tính."
hintstep.action_lines.2 = "Kéo một hộp: các đường tốc độ lấp đầy nó."
hintstep.graph_paper.1 = "Đặt số lượng hàng và cột trên thanh thuộc tính."
hintstep.graph_paper.2 = "Kéo để vẽ lưới. Giữ Ctrl cho ô vuông."
hintstep.graph_paper.3 = "Lưới là một nhóm các hình chữ nhật: rã nhóm nó để tô màu hoặc di chuyển các ô đơn lẻ."
tool.shape_generator = "Shape Generator"
tooldesc.shape_generator = "Drag a box and fill it with the Shape Generator panel's pattern."
status_hint.shape_generator = "Drag to draw the pattern · Ctrl+drag draws a square · Shift+drag draws from the center"
hinttitle.shape_generator = "Draw generated patterns"
hintstep.shape_generator.1 = "Pick the generator on the property bar; Options opens the Shape Generator panel with every setting."
hintstep.shape_generator.2 = "Drag on the page: the pattern follows the box while you drag and fills it when you let go."
hintstep.shape_generator.3 = "The pattern is one group that keeps its settings: change them in the panel and press Update selected."
toolbar.shape_gen_options = "Options…"
toolbar.shape_gen_options_desc = "Open the Shape Generator panel, with every setting of the pattern and its preview."
hintstep.text.1 = "Bấm vào nơi văn bản bắt đầu và nhập: văn bản nghệ thuật. Enter bắt đầu một dòng mới."
hintstep.text.2 = "Kéo khung, sau đó gõ: đoạn văn bản ngắt dòng ở các cạnh của khung."
hintstep.text.3 = "Nhấn Esc để kết thúc. Nhấp vào văn bản bằng công cụ để chỉnh sửa và chọn phông chữ, kích thước và kiểu trên thanh thuộc tính."
hintstep.table.1 = "Đặt số hàng và cột trên thanh thuộc tính và kéo hình chữ nhật."
hintstep.table.2 = "Bấm vào một ô và gõ. Tab đi đến ô tiếp theo."
hintstep.table.3 = "Menu Table có chức năng chèn, xóa, gộp, chia dòng, cột."
hintstep.parallel_dimension.1 = "Kéo từ điểm đầu tiên đến điểm thứ hai hoặc nhấp vào cả hai."
hintstep.parallel_dimension.2 = "Di chuyển con trỏ và nhấp vào nơi đường kích thước đi."
hintstep.parallel_dimension.3 = "Chụp vào các nút để có biện pháp chính xác. Đặt độ chính xác và đơn vị trên thanh thuộc tính."
hintstep.hv_dimension.1 = "Kéo từ điểm đầu tiên đến điểm thứ hai hoặc nhấp vào cả hai."
hintstep.hv_dimension.2 = "Di chuyển con trỏ và nhấp vào nơi dòng đi. Nó chỉ đo khoảng cách ngang hoặc dọc."
hintstep.angular_dimension.1 = "Bấm vào đỉnh của góc."
hintstep.angular_dimension.2 = "Bấm vào một điểm ở cạnh đầu tiên, sau đó nhấp vào một điểm ở cạnh thứ hai."
hintstep.angular_dimension.3 = "Bấm vào nơi vòng cung và nhãn đi."
hintstep.segment_dimension.1 = "Bấm vào một đoạn của đối tượng để lấy hai đầu của nó."
hintstep.segment_dimension.2 = "Bấm vào nơi đường kích thước đi."
hintstep.callout.1 = "Kéo từ đầu, điểm mà chú thích hướng tới, tới khuỷu tay."
hintstep.callout.2 = "Bấm vào vị trí của văn bản, sau đó nhập văn bản."
hintstep.callout.3 = "Chọn phần đầu ở đầu và hình dạng xung quanh văn bản trên thanh thuộc tính."
hintstep.connector.1 = "Kéo từ đối tượng này sang đối tượng khác: đường chạy giữa các điểm neo của chúng."
hintstep.connector.2 = "Di chuyển hoặc thay đổi kích thước một trong hai đối tượng: đầu nối vẫn được gắn vào."
hintstep.right_angle_connector.1 = "Kéo từ đối tượng này sang đối tượng khác: trình kết nối chạy theo phân đoạn ngang và dọc."
hintstep.right_angle_connector.2 = "Di chuyển một trong hai đối tượng: trình kết nối vẫn được gắn và tìm tuyến đường mới."
hintstep.rounded_connector.1 = "Kéo từ đối tượng này sang đối tượng khác: đầu nối chạy theo các đoạn ngang và dọc với các góc được bo tròn."
hintstep.rounded_connector.2 = "Đặt bán kính góc trên thanh thuộc tính. Di chuyển một trong hai đối tượng và trình kết nối theo sau."
hintstep.anchor_editing.1 = "Nhấp vào một đối tượng để hiển thị các điểm neo của nó dưới dạng kim cương."
hintstep.anchor_editing.2 = "Bấm vào bên trong đối tượng để thêm điểm neo và kéo điểm neo mà bạn đã thêm để di chuyển nó."
hintstep.anchor_editing.3 = "Chọn một điểm neo và nhấn Xóa hoặc bấm đúp vào điểm neo đó để xóa. Bốn chiếc neo ở giữa hai bên luôn giữ nguyên."
hintstep.drop_shadow.1 = "Kéo từ giữa đối tượng đến nơi bóng đổ."
hintstep.drop_shadow.2 = "Kéo từ một cạnh của đối tượng để có bóng trong phối cảnh đứng trên cạnh đó."
hintstep.drop_shadow.3 = "Kéo hai thanh trượt bên cạnh đường giữa các tay cầm: thanh trượt ở một bên thay đổi độ mờ, thanh trượt ở bên kia thay đổi độ mờ. Kéo tay cầm cuối để di chuyển bóng."
hintstep.drop_shadow.4 = "Đặt lông và màu trên thanh thuộc tính."
hintstep.contour.1 = "Kéo từ một đối tượng ra bên ngoài để có đường viền bên ngoài."
hintstep.contour.2 = "Kéo về phía giữa của nó để có đường viền bên trong."
hintstep.contour.3 = "Đặt các bước, độ lệch và màu của bước cuối cùng trên thanh thuộc tính."
hintstep.blend.1 = "Kéo từ đối tượng này sang đối tượng khác: các bước trung gian xuất hiện giữa chúng."
hintstep.blend.2 = "Đặt số bước trên thanh thuộc tính. Di chuyển, thay đổi kích thước hoặc đổi màu một trong hai đối tượng và các bước tiếp theo."
hintstep.distort.1 = "Đẩy và kéo: kéo sang phải đối tượng để tạo gai hoặc sang trái để tạo cánh hoa tròn."
hintstep.distort.2 = "Dây kéo: kéo ra xa khỏi đầu để tạo hình răng cưa ngoằn ngoèo. Bạn càng kéo xa thì chúng càng cao."
hintstep.distort.3 = "Twister: kéo xung quanh điểm bắt đầu để xoay đối tượng."
hintstep.distort.4 = "Kéo viên kim cương để di chuyển tâm biến dạng. Kéo lại sẽ thay thế nó."
hintstep.envelope.1 = "Nhấp vào một đối tượng: một khung gồm tám nút xuất hiện xung quanh đối tượng đó."
hintstep.envelope.2 = "Kéo các nút để định hình lại khung. Đối tượng uốn cong để lấp đầy nó."
hintstep.envelope.3 = "Chọn đường thẳng, cung đơn, cung đôi hoặc không bị ràng buộc trên thanh thuộc tính để đặt cách uốn cong các cạnh."
hintstep.extrude.1 = "Kéo từ một đối tượng: các cạnh chạy từ đường viền của nó về phía cuối lực kéo, điểm biến mất."
hintstep.extrude.2 = "Kéo tay cầm có hình chữ thập để di chuyển điểm biến mất."
hintstep.extrude.3 = "Đặt độ sâu, ánh sáng và màu sắc trên thanh thuộc tính."
hintstep.block_shadow.1 = "Kéo từ một vật thể theo hướng bóng sẽ đi."
hintstep.block_shadow.2 = "Đặt độ sâu, hướng, màu sắc và khoảng cách trên thanh thuộc tính."
hintstep.transparency.1 = "Nhấp vào một đối tượng và chọn Đồng nhất trên thanh thuộc tính để có độ trong suốt như nhau."
hintstep.transparency.2 = "Kéo qua một đối tượng để có độ trong suốt chuyển màu: mờ ở nơi bạn nhấn, xóa ở nơi bạn thả ra."
hintstep.transparency.3 = "Kéo thanh trượt để di chuyển đến nơi hòa trộn được một nửa và các nút để thay đổi độ dài và góc của nó."
hintstep.color_eyedropper.1 = "Nhấp vào một đối tượng để lấy mẫu màu của nó."
hintstep.color_eyedropper.2 = "Nhấp vào các đối tượng khác để tô màu đó cho chúng; Shift+click tô màu đường viền của chúng."
hintstep.color_eyedropper.3 = "Nhấp vào nút chọn trên thanh thuộc tính để lấy mẫu lại. Esc quay lại công cụ Pick. Ctrl + nhấp vào mẫu một lần nữa."
hintstep.attributes_eyedropper.1 = "Bấm vào đối tượng để sao chép từ đó."
hintstep.attributes_eyedropper.2 = "Bấm vào từng đối tượng để sao chép vào."
hintstep.attributes_eyedropper.3 = "Chọn trên thanh thuộc tính những gì cần sao chép: thuộc tính, biến đổi hoặc hiệu ứng. Shift+click lấy mẫu một đối tượng khác."
hintstep.interactive_fill.1 = "Kéo qua một đối tượng: màu tô chuyển màu chạy từ nơi bạn nhấn đến nơi bạn thả ra."
hintstep.interactive_fill.2 = "Kéo thanh trượt giữa các nút để di chuyển điểm mà các màu gặp nhau một nửa."
hintstep.interactive_fill.3 = "Kéo nút cuối để thay đổi độ dài và góc của dải màu."
hintstep.interactive_fill.4 = "Bấm đúp vào đường để thêm nút màu và kéo bảng màu vào nút để tô màu lại."
hintstep.area_fill.1 = "Nhấp vào bên trong bất kỳ khu vực khép kín nào, thậm chí cả khu vực được tạo thành bởi nhiều đối tượng chồng chéo."
hintstep.area_fill.2 = "Khu vực này trở thành một đối tượng được lấp đầy mới; các đồ vật xung quanh nó vẫn giữ nguyên như cũ."
hintstep.area_fill.3 = "Chọn màu tô và đường viền của đối tượng mới trên thanh thuộc tính."
hintstep.mesh_fill.1 = "Đặt các hàng và cột trên thanh thuộc tính và nhấp vào đối tượng để thêm lưới."
hintstep.mesh_fill.2 = "Bấm vào một nút, sau đó bấm vào bảng màu để tô màu cho nó."
hintstep.mesh_fill.3 = "Kéo các nút để uốn cong dòng màu."
hintstep.mesh_fill.4 = "Bấm đúp vào bên trong lưới để thêm hàng và cột; Xóa sẽ xóa hàng và cột của nút đã chọn."
hintstep.outline_pen.1 = "Chọn một đối tượng và chọn công cụ: hộp thoại Outline Pen sẽ mở ra."
hintstep.outline_pen.2 = "Đặt chiều rộng, kiểu dáng, góc, mũ dòng và đầu mũi tên, rồi nhấp vào OK."
hintstep.outline_pen.3 = "Nếu không chọn gì, cài đặt sẽ áp dụng cho các đối tượng bạn vẽ tiếp theo."
hintstep.outline_color.1 = "Chọn một đối tượng và chọn công cụ: bảng Màu sẽ mở ra."
hintstep.outline_color.2 = "Chọn một màu để đặt màu đường viền. Nhấp chuột phải vào bảng màu cũng thực hiện tương tự."
tooldesc.painterly_brush = "Vẽ các nét vẽ tự do trông như được vẽ: phấn, màu nước, lông bàn chải, lông thú, phun sơn và nhiều thứ khác."
