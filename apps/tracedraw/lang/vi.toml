web.notice_text = "**Trình duyệt chậm hơn:** bản vẽ lớn, hiệu ứng nặng và tệp lớn mất nhiều thời gian hơn, phông chữ được cài đặt trên máy tính của bạn không có sẵn (phông chữ miễn phí được tải xuống lần đầu tiên văn bản sử dụng chúng, từ danh mục của trang và phông chữ bạn thêm vào Trình quản lý phông chữ được lưu giữ trong trình duyệt này) và các tệp mở bằng cách tải lên và lưu dưới dạng tải xuống.\n\nĐây là chương trình Rust giống như ứng dụng dành cho máy tính để bàn, được biên dịch sang WebAssembly để bạn có thể dùng thử mà không cần cài đặt bất cứ thứ gì.\n\nThực tế làm việc và các tệp lớn, hãy sử dụng ứng dụng máy tính để bàn dành cho Windows, macOS hoặc Linux: ứng dụng này chạy nguyên bản ở tốc độ tối đa."
web.notice_download = "Tải xuống ứng dụng máy tính để bàn"
web.notice_store = "Tải nó từ Microsoft Store"
web.notice_store_note = "Trên Windows, TraceDraw cũng có trong Microsoft Store, được Windows ký và cập nhật. Mỗi phiên bản trước tiên phải vượt qua chứng nhận của Cửa hàng, vì vậy phiên bản Cửa hàng có thể là một hoặc nhiều bản phát hành sau bản tải xuống mới nhất."
