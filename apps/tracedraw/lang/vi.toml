hint.topic_ai = "trí tuệ nhân tạo"
hinttopic.ai = "TraceDraw không có AI riêng: **AI Vẽ**, **AI Tạo** (tạo, phối lại, vectơ) và **Xóa nền** sử dụng một dịch vụ AI mà bạn kết nối trong **Công cụ > Tùy chọn > AI > Dịch vụ**, bằng khóa của riêng bạn và không gửi gì cho đến khi bạn yêu cầu. Mặc dù dịch vụ không thể chạy lệnh nhưng nó có màu xám."
hintai.cloud = "**Dịch vụ trực tuyến**: chọn cài đặt trước (Anthropic, OpenAI, Google Gemini) và dán khóa API của bạn. Khóa Gemini đến từ Google AI Studio, khóa OpenAI đến từ nền tảng OpenAI."
hintai.local = "**AI trên máy tính này**: đối với AI Vẽ, hãy chọn **Ollama**, **LM Studio**, **llama.cpp** hoặc **vLLM** (hoặc nhập địa chỉ của bất kỳ máy chủ nào có API hoàn thành trò chuyện). Không cần chìa khóa; **Kết nối thử nghiệm** liệt kê các mô hình của nó."
hintai.web = "**Trong trình duyệt**, máy chủ cục bộ phải cho phép các yêu cầu từ trang (đối với Ollama: **OLLAMA_ORIGINS=***). Ứng dụng máy tính để bàn không cần gì hơn."
hintai.privacy = "**Nội dung được gửi**: chỉ những gì lệnh cần khi bạn chạy lệnh đó. Chìa khóa vẫn ở trong bộ nhớ trừ khi bạn yêu cầu ghi nhớ chúng."
