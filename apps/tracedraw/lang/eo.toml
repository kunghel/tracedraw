# Hints panel: the steps of each tool's page (ui/hint_pics.rs)
hintstep.pick.1 = "Alklaku objekton por elekti ĝin. Ok teniloj aperas ĉirkaŭ ĝi." # mt
hintstep.pick.2 = "Trenu la objekton por movi ĝin. Trenu angulan tenilon por proporcie regrandigi ĝin, aŭ flankan tenilon por etendi ĝin." # mt
hintstep.pick.3 = "Denove alklaku la elektitan objekton por montri rotaciajn tenilojn: trenu angulan sagon por rotacii ĝin, flankan sagon por klini ĝin." # mt
hintstep.pick.4 = "Trenu kadron ĉirkaŭ la objektoj, komencante en malplena spaco, por elekti ĉiujn tute interne de ĝi." # mt
hintstep.pick.5 = "Shift+alklako aldonas aŭ forigas objekton de la elektaĵo; Ctrl+alklako elektas objekton en grupo; Alt+alklako elektas la suban objekton." # mt
hintstep.freehand_pick.1 = "Trenu buklon ĉirkaŭ la dezirataj objektoj. Post liberigo ĉiuj objektoj tute en la buklo estas elektitaj." # mt
hintstep.freehand_pick.2 = "Tenu Alt dum liberigo por elekti ĉiujn objektojn tuŝatajn de la buklo." # mt
hintstep.freehand_pick.3 = "Tenu Shift por aldoni al la elektaĵo, aŭ Ctrl por treni rektangulon anstataŭ buklon. Elektitaj objektoj moviĝas kaj regrandiĝas kiel per la ilo Elektaĵo." # mt
hintstep.free_transform.1 = "Elektu objekton, elektu Liberan rotacion en la ecobreto kaj trenu: la objekto rotacias ĉirkaŭ la punkto, kie vi premis." # mt
hintstep.free_transform.2 = "Libera angula spegulado spegulas la objekton laŭ la linio de la premita punkto al la montrilo." # mt
hintstep.free_transform.3 = "Libera skalado regrandigas la objekton ekde la premita punkto, kaj Libera klino klinas ĝin." # mt
hintstep.free_transform.4 = "Tenu Alt por skali, Ctrl por klini aŭ Shift por speguli dum treno. Kun Apliki al kopio ŝaltita, la treno transformas kopion." # mt
hintstep.shape.1 = "Alklaku kurbon por montri ĝiajn nodojn kaj trenu nodon por movi ĝin." # mt
hintstep.shape.2 = "Alklaku nodon por montri ĝiajn regtenilojn kaj trenu tenilon por ŝanĝi la kurbecon." # mt
hintstep.shape.3 = "Trenu segmenton por kurbigi ĝin. Rekta segmento fariĝas kurba." # mt
hintstep.shape.4 = "Duoble alklaku segmenton por aldoni nodon tie; duoble alklaku nodon por forigi ĝin." # mt
hintstep.shape.5 = "Ĉe rektangulo, trenu angulnodon por rondigi la angulojn. Ĉe elipso, trenu la nodon internen por fari sektoron, aŭ eksteren por arko." # mt
hintstep.smooth.1 = "Elektu kurbon kaj trenu laŭ la konturo: ondadoj kaj troaj nodoj glatiĝas kie la peniko pasas." # mt
hintstep.smooth.2 = "Pintgrandeco difinas la radiuson de la peniko kaj Kvoto la forton de glatigo. La efiko estas plej forta ĉe la centro de la pinto." # mt
hintstep.smear.1 = "Elektu objekton kaj trenu de interne de la konturo eksteren por tiri elstaraĵon." # mt
hintstep.smear.2 = "Trenu de ekstere de la konturo internen por puŝi kavaĵon." # mt
hintstep.smear.3 = "Premo en la ecobreto difinas kiom la konturo moviĝas, kaj Pintgrandeco la penikradiuson." # mt
hintstep.twirl.1 = "Elektu objekton, metu la pinton sur la randon kaj tenu la musbutonon: la konturo fariĝas vortico, kiu kreskas dum vi tenas ĝin." # mt
hintstep.twirl.2 = "Elektu dekstruman aŭ maldekstruman direkton en la ecobreto, aŭ tenu Alt por rotacii inverse. Rapido difinas la rotacian rapidon." # mt
hintstep.attract_repel.1 = "Elektu objekton kaj tenu la musbutonon kun la pinto sur la konturo: Altiri tiras la nodojn al la montrilo." # mt
hintstep.attract_repel.2 = "Elektu Forpuŝi, aŭ tenu Alt, por puŝi la nodojn for de la montrilo." # mt
hintstep.attract_repel.3 = "Pintgrandeco difinas la ŝanĝatan areon kaj Rapido la ŝanĝrapidon. Teni la montrilon senmova daŭrigas la efikon." # mt
hintstep.smudge.1 = "Elektu objekton kaj trenu tra la konturo: la konturo estas glate tirata kun la treno." # mt
hintstep.smudge.2 = "Premo difinas kiom la konturo estas tirata, kaj Pintgrandeco la penikradiuson." # mt
hintstep.roughen.1 = "Elektu objekton kaj trenu laŭ la konturo: neregulaj pintoj aperas kie vi trenas." # mt
hintstep.roughen.2 = "Frekvenco difinas kiom da pintoj aperas, kaj Pintalto ilian alton." # mt
hintstep.variable_outline.1 = "Elektu objekton kun konturo kaj trenu tra la konturo: larĝnodo estas aldonata kaj la konturo larĝiĝas ĝis la montrilo ambaŭflanke." # mt
hintstep.variable_outline.2 = "Aldonu pliajn larĝnodojn same. La larĝo glate ŝanĝiĝas de unu nodo al la sekva." # mt
hintstep.variable_outline.3 = "Tenu Shift aŭ Alt ĉe la komenco de la treno por ŝanĝi nur la flankon de la montrilo." # mt
hintstep.variable_outline.4 = "Alklaku nodon por tajpi la maldekstran kaj dekstran larĝojn en la ecobreto; Delete forigas ĝin." # mt
hintstep.crop.1 = "Trenu rektangulon sur la konservotan parton. La desegnaĵo ekster ĝi mallumiĝas." # mt
hintstep.crop.2 = "Trenu interne de la areo por movi ĝin aŭ trenu unu el la teniloj por regrandigi ĝin." # mt
hintstep.crop.3 = "Duoble alklaku interne de la areo aŭ premu Enter por tondi. Esc nuligas." # mt
hintstep.knife.1 = "Elektu Dupunkta linio aŭ Libermane en la ecobreto kaj trenu tra objekto por tranĉi ĝin." # mt
hintstep.knife.2 = "La pecoj fariĝas apartaj objektoj, kiujn vi povas disigi per la ilo Elektaĵo." # mt
hintstep.knife.3 = "Dividi lasas tre maldikan linion inter la pecoj; Interspaco forigas strion de la difinita larĝo." # mt
hintstep.segment_delete.1 = "Alklaku konturparton inter du kruciĝoj por forigi ĝin." # mt
hintstep.segment_delete.2 = "Trenu rektangulon super la konturoj por forigi ĉiujn partojn, kiujn ĝi tuŝas." # mt
hintstep.join.1 = "Desegnu strekon super la finaj nodoj de malfermitaj kurboj: ili estas kunigitaj pare, en la ordo en kiu la streko atingas ilin. Finoj proksimaj fariĝas unu nodo; finoj pli foraj ricevas rektan segmenton." # mt
hintstep.join.2 = "Klaku finan nodon kaj poste alian por kunigi tiujn du. La finoj de unu kurbo fermas ĝin." # mt
hintstep.join.3 = "Finoj de du kurboj faras unu kurbon, kun la plenigaĵo kaj konturo de la unua. Ĉiu kunigo de unu streko estas unu malfara paŝo." # mt
hintstep.eraser.1 = "Trenu sur objekto por forviŝi la partojn trairatajn. Alklako forviŝas punkton." # mt
hintstep.eraser.2 = "Difinu dikecon kaj rondan aŭ kvadratan pinton en la ecobreto." # mt
hintstep.eraser.3 = "Duoble alklaku objekton per la ilo por forigi ĝin tute." # mt
hintstep.shape_builder.1 = "Elektu la interkovrantajn objektojn, poste trenu trans la partojn, kiujn vi volas kiel unu objekton: ĉiu parto lumiĝas kiam vi transiras ĝin." # mt
hintstep.shape_builder.2 = "La partoj fariĝas unu nova objekto en la koloroj de la antaŭa objekto, eltranĉita el la objektoj, el kiuj ili venis." # mt
hintstep.shape_builder.3 = "Tenu Alt dum vi trenas por forpreni la partojn; klaku parton por igi ĝin propra objekto." # mt
hintstep.zoom.1 = "Alklaku por zomi ĉe tiu punkto." # mt
hintstep.zoom.2 = "Trenu ortangulon por zomi ĝis ĝi plenigas la fenestron." # mt
hintstep.zoom.3 = "Dekstre alklaku aŭ Shift+alklaku por malzomi. Duoble alklaku la ilbutonon por vidi ĉiujn objektojn." # mt
