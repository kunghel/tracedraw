web.notice_text = "**En la retumilo ĉio estas pli malrapida:** grandaj desegnaĵoj, pezaj efikoj kaj grandaj dosieroj bezonas pli da tempo, la tiparoj instalitaj en via komputilo ne disponeblas (liberaj tiparoj venas el la katalogo de la paĝo kiam desegnaĵo bezonas ilin, kaj tiuj aldonitaj en la Tiparadministrilo estas konservataj), kaj dosieroj malfermiĝas per alŝuto kaj konserviĝas kiel elŝutoj.\n\nĈi tiu estas la sama programo en Rust kiel la labortabla aplikaĵo, kompilita al WebAssembly por ke vi provu ĝin sen instali ion.\n\nPor vera laboro kaj grandaj dosieroj, uzu la aplikaĵon por Windows, macOS aŭ Linux: ĝi funkcias denaske, plenrapide." # mt
