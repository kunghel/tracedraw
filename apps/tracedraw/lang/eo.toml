welcome.news.more = "Ĉu vi volas ekscii pli?" # mt
welcome.news.v0_53_0_body = "Objekto > Enmeti > Diagramo el datumoj desegnas tabelon kiel kolumnojn, stangojn, liniojn aŭ torton. Kunfandi formojn glate sekvas trenatan objekton, akceptas kopiojn kaj pliajn objektojn, kaj Konverti al kurboj tenas ĝian farbon. Viva kombinado funkcias en ĉiu reĝimo, Rondigi angulojn kaj Tranĉi aliĝas al la tavolaj efektoj, kaj la panelo Disĵeto de simboloj ricevas penikon. Tavoloj povas aperi sur elektita paĝintervalo, broŝuroj akceptas 16 paĝojn po flanko kun ŝovo, PDF-eksporto povas densigi bildojn ĝis cela dosiergrando, kaj dekstraklakaj menuoj estas agordeblaj. Desegnaĵoj kun miloj da tekstoj malfermiĝas kaj rulumas multe pli rapide. Ĉi tiu versio ankaŭ riparas multajn erarojn, kiujn vi raportis." # mt
welcome.news.v0_53_0_title = "Diagramoj el datumoj, pli glata Kunfandi formojn kaj tavoloj sur paĝintervaloj" # mt
welcome.news.v0_52_0_body = "Duobla klako sur bildo malfermas kompletan reĝimon por redakti bildojn, kun propra ilaro, klavoj por ĉiu ilo, novaj maskoj kaj penikoj, kaj menuoj Bildo kaj Alĝustigi. Komunaj Formoj restas alĝustigeblaj post desegno, kun rombaj teniloj por la kapo de sago, rondigita angulo aŭ la vosto de vortbalono. Konservado kaj eksportado de granda desegnaĵo okazas fone kun videbla progreso, PostScript-presiloj en Windows konservas CMYK-valorojn, kaj tavoloj elekteblas plurope en la Objekta panelo. Ĉi tiu versio ankaŭ riparas multajn erarojn, kiujn vi raportis." # mt
welcome.news.v0_52_0_title = "Kompleta reĝimo por redakti bildojn, alĝustigeblaj Komunaj Formoj kaj konservado fone" # mt
welcome.news.v0_51_1_body = "Paŝo, kiu daŭras longe, kiel konservi grandan desegnaĵon, ne plu alportas mesaĝon proponantan raporton: ĝi venis ĉe ĉiu konservo de granda dosiero kaj aspektis kiel kraŝo. Raporto estas proponata nur kiam TraceDraw vere fermiĝis pro eraro, kaj ĝi nun konservas la kaŭzon de la eraro. Sur macOS, TraceDraw ne plu fermiĝas kiam evento alvenas dum alia ankoraŭ estas traktata." # mt
welcome.news.v0_51_1_title = "Ne plu mesaĝoj “ĉesis respondi”" # mt
welcome.news.v0_51_0_body = "Grandaj desegnaĵoj restas rapidaj: zomi per la rado, elekti objektojn kun efektoj, treni kolorojn kaj tajpi en longaj tekstoj ĉiuj faras malpli da laboro, kaj grandaj bildoj prenas malpli da memoro. Disigi Konservante Truojn dividas kurbon kun ĉiu truo konservita en sia parto, Interŝanĝi Plenigaĵojn kaj Konturo el Plenigaĵo estas en la menuo de la kolorpanelo, kaj Vicigi kaj Distribui povas disigi objektojn kun egalaj marĝenoj sur la paĝo. Simboloj estas redaktataj sur pura folio, la vertikala liniilo povas kalkuli malsupren de la supro, desegnaĵo sendita kiel .zip malfermiĝas kiam faligita sur la fenestron, kaj tabelĉeloj vicigas de supre ĝis malsupre. Ĉi tiu versio ankaŭ riparas multajn erarojn, kiujn vi raportis." # mt
welcome.news.v0_51_0_title = "Pli rapidaj grandaj desegnaĵoj, Disigi Konservante Truojn kaj zipitaj desegnaĵoj" # mt
welcome.news.v0_50_3_body = "Kiam TraceDraw ĉesas respondi dum pli ol 10 sekundoj, aŭ fermiĝas pro eraro, ĝi nun diras tion kaj proponas sendi raporton pri tio, kion ĝi faris, sen la nomo aŭ enhavo de la desegnaĵo: Sendi Raporton malfermas GitHub-raporton plenigitan por ke vi kontrolu kaj sendu. Kun kontraŭaj paĝoj, objekto lasita sur alia paĝo en la Plurpaĝa Vido fariĝas denove de tiu paĝo, kion 0.50.1 rompis." # mt
welcome.news.v0_50_3_title = "Raportoj kiam TraceDraw ĉesas respondi, objektoj tra kontraŭaj paĝoj" # mt
welcome.news.v0_50_2_body = "Ĉi tiu versio riparas du raportojn pri 0.50.1. PDF/X-dosiero estas farita por la propra CMYK-profilo de la desegnaĵo, ekzemple U.S. Web Coated (SWOP) v2, kie ĝi ĉiam diris FOGRA39. Transiro ene de tonda kadro konservas siajn paŝojn kiam nur la elekto estas eksportita kiel bildo, kie ili eliris kiel ŝtuparo." # mt
welcome.news.v0_50_2_title = "Riparoj: PDF/X-eliga kondiĉo kaj transiroj en eksportitaj bildoj" # mt
welcome.news.v0_50_1_body = "Ĉi tiu versio riparas tion, kion vi raportis pri 0.50.0. Sur Windows, Helpo > Ĝisdatigoj finas instali eĉ dum Explorer montras .cdr-bildojn, kaj diras tion se ĝisdatigo ne finiĝis. Kun kontraŭaj paĝoj, objektoj de ambaŭ paĝoj elektitaj kune restas sur sia propra paĝo. Malgrupigi konservas la falombron de la grupo, Dosiero > Malfari Ŝanĝojn funkcias por desegnaĵoj malfermitaj el .cdr, SVG aŭ PDF, kaj Konservi Kiel montras denove la tipon kaj la version sur Mac. .cdr-dosieroj de versio 15 malfermiĝas kun siaj falombroj kaj travideblecoj, kaj la Helpo montras paŝon post paŝo kiel uzi la Formogenerilon kaj la novajn ilojn de 0.50." # mt
welcome.news.v0_50_1_title = "Riparoj: ĝisdatigoj sur Windows, kontraŭaj paĝoj, malgrupigo, Malfari Ŝanĝojn kaj Konservi Kiel" # mt
welcome.news.v0_50_0_body = "Kovertoj prenas reton, kiu kurbigas formojn kaj bildojn, kaj Objekto > Kombini Formojn rompas, kunfandas kaj tranĉas interkovrantajn objektojn per unu paŝo. La Kurba Plumo desegnas glatajn kurbojn tra la punktoj, kiujn vi klakas, teksto kurbiĝas en cirklojn, arkojn kaj ondojn el la tekstobreto, kaj objektoj adaptitaj al vojo sekvas ĝin vive. Tavolaj efektoj aldonas malglatajn randojn, skizajn plenigaĵojn, tondmarkojn kaj molajn randojn, gradientoj povas ditere kaj miksi liberajn kolorpunktojn, kaj plenigaĵoj povas esti hologramaj folioj. 3D Rotacio, Lumbrilo, Transformi Ĉiun kaj Platigi Travideblecon estas novaj, kaj la interfaco venas en la vjetnama. Ĉi tiu versio ankaŭ riparas multajn erarojn, kiujn vi raportis, de presado kaj PDF-importo ĝis .cdr-konservado kaj vektorigo." # mt
welcome.news.v0_50_0_title = "Retaj kovertoj, Kombini Formojn, Kurba Plumo kaj vivaj efektoj" # mt
welcome.news.v0_49_0_body = "Ĉi tiu versio temas pri riparoj. Konservo, kiu malsukcesas duonvoje, ne plu perdas la dosieron, kiun ĝi anstataŭigas, kaj la aŭtomataj sekurkopioj de du TraceDraw-oj, aŭ de du samnomaj desegnaĵoj, ne plu surskribas unu la alian. Grandaj desegnaĵoj restas rapidaj: Grupigi, Kombini, Malgrupigi kaj Malfari de dekoj da miloj da objektoj daŭras frakcion de sekundo, kaj profunde nestitaj desegnaĵoj denove malfermiĝas. Konservite kiel .cdr, desegnaĵo konservas siajn kaŝitajn tavolojn, ŝablonajn kaj retajn plenigaĵojn, emoĝiojn, linisaltojn kaj gradientojn de punktaj koloroj. PDF-, SVG-, EPS- kaj EMF-dosieroj eniras kaj eliras pli proksime al tio, kion ili montras: konturigita teksto, gradientoj, paliĝantaj travideblecoj, turnitaj bildoj, la hebrea kaj la araba. Konverti al Kurboj konservas la koloron de ĉiu vorto, gvidlinio povas esti prenita super iu ajn objekto, kaj Kombini elektas sian rezulton. Sur Windows, TraceDraw ne plu malrapidigas la tutan komputilon lanĉante procezon ĉiujn kelkajn sekundojn, kaj sur tabulkomputiloj Shift, Ctrl kaj Alt ŝlosiĝas per du frapetoj." # mt
welcome.news.v0_49_0_title = "Pli sekura konservado, pli fidelaj importoj kaj pli rapidaj grandaj desegnaĵoj" # mt
welcome.news.v0_48_0_body = "Ĉi tiu versio temas pri riparoj. En teksto, Shift+Enigo rompas la linion, numeritaj buletoj povas denove esti legitaj, inicialoj tenas sian nombron de linioj, kaj Konverti al Kurboj konservas interkovrantajn literojn. Vektorigo funkcias en fenestro kun sia progreso kaj Nuligi, do la programo ne plu aspektas frostigita. Eksportitaj bildoj konservas ĉiun randon de la paĝo, sen hela linio laŭ la bordero, kaj konservi kiel .cdr ne plu preterlasas liniojn sen longo. Importitaj bildoj konservas sian kolorreĝimon, .cdr-klonoj restas ligitaj al sia majstro, kaj .cdr-ŝablonaj travideblecoj kaj dekstre-maldekstraj tiparoj malfermiĝas. Sur tuŝekranoj la Plumo daŭras de la lasta nodo, la 2-punkta linio sekvas la fingron kaj vicoj de la panelo Objektoj povas esti trenitaj. Gvidlinioj havas menuon en la panelo Objektoj, la krado komenciĝas ĉe la supro de la paĝo, kaj DXF-dosiero de profunde nestitaj blokoj ne plu elĉerpas la memoron. Klasikaj .ai-dosieroj el vektorigaj programoj malfermiĝas kolore kaj grupigite, kaj Enigo en la Konturaj skatoloj aplikas la konturon." # mt
welcome.news.v0_48_0_title = "Riparoj por teksto, vektorigo, eksportoj kaj tuŝekranoj" # mt
