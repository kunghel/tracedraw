web.notice_title = "TraceDraw v prohlížeči"
web.notice_text = "**Prohlížeč je pomalejší:** velké kresby, náročné efekty a velké soubory trvají déle, písma nainstalovaná ve vašem počítači nejsou k dispozici (volná písma se načítají z katalogu stránky, když je kresba potřebuje, a písma přidaná ve Správci písem zůstávají) a soubory se otevírají nahráním a ukládají jako stažené.\n\nJe to stejný program v Rustu jako aplikace pro počítač, zkompilovaný do WebAssembly, abyste ho mohli vyzkoušet bez instalace.\n\nPro skutečnou práci a velké soubory použijte aplikaci pro Windows, macOS nebo Linux: běží nativně, plnou rychlostí." # mt
web.notice_download = "Stáhnout aplikaci pro počítač"
web.notice_store = "Získat v obchodě Microsoft Store"
web.notice_store_note = "Ve Windows je TraceDraw také v obchodě Microsoft Store, podepsaný a aktualizovaný systémem Windows. Každá verze musí nejprve projít certifikací obchodu, takže verze z Microsoft Store může být o jedno či více vydání pozadu za nejnovějším stažením."
