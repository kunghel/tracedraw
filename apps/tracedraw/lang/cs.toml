hintstep.curvature_pen.2 = "Hold Alt (or C or V) as you click to make that point a corner."
hintstep.curvature_pen.3 = "Double-click or press Enter to finish, or click the first point to close the curve. The curve made has its points as nodes, for the Shape tool."
hintstep.polyline.1 = "Klikáním přidáváte jednotlivé rohy: rovné segmenty následují jeden za druhým." # mt
hintstep.polyline.2 = "Dokončete dvojitým kliknutím nebo klávesou Enter, nebo klikněte na první uzel a uzavřete tvar. Ctrl drží každý segment v krocích po 15 stupních." # mt
hintstep.three_point_curve.1 = "Táhněte od začátku křivky k jejímu konci." # mt
hintstep.three_point_curve.2 = "Pohybem ukazatele křivku ohněte a klikněte na bod, kterým prochází." # mt
hintstep.brush_strokes.1 = "Na liště vlastností zvolte režim a šířku: Předvolba, Štětec, Sprej, Kaligrafický nebo Expresivní." # mt
hintstep.brush_strokes.2 = "Táhněte po stránce: z čáry se stane vyplněný tah, jehož šířka se po délce mění." # mt
hintstep.brush_strokes.3 = "Chcete-li existující křivky změnit na tahy, vyberte je a v panelu Tahy štětcem klikněte na Použít na křivku." # mt
hintstep.painterly_brush.1 = "Na liště vlastností zvolte štětec, velikost a průhlednost a pak táhněte po stránce." # mt
hintstep.painterly_brush.2 = "Chcete-li namalovat obrys existujícího objektu, klikněte na něj a vyberte štětec." # mt
hintstep.painterly_brush.3 = "Clear Brushstroke vrátí vybraným objektům jejich obyčejný obrys." # mt
hintstep.shape_recognition.1 = "Nakreslete jedním tahem přibližný obdélník, elipsu nebo trojúhelník: změní se v čistý tvar." # mt
