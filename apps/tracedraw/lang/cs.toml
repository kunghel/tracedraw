welcome.news.more = "Chcete vědět víc?" # mt
welcome.news.v0_53_0_body = "Objekt > Vložit > Graf z dat nakreslí tabulku jako sloupce, pruhy, čáry nebo koláč. Sloučení tvarů plynule sleduje tažený objekt, přijímá kopie a další objekty a Převést na křivky zachová jeho barvu. Živé kombinování funguje ve všech režimech, Zaoblení rohů a Rozřezání přibyly mezi efekty vrstvy a panel Rozptyl symbolů dostal štětec. Vrstvy se mohou zobrazit na zvoleném rozsahu stránek, brožury pojmou 16 stran na stranu archu s posunem, export do PDF umí komprimovat obrázky na cílovou velikost souboru a místní nabídky lze přizpůsobit. Kresby s tisíci texty se otevírají a posouvají mnohem rychleji. Tato verze také opravuje mnoho nahlášených chyb." # mt
welcome.news.v0_53_0_title = "Grafy z dat, plynulejší Sloučení tvarů a vrstvy na rozsazích stránek" # mt
welcome.news.v0_52_0_body = "Dvojklik na obrázek otevře úplný režim úprav obrázků s vlastní sadou nástrojů, klávesou pro každý nástroj, novými maskami a štětci a nabídkami Obrázek a Upravit. Základní tvary zůstávají po nakreslení upravitelné, s kosočtverečnými úchyty pro hrot šipky, zaoblený roh nebo ocásek bubliny. Ukládání a export velké kresby probíhají na pozadí se zobrazeným průběhem, tiskárny PostScript ve Windows zachovávají hodnoty CMYK a v panelu Objekty lze vybrat více vrstev najednou. Tato verze také opravuje mnoho nahlášených chyb." # mt
welcome.news.v0_52_0_title = "Úplný režim úprav obrázků, upravitelné Základní tvary a ukládání na pozadí" # mt
welcome.news.v0_51_1_body = "Krok, který trvá dlouho, například uložení velké kresby, už nezobrazí hlášení nabízející zprávu: objevovalo se při každém uložení velkého souboru a vypadalo jako pád. Zpráva se nabízí jen tehdy, když se TraceDraw opravdu zavřel kvůli chybě, a nově uchovává příčinu chyby. V systému macOS se TraceDraw už nezavře, když přijde událost během zpracování jiné." # mt
welcome.news.v0_51_1_title = "Konec hlášení „přestal reagovat“" # mt
welcome.news.v0_51_0_body = "Velké kresby zůstávají rychlé: zoom kolečkem, výběr objektů s efekty, tažení barev a psaní dlouhých textů dají méně práce a velké obrázky zaberou méně paměti. Rozdělit se zachováním děr rozdělí křivku a každou díru nechá v její části, Prohodit výplně a Obrys z výplně jsou v nabídce panelu barev a Zarovnat a rozmístit rozloží objekty se stejnými okraji na stránce. Symboly se upravují na čistém listu, svislé pravítko může počítat shora, kresba poslaná jako .zip se otevře po přetažení do okna a buňky tabulky se zarovnávají shora dolů. Tato verze také opravuje mnoho nahlášených chyb." # mt
welcome.news.v0_51_0_title = "Rychlejší velké kresby, Rozdělit se zachováním děr a zazipované kresby" # mt
welcome.news.v0_50_3_body = "Když TraceDraw nereaguje déle než 10 sekund nebo se zavře kvůli chybě, nyní to oznámí a nabídne odeslání zprávy o tom, co dělal, bez názvu a obsahu kresby: Odeslat zprávu otevře vyplněný problém na GitHubu k zkontrolování a odeslání. U protilehlých stránek patří objekt puštěný na jinou stránku v zobrazení více stránek opět této stránce, což verze 0.50.1 rozbila." # mt
welcome.news.v0_50_3_title = "Zprávy, když TraceDraw přestane reagovat, objekty mezi protilehlými stránkami" # mt
welcome.news.v0_50_2_body = "Tato verze opravuje dvě hlášení k 0.50.1. Soubor PDF/X se vytváří pro profil CMYK samotné kresby, například U.S. Web Coated (SWOP) v2, kde vždy uváděl FOGRA39. Prolnutí uvnitř ořezového rámečku si zachová své kroky, když se jako obrázek exportuje jen výběr, kde vycházely jako schody." # mt
welcome.news.v0_50_2_title = "Opravy: výstupní podmínka PDF/X a prolnutí v exportovaných obrázcích" # mt
welcome.news.v0_50_1_body = "Tato verze opravuje to, co jste nahlásili u 0.50.0. Ve Windows Nápověda > Aktualizace dokončí instalaci, i když Průzkumník zobrazuje obrázky .cdr, a oznámí, když se aktualizace nedokončila. U protilehlých stránek zůstávají společně vybrané objekty obou stránek na své stránce. Oddělení skupiny zachová stín skupiny, Soubor > Vrátit funguje pro kresby otevřené z .cdr, SVG nebo PDF a Uložit jako na Macu znovu ukazuje typ a verzi. Soubory .cdr verze 15 se otevírají se stíny a průhlednostmi a Nápověda krok za krokem ukazuje, jak používat Generátor tvarů a nové nástroje verze 0.50." # mt
welcome.news.v0_50_1_title = "Opravy: aktualizace ve Windows, protilehlé stránky, oddělení skupiny, Vrátit a Uložit jako" # mt
welcome.news.v0_50_0_body = "Obálky mají síť, která ohýbá tvary i obrázky, a Objekt > Kombinovat tvary rozdělí, sloučí a ořízne překrývající se objekty jedním krokem. Pero zakřivení kreslí hladké křivky kliknutými body, text se z panelu textu ohne do kruhu, oblouku a vlny a objekty přizpůsobené cestě ji živě sledují. Efekty vrstev přidávají drsné okraje, skicovou výplň, ořezové značky a měkké okraje, přechody mohou mít rozptyl a volné barevné body a výplně mohou být holografické. 3D rotace, Světelný odlesk, Transformovat každý a Sloučit průhlednost jsou nové a rozhraní je ve vietnamštině. Tato verze také opravuje mnoho nahlášených chyb, od tisku a importu PDF po ukládání .cdr a vektorizaci." # mt
welcome.news.v0_50_0_title = "Síťové obálky, Kombinace tvarů, Pero zakřivení a živé efekty" # mt
welcome.news.v0_49_0_body = "Tato verze přináší opravy. Uložení, které v polovině selže, už neztratí soubor, který nahrazovalo, a automatické zálohy dvou TraceDraw nebo dvou kreseb stejného jména se už navzájem nepřepisují. Velké kresby zůstávají rychlé: Seskupit, Kombinovat, Zrušit seskupení a Zpět u desítek tisíc objektů trvají zlomek sekundy a hluboce vnořené kresby se znovu otevírají. Kresba uložená jako .cdr si ponechá skryté vrstvy, vzorkové a síťové výplně, emoji, zalomení řádků i přechody přímých barev. Soubory PDF, SVG, EPS a EMF se načítají i ukládají blíže tomu, co ukazují: text s obrysem, přechody, plynulé průhlednosti, otočené obrázky, hebrejština a arabština. Převést na křivky zachová barvu každého slova, vodítko lze uchopit nad jakýmkoli objektem a Kombinovat vybere výsledek. Ve Windows už TraceDraw nezpomaluje celý počítač spouštěním procesu každých pár sekund a na tabletech se Shift, Ctrl a Alt zamknou dvěma klepnutími." # mt
welcome.news.v0_49_0_title = "Bezpečnější ukládání, věrnější import a rychlejší velké kresby" # mt
welcome.news.v0_48_0_body = "Tato verze přináší opravy. V textu Shift+Enter zalomí řádek, číslované odrážky jsou opět čitelné, iniciály dodržují nastavený počet řádků a Převést na křivky zachová překrývající se písmena. Vektorizace běží v okně s průběhem a tlačítkem Zrušit, takže program už nevypadá zamrzle. Exportované obrázky zachovají všechny okraje stránky bez světlé čáry na okraji a ukládání do .cdr už nevynechává čáry nulové délky. Importované obrázky si ponechají barevný režim, klony v souborech .cdr zůstanou propojené s originálem a vzorkové průhlednosti i písma zprava doleva z .cdr se otevřou. Na dotykových obrazovkách Pero pokračuje od posledního uzlu, 2bodová čára sleduje prst a řádky panelu Objekty lze přetahovat. Vodítka mají nabídku v panelu Objekty, mřížka začíná nahoře na stránce a soubor DXF s hluboce vnořenými bloky už nevyčerpá paměť. Klasické soubory .ai z vektorizačních programů se otevřou barevně a seskupené a Enter v polích Obrysu obrys použije." # mt
welcome.news.v0_48_0_title = "Opravy textu, vektorizace, exportu a dotykových obrazovek" # mt
